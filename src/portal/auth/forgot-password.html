<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nexus Hub - Forgot password</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #08111f;
      --panel: #101c2d;
      --text: #edf5ff;
      --muted: #9fb1c8;
      --accent: #42c6ff;
      --border: rgba(255, 255, 255, 0.14);
      --danger: #ff6b7a;
      --success: #6ee7a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.45; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
    }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #03111d;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: 0.7; }
    .message { min-height: 22px; margin-top: 16px; font-size: 14px; }
    .message.error { color: var(--danger); }
    .message.success { color: var(--success); }
  </style>
</head>
<body>
  <main>
    <h1>Forgot password</h1>
    <p>Enter your account email. If it matches an email-password account, Nexus Hub will send a reset link.</p>
    <form id="forgot-password-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button id="submit" type="submit">Send reset link</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('forgot-password-form');
    const email = document.getElementById('email');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');

    function setMessage(text, kind) {
      message.textContent = text;
      message.className = 'message ' + (kind || '');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      setMessage('', '');
      try {
        const response = await fetch('/api/v1/auth/password-reset/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value.trim() }),
        });
        if (!response.ok) throw new Error('request failed');
        setMessage('If that email is registered, a reset link is on the way.', 'success');
      } catch {
        setMessage('Could not request a reset link. Try again in a moment.', 'error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
