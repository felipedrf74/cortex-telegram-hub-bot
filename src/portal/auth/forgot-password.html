<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nexus Hub - Forgot password</title>
  <link rel="stylesheet" href="/portal/ui/auth-forgot-password.css">
</head>
<body>
  <main>
    <h1>Forgot password</h1>
    <p>Enter your account email. If it matches an email-password account, Nexus Hub will send a reset link.</p>
    <form id="forgot-password-form" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button id="submit" type="submit">Send reset link</button>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script src="/portal/ui/auth-forgot-password.js"></script>
</body>
</html>
