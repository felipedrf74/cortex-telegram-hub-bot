name: Weekly — Release pipeline housekeeping

# release-pipeline-risk-based-optimization (2026-05-03) — Round 4.
#
# Once per week (Sundays 06:00 UTC) the housekeeping script runs:
#   1. Prune ignored local smoke/evaluation evidence
#   2. Regenerate and validate the project map
#   3. Enforce the documentation policy
#
# This is the lazy operator's friend: stuff that needs to happen
# periodically but doesn't otherwise have an explicit owner.
#
# Manual run:
#   gh workflow run "Weekly — Release pipeline housekeeping"
#
# This workflow does not push generated output back to Git.

on:
  schedule:
    - cron: '0 6 * * 0'   # Sundays 06:00 UTC
  workflow_dispatch:

jobs:
  housekeeping:
    name: 🧹 Housekeeping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'
          cache: 'npm'

      - name: Run housekeeping (dry-run)
        run: |
          chmod +x scripts/release-pipeline-housekeeping.sh
          scripts/release-pipeline-housekeeping.sh

      - name: Show docs:audit summary
        run: node scripts/audit-docs.mjs --json | head -200
