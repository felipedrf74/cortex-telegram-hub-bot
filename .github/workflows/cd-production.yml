name: CD — Deploy to Production

# MANUAL ONLY — GitHub Actions runners can't reach the server (IPv6-only).
# Deploy from your Mac using: ./scripts/deploy.sh
# This workflow is available for future use when the server has a stable public endpoint.
on:
  workflow_dispatch:
    inputs:
      rollback_version:
        description: 'Version to rollback to (e.g., v4.4.1). Leave empty for normal deploy.'
        required: false
        default: ''

env:
  SERVER: dominguez@serverdominguez
  REMOTE_DIR: /home/dominguez/telegram-hub-bot  # TODO: rename to nexus-hub
  PM2: /home/dominguez/.npm-global/bin/pm2

jobs:
  pre-deploy:
    name: ✅ Pre-Deploy Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_rollback: ${{ steps.check.outputs.is_rollback }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine deploy type
        id: check
        run: |
          if [ -n "${{ github.event.inputs.rollback_version }}" ]; then
            echo "is_rollback=true" >> $GITHUB_OUTPUT
          else
            echo "is_rollback=false" >> $GITHUB_OUTPUT
          fi

      - name: Get version
        id: version
        run: |
          if [ "${{ steps.check.outputs.is_rollback }}" = "true" ]; then
            echo "version=${{ github.event.inputs.rollback_version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          fi

  backup:
    name: 💾 Backup Current
    runs-on: ubuntu-latest
    needs: pre-deploy
    steps:
      - name: Create backup on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            BACKUP_DIR="/home/dominguez/backups/nexushub"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            CURRENT_VERSION=$(node -p "require('${{ env.REMOTE_DIR }}/package.json').version" 2>/dev/null || echo "unknown")
            mkdir -p "$BACKUP_DIR"
            tar czf "$BACKUP_DIR/${CURRENT_VERSION}_${TIMESTAMP}.tar.gz" \
              -C "${{ env.REMOTE_DIR }}" \
              dist/ prompts/ migrations/ package.json package-lock.json ecosystem.config.js \
              content-engine/main.py content-engine/config.py content-engine/requirements.txt \
              content-engine/services/ content-engine/routers/ content-engine/models/ \
              content-engine/searchers/ 2>/dev/null || true
            ls -t "$BACKUP_DIR"/*.tar.gz | tail -n +11 | xargs rm -f 2>/dev/null || true

  deploy:
    name: 🚀 Deploy ${{ needs.pre-deploy.outputs.version }}
    runs-on: ubuntu-latest
    needs: [pre-deploy, backup]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Stop services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export PATH=$PATH:$(dirname ${{ env.PM2 }})
            ${{ env.PM2 }} stop nexus-hub 2>/dev/null || true
            ${{ env.PM2 }} stop content-engine 2>/dev/null || true

      - name: Sync files
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.env' --exclude='data/' --exclude='logs/' --exclude='node_modules/' --exclude='content-engine/.venv/' --exclude='content-engine/data/' --exclude='.git/'
          path: ./
          remote_path: ${{ env.REMOTE_DIR }}/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Install deps & start
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export PATH=$PATH:$(dirname ${{ env.PM2 }})
            cd ${{ env.REMOTE_DIR }}
            npm ci --production
            ${{ env.PM2 }} start content-engine 2>/dev/null || true
            ${{ env.PM2 }} start nexus-hub
            ${{ env.PM2 }} save

  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for startup
        run: sleep 10

      - name: Check services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export PATH=$PATH:$(dirname ${{ env.PM2 }})
            BOT_STATUS=$(${{ env.PM2 }} jlist | node -pe "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).find(p=>p.name==='nexus-hub')?.pm2_env?.status" 2>/dev/null)
            if [ "$BOT_STATUS" = "online" ]; then
              echo "✅ nexus-hub: online"
            else
              echo "❌ nexus-hub: $BOT_STATUS"
              exit 1
            fi

  notify:
    name: 📋 Update Notion
    runs-on: ubuntu-latest
    needs: [pre-deploy, health-check]
    if: always()
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_RELEASES_DB: ${{ secrets.NOTION_RELEASES_DB }}
    steps:
      - uses: actions/checkout@v4

      - name: Update Notion release log
        if: ${{ env.NOTION_TOKEN != '' }}
        run: |
          STATUS=${{ needs.health-check.result == 'success' && '✅ Success' || '❌ Failed' }}
          VERSION="${{ needs.pre-deploy.outputs.version }}"
          TYPE=${{ needs.pre-deploy.outputs.is_rollback == 'true' && 'Rollback' || 'Deploy' }}
          
          curl -s -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            -d "{
              \"parent\": { \"database_id\": \"$NOTION_RELEASES_DB\" },
              \"properties\": {
                \"Release\": { \"title\": [{ \"text\": { \"content\": \"$VERSION\" } }] },
                \"Status\": { \"select\": { \"name\": \"$STATUS\" } },
                \"Type\": { \"select\": { \"name\": \"$TYPE\" } },
                \"Environment\": { \"select\": { \"name\": \"Production\" } },
                \"Date\": { \"date\": { \"start\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" } },
                \"Commit\": { \"rich_text\": [{ \"text\": { \"content\": \"${GITHUB_SHA:0:8}\" } }] },
                \"Author\": { \"rich_text\": [{ \"text\": { \"content\": \"$GITHUB_ACTOR\" } }] }
              }
            }" && echo "✅ Notion release logged" || echo "⚠️  Notion update failed"
