name: CD — Legacy Production Deploy (disabled)

# The repository-sync deploy stopped production before installing dependencies
# and was not bound to the signed immutable release artifact. It remains as a
# visible, fail-closed entry point during the two-release transition so an
# operator cannot accidentally invoke the retired path.
on:
  workflow_dispatch:

permissions: {}

jobs:
  blocked:
    name: Use the exact release operator
    runs-on: ubuntu-latest
    steps:
      - name: Reject the legacy deploy path
        run: |
          echo "This workflow is intentionally disabled."
          echo "Prepare and validate the signed artifact, then use release:staging and release:promote."
          exit 1
