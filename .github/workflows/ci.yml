name: CI — Risk-based parallel matrix

# release-pipeline-risk-based-optimization (2026-05-03):
# Refactored from the serial `lint → test → build` chain into a parallel
# matrix that runs typecheck, focused tests, migration check, Python
# compile, and build concurrently. Successful protected-main completion of this
# governed selected gate authorizes hosted publication; the full and four-shard
# suites remain explicit manual diagnostics rather than a second checkpoint.
#
# Decisions encoded here:
#   1. lint, focused-tests, migrations, python-test, build run IN
#      PARALLEL after install. None depend on each other.
#   2. focused-tests delegates to scripts/risk-gate.sh. PRs and main use one
#      changed-area-selected risk-gate run; broader full-suite commands are
#      operator diagnostics.
#   3. python-test runs the full content-engine pytest suite when
#      content-engine/** changed.
#   4. build runs unconditionally as a "does dist still build" check.
#
# continuous-deployment refactor (2026-08-07):
#   5. Every job here runs on the TEST runner and is test-only. It is granted no
#      Docker socket, no production secrets, no deploy key, and no production
#      audit-receipt access. Image production and publication live in release.yml on a
#      hosted x86_64 runner, which is the only job that touches a registry.
#   6. The public repository never runs pull-request code on the persistent
#      Raspberry Pi. After its readiness probe passes, only trusted pushes to
#      `develop` may use it. Pull requests and protected-main pushes always run
#      on ephemeral hosted CI, so an untrusted fork cannot persist on the Pi and
#      the Pi cannot attest the conclusion that unlocks release signing.
#   7. SonarQube is decommissioned. Static quality evidence is the changed-area
#      classifier, the risk gate, lint, typecheck, tests, the dependency and
#      security workflow, and the docs audit.
#
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Latest-green: a newer push to the same ref supersedes an in-flight run. On
# protected main that means the newest green commit is the release candidate and
# older pre-production candidates are cancelled rather than racing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'
  # The required security workflow owns dependency vulnerability gating.
  # Preserve exact lockfile installs while suppressing duplicate advisory and
  # funding calls and preferring setup-node's integrity-checked package cache.
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_PREFER_OFFLINE: 'true'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  # ═══════════════════════════════════════════════════
  # TEST RUNNER SELECTION
  # ═══════════════════════════════════════════════════
  # The Pi is unverified hardware until scripts/pi-runner-readiness.mjs passes on
  # it. Set the repository variable NEXUS_CI_TEST_RUNNER to `pi` only after that.
  # Because this repository is public, the Pi is eligible only for trusted
  # `develop` pushes; every pull request and protected-main push uses ephemeral
  # hosted CI. Set the variable back to anything else for a hosted-only fallback.
  # Tests never run on production hardware in either case.
  runner:
    name: 🖥️ Resolve test runner
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.select.outputs.labels }}
      is_self_hosted: ${{ steps.select.outputs.is_self_hosted }}
    steps:
      - name: Select runner labels
        id: select
        env:
          SELECTION: ${{ vars.NEXUS_CI_TEST_RUNNER }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ] \
              && [ "$EVENT_REF" = "refs/heads/develop" ] \
              && [ "$SELECTION" = "pi" ]; then
            echo 'labels=["self-hosted","linux","ARM64","nexus-pi"]' >> "$GITHUB_OUTPUT"
            echo 'is_self_hosted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'labels=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'is_self_hosted=false' >> "$GITHUB_OUTPUT"
          fi

  # ═══════════════════════════════════════════════════
  # TEST-ONLY RUNNER GUARDRAILS
  # ═══════════════════════════════════════════════════
  # Fails the run if the test runner can see a Docker socket, a production env
  # file, the audit-mirror deploy key/receipt access, or the production state path. A test
  # runner that can reach any of those is not test-only, whatever the docs say.
  runner_guardrails:
    name: 🔒 Test-runner is test-only
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    needs: runner
    # The JOB always runs; only the guard STEP is conditional.
    #
    # A job-level `if:` made this job *skip* on hosted runners, and every
    # substantive job declares `needs: runner_guardrails`. GitHub skips a
    # dependent whose dependency was skipped, so the hosted fallback silently
    # skipped classify, lint, tests — the whole gate — while reporting green.
    # Running the job unconditionally keeps the dependency edge satisfied on
    # hosted runners without weakening the self-hosted guard.
    #
    # Deliberately NO checkout and NO repository code.
    #
    # A guard that checks out the pull request and then runs a probe *from that
    # checkout* is not a security boundary: the pull request can edit the probe.
    # The check therefore runs a host-installed script that lives outside the
    # workspace and is owned by root, and it runs before any job that touches
    # repository content — every self-hosted job declares `needs:
    # runner_guardrails`.
    #
    # The script is installed by ops/nexus-release/README.md §11 from
    # ops/pi-runner/nexus-pi-guardrails, and it is the OS-level statement of what
    # this runner may reach. Repository code cannot weaken it.
    steps:
      - name: Hosted runner needs no deployment guard
        if: needs.runner.outputs.is_self_hosted != 'true'
        run: |
          echo "GitHub-hosted runner: ephemeral, no host deployment capability to assert."

      - name: Assert the runner holds no deployment capability
        if: needs.runner.outputs.is_self_hosted == 'true'
        run: |
          set -euo pipefail
          GUARD=/usr/local/sbin/nexus-pi-guardrails
          if [ ! -x "$GUARD" ]; then
            echo "::error::$GUARD is missing; the self-hosted runner is not provisioned" >&2
            echo "::error::install it from ops/pi-runner/nexus-pi-guardrails as root" >&2
            exit 1
          fi
          # Immutability is positive, not "the runner cannot write it right now".
          # `-w` is false for a root-owned 0777 file when the test runs as root's
          # peer, and it says nothing about a group-writable parent directory that
          # would let the runner replace the guard wholesale.
          assert_trusted() {
            local target="$1" label="$2"
            local owner mode
            owner="$(stat -c '%u' "$target")"
            mode="$(stat -c '%a' "$target")"
            if [ "$owner" != "0" ]; then
              echo "::error::$label is not owned by root (uid $owner)" >&2
              exit 1
            fi
            # Reject any group- or other-writable bit.
            if [ "$(( 8#$mode & 8#022 ))" -ne 0 ]; then
              echo "::error::$label is group- or world-writable (mode $mode)" >&2
              exit 1
            fi
          }
          assert_trusted "$GUARD" "$GUARD"
          assert_trusted "$(dirname "$GUARD")" "$(dirname "$GUARD") (guard parent directory)"
          if [ -L "$GUARD" ]; then
            echo "::error::$GUARD is a symlink; the target is not the audited guard" >&2
            exit 1
          fi
          "$GUARD" --json

  # ═══════════════════════════════════════════════════
  # CHANGED-AREA CLASSIFIER (drives the rest)
  # ═══════════════════════════════════════════════════
  classify:
    name: 🧭 Classify changes
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    needs: [runner, runner_guardrails]
    outputs:
      vitest_mode: ${{ steps.classify.outputs.vitest_mode }}
      vitest_globs: ${{ steps.classify.outputs.vitest_globs }}
      run_python_test: ${{ steps.classify.outputs.run_python_test }}
      run_migrations: ${{ steps.classify.outputs.run_migrations }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      test_cleanup: ${{ steps.classify.outputs.test_cleanup }}
      selected_groups: ${{ steps.classify.outputs.selected_groups }}
      ios_contract: ${{ steps.classify.outputs.ios_contract }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # need history to diff against base

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run classifier
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_REF=""
          # github.event.before is the only push identity that covers every
          # commit in a multi-commit delivery. Missing or unsafe ancestry is a
          # classification error; ordinary CI never substitutes the full suite.
          if ! BASE_REF="$(bash scripts/resolve-ci-change-base.sh)"; then
            BASE_REF=""
          fi
          test -n "$BASE_REF" || {
            echo "Change base is missing or unsafe; refusing partial classification." >&2
            exit 1
          }
          echo "base_sha=$BASE_REF" >> "$GITHUB_OUTPUT"
          TEST_CLEANUP="$(node scripts/test-cleanup-classifier.mjs --base "$BASE_REF" --field requiresMutation)"
          chmod +x scripts/changed-area-classifier.sh
          JSON="$(scripts/changed-area-classifier.sh --base "$BASE_REF" --format json)"
          echo "$JSON" > /tmp/classifier.json
          echo "$JSON"
          MODE="$(jq -r '.vitest["mode"]' /tmp/classifier.json)"
          GLOBS="$(jq -r '.vitest.globs | join(" ")' /tmp/classifier.json)"
          PY="$(jq -r '.flags.pythonEngine' /tmp/classifier.json)"
          MIG="$(jq -r '.flags.migration' /tmp/classifier.json)"
          DOCS_ONLY="$(jq -r '.flags.docsOnly' /tmp/classifier.json)"
          SELECTED_GROUPS="$(jq -c '.vitest.groups' /tmp/classifier.json)"
          echo "vitest_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "vitest_globs=$GLOBS" >> "$GITHUB_OUTPUT"
          echo "run_python_test=$PY" >> "$GITHUB_OUTPUT"
          echo "run_migrations=$MIG" >> "$GITHUB_OUTPUT"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "test_cleanup=$TEST_CLEANUP" >> "$GITHUB_OUTPUT"
          echo "selected_groups=$SELECTED_GROUPS" >> "$GITHUB_OUTPUT"
          IOS_CONTRACT="$(node scripts/ios-contract-change-check.mjs --base "$BASE_REF")"
          echo "ios_contract=$IOS_CONTRACT" >> "$GITHUB_OUTPUT"

  mutation_cleanup:
    name: 🧬 Test-cleanup mutation protection
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 45
    needs: [runner, runner_guardrails, classify]
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.test_cleanup == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Mutate the deleted test's mapped behavior owner
        run: npm run test:mutation -- --base '${{ needs.classify.outputs.base_sha }}' --scope test-cleanup
      - name: Upload mutation plan and score
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/mutation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # LINT & TYPE CHECK (parallel — no `needs` chain)
  # ═══════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    needs: [runner, runner_guardrails, classify]
    if: ${{ needs.classify.outputs.docs_only != 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The advisory documentation audit resolves historical release SHAs.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Project map freshness
        run: npm run project:map:check

      - name: Migration replay governance
        run: npm run test:migration-hook-lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint prompts (no empty files)
        run: |
          for f in prompts/*.md; do
            if [ ! -s "$f" ]; then
              echo "❌ Empty prompt file: $f"
              exit 1
            fi
          done
          echo "✅ All prompt files have content"

      - name: vi.mock completeness lint
        # Gating against scripts/.vi-mock-baseline.txt. Lower the baseline
        # monthly until partial factories are effectively eliminated.
        run: node scripts/vi-mock-completeness-lint.mjs --top --strict

      - name: release-doc drift check (advisor)
        # Verifies short SHAs in current/QA docs resolve to commits in
        # engine + ios history. Non-gating during the soak window.
        run: scripts/release-doc-drift-check.sh || true

      - name: closed-beta identity scan (strict, gating)
        # Catches v4.14.118-class hardcoded-founder-identity residue in
        # runtime code (prompts, persisted-payload writers, etc.).
        # Closed-beta-readiness-hardening (2026-05-03): promoted from
        # advisor (`|| true`) to strict gating. Any new flagged literal
        # in src/, prompts/, content-engine/, src/skills/ that isn't
        # explicitly allow-listed (copyright headers, manifest authors,
        # backward-compat reads tagged `nx-allow-identity-scan`,
        # tests/fixtures) blocks the PR. Run locally via
        # `./scripts/closed-beta-identity-scan.sh --strict` to
        # reproduce.
        run: scripts/closed-beta-identity-scan.sh --strict

  # ═══════════════════════════════════════════════════
  # SINGLE FOCUSED VITEST INVOCATION (driven by group classifier)
  # ═══════════════════════════════════════════════════
  docs_and_secrets:
    name: 📚 Docs & secrets
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    needs: [runner, runner_guardrails, classify]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Enforce documentation policy
        run: node scripts/audit-docs.mjs --strict
      - name: Scan added lines for secrets
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          test -n "$BASE"
          node scripts/changed-secret-scan.mjs --base "$BASE"
  test_focused:
    name: 🧪 Focused tests
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    # Multi-area changes can conservatively select every group with coverage;
    # keep enough headroom for Vitest to emit its governed result artifact.
    timeout-minutes: 45
    needs: [runner, runner_guardrails, classify]
    if: ${{ needs.classify.outputs.vitest_mode == 'focused' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Verify exact checked-out source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROTECTED_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_HEAD_SHA"
            test "$(git rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
            git merge-base --is-ancestor "$PR_HEAD_SHA" "$HEAD_SHA"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run focused Vitest gate
        if: ${{ needs.classify.outputs.vitest_mode == 'focused' }}
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
          NEXUS_RISK_GATE_JSON_OUTPUT: .local/ci-evidence/vitest-results-selected.json
          NEXUS_TEST_SELECTION_OUTPUT: .local/ci-evidence/test-selection.json
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          test -n "$BASE"
          scripts/risk-gate.sh \
            --base "$BASE" \
            --coverage \
            --skip-typecheck \
            --skip-python \
            --skip-migrations

      - name: Record docs-only exact selection without Vitest
        if: ${{ needs.classify.outputs.vitest_mode == 'skip' }}
        run: |
          mkdir -p .local/ci-evidence
          BASE='${{ needs.classify.outputs.base_sha }}'
          test -n "$BASE"
          scripts/changed-area-classifier.sh --base "$BASE" --json > .local/ci-evidence/classifier.json
          node scripts/select-vitest-files.mjs \
            --base "$BASE" \
            --classifier .local/ci-evidence/classifier.json \
            --output .local/ci-evidence/test-selection.json >/dev/null

      - name: Upload exact protected-main selected result
        if: ${{ always() && needs.classify.outputs.vitest_mode == 'focused' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-main-vitest-${{ github.run_id }}-${{ github.run_attempt }}-selected
          path: .local/ci-evidence/vitest-results-selected.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact protected-main test selection
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-main-test-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-evidence/test-selection.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload selected-test coverage
        if: ${{ always() && needs.classify.outputs.vitest_mode == 'focused' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selected-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/coverage/selected/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # ═══════════════════════════════════════════════════
  # SHARED BACKEND↔iOS CONTRACT TESTS (changed-contract only)
  # ═══════════════════════════════════════════════════
  # These are backend contract tests over the fixture the iOS client decodes.
  # This is the six-example backend release fixture test (Dashboard Home,
  # Training Home, Content Home, plan-created, plan-needs-clarification, and
  # generation-attempt-created). It is NOT an iOS test run: no simulator,
  # signed build, or device. It does not claim health, auth, push/APNs, or
  # capability-manifest coverage. Broad iOS smoke belongs to app distribution
  # on the iOS repository's own cadence (ADR-0013).
  ios_contract:
    name: 📱 Backend/iOS fixture contracts
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    needs: [runner, runner_guardrails, classify]
    if: needs.classify.outputs.ios_contract == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Report which fixture-owner paths triggered this run
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          node scripts/ios-contract-change-check.mjs --base "$BASE" --json

      - name: Run six backend/iOS fixture contract examples
        env:
          NODE_ENV: test
          DATABASE_PATH: ':memory:'
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
        run: npx vitest run __tests__/scripts/backend-ios-contract-fixture.test.ts

  test:
    # Keep this aggregate check-run name stable because the main-branch
    # ruleset requires the exact `🧪 Tests` context. Pull requests bind the
    # single selected-test run and any applicable test-cleanup mutation gate
    # into this required context.
    name: 🧪 Tests
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    needs: [runner, runner_guardrails, classify, lint, build, docs_and_secrets, mutation_cleanup, test_focused, python-test, migrations, science_policy, ios_contract]
    if: ${{ always() }}
    steps:
      - name: Verify selected test lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROTECTED_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VITEST_MODE: ${{ needs.classify.outputs.vitest_mode }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          TEST_CLEANUP: ${{ needs.classify.outputs.test_cleanup }}
          MUTATION_RESULT: ${{ needs.mutation_cleanup.result }}
          DOCS_RESULT: ${{ needs.docs_and_secrets.result }}
          PYTHON_REQUIRED: ${{ needs.classify.outputs.run_python_test }}
          PYTHON_RESULT: ${{ needs.python-test.result }}
          MIGRATIONS_REQUIRED: ${{ needs.classify.outputs.run_migrations }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          IOS_CONTRACT_REQUIRED: ${{ needs.classify.outputs.ios_contract }}
          IOS_CONTRACT_RESULT: ${{ needs.ios_contract.result }}
          SELF_HOSTED: ${{ needs.runner.outputs.is_self_hosted }}
          GUARDRAILS_RESULT: ${{ needs.runner_guardrails.result }}
          SCIENCE_POLICY_RESULT: ${{ needs.science_policy.result }}
          FOCUSED_RESULT: ${{ needs.test_focused.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"

          test "$DOCS_RESULT" = "success"

          # These jobs skip only on docs-only pull requests. Protected-main
          # pushes always compile and typecheck, even when the delta is docs-only,
          # because this aggregate is the exact required ruleset context.
          if [ "$DOCS_ONLY" = "true" ] && [ "$PROTECTED_MAIN" != "true" ]; then
            test "$LINT_RESULT" = "skipped"
            test "$BUILD_RESULT" = "skipped"
          else
            test "$LINT_RESULT" = "success"
            test "$BUILD_RESULT" = "success"
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$TEST_CLEANUP" = "true" ]; then
            test "$MUTATION_RESULT" = "success"
          else
            test "$MUTATION_RESULT" = "skipped"
          fi

          if [ "$PYTHON_REQUIRED" = "true" ]; then
            test "$PYTHON_RESULT" = "success"
          else
            test "$PYTHON_RESULT" = "skipped"
          fi

          # A protected-main push always needs a migration verdict for the
          # release manifest, whether or not migrations/** changed.
          if [ "$MIGRATIONS_REQUIRED" = "true" ] || [ "$PROTECTED_MAIN" = "true" ]; then
            test "$MIGRATIONS_RESULT" = "success"
          else
            test "$MIGRATIONS_RESULT" = "skipped"
          fi

          # The guardrails job runs on every runner so that `needs:
          # runner_guardrails` cannot skip-propagate through the hosted fallback.
          # It must therefore SUCCEED in both cases — asserting `skipped` on
          # hosted runners would fail the required check on every PR.
          # On hosted runners the job succeeds having asserted nothing, because an
          # ephemeral GitHub runner has no host deployment capability to hold.
          test "$GUARDRAILS_RESULT" = "success"

          # The six-example backend/iOS fixture test runs only when one of its
          # exact payload, packaging, validation, or test owners changes. A
          # broad backend-triggered iOS gate is deliberately gone: it blocked
          # every unattended deploy waiting on a human with a phone.
          if [ "$IOS_CONTRACT_REQUIRED" = "true" ]; then
            test "$IOS_CONTRACT_RESULT" = "success"
          else
            test "$IOS_CONTRACT_RESULT" = "skipped"
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            test "$SCIENCE_POLICY_RESULT" = "skipped"
          else
            test "$SCIENCE_POLICY_RESULT" = "success"
          fi

          case "$VITEST_MODE" in
            skip)
              if [ "$PROTECTED_MAIN" = "true" ]; then
                test "$FOCUSED_RESULT" = "success"
              else
                test "$FOCUSED_RESULT" = "skipped"
              fi
              ;;
            focused)
              test "$FOCUSED_RESULT" = "success"
              ;;
            *)
              echo "Unexpected Vitest mode: $VITEST_MODE" >&2
              exit 1
              ;;
          esac

  # ═══════════════════════════════════════════════════
  # BUILD VERIFICATION (parallel; no `needs: test`)
  # ═══════════════════════════════════════════════════
  # This is a compile check only. The deployable artifact is now a container
  # image built and pushed by release.yml on a hosted x86_64 runner; the image
  # digest is the manifest, so the bundle, checksum-manifest and
  # artifact-manifest chain this job used to run has been removed rather than
  # duplicated. Nothing here produces or publishes a release artifact.
  build:
    name: 🔨 Build
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    needs: [runner, runner_guardrails, classify]
    if: ${{ needs.classify.outputs.docs_only != 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js || { echo "❌ dist/index.js not found"; exit 1; }
          test -f dist/tools/run-release-migrations.js || {
            echo "❌ dist/tools/run-release-migrations.js not found — the release"
            echo "   migrator service would have nothing to run."
            exit 1
          }
          echo "✅ Build output verified"

  # ═══════════════════════════════════════════════════
  # PYTHON CONTENT-ENGINE (only when content-engine/** changed)
  # ═══════════════════════════════════════════════════
  python-test:
    name: 🐍 Content Engine Check
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    needs: [runner, runner_guardrails, classify]
    if: needs.classify.outputs.run_python_test == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.3'
          cache: 'pip'
          cache-dependency-path: |
            content-engine/requirements.txt
            content-engine/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd content-engine
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Syntax check
        run: |
          cd content-engine
          python -m py_compile main.py
          python -m py_compile config.py
          find . -name "*.py" -not -path "./.venv/*" -not -path "./__pycache__/*" \
            -exec python -m py_compile {} \;
          echo "✅ All Python files compile"

      - name: Python content-engine tests
        run: |
          cd content-engine
          python -m pytest tests/ -v

  # ═══════════════════════════════════════════════════
  # SCIENCE-POLICY VERSION GATE (always — fail-closed)
  # ═══════════════════════════════════════════════════
  # R4 P2 fix — Codex caught that the gate only existed as a script
  # under scripts/ci/, with no CI workflow or pre-commit hook calling
  # it. That meant any change to training-principles.json could land
  # without bumping `sciencePolicyVersion`, breaking the audit /
  # reproducibility invariant. This job runs unconditionally on every
  # push and PR (the check is millisecond-cheap) and fails the build
  # when the JSON content hash drifts from the pinned hash without a
  # corresponding version bump.
  science_policy:
    name: 🧪 Science-policy version
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    needs: [runner, runner_guardrails, classify]
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify training-principles content hash matches pinned version
        run: node scripts/ci/science-policy-version-check.mjs

  # ═══════════════════════════════════════════════════
  # MIGRATION SAFETY CHECK (only when migrations/** changed)
  # ═══════════════════════════════════════════════════
  migrations:
    name: 🗃️ Migration Check
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    needs: [runner, runner_guardrails, classify]
    # Runs whenever migrations changed, AND always on a protected-main push: the
    # signed release manifest must carry a cdEligibility verdict for every
    # release, including one whose delta touches no migration at all.
    if: ${{ needs.classify.outputs.run_migrations == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Scan migration sequence, cumulative apply, and review subject
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          mkdir -p .local/ci-evidence
          # --emit-inventory is required: the signed manifest binds the complete
          # ordered migration inventory, and the deployment host reconciles that
          # inventory against the production ledger. Eligibility from the change
          # delta alone cannot see a migration an earlier blocked release left
          # pending.
          migration_scan_status=0
          if [ -n "$BASE" ]; then
            node scripts/migration-safety-check.mjs \
              --base "$BASE" \
              --changed-only \
              --approval-mode scan \
              --emit-inventory \
              --json > .local/ci-evidence/migration-safety.json \
              || migration_scan_status=$?
          else
            node scripts/migration-safety-check.mjs \
              --emit-inventory \
              --json > .local/ci-evidence/migration-safety.json \
              || migration_scan_status=$?
          fi
          MIGRATION_SCAN_STATUS="$migration_scan_status" node -e "
            const fs = require('node:fs');
            const scannerStatus = Number(process.env.MIGRATION_SCAN_STATUS);
            let result;
            try {
              result = JSON.parse(fs.readFileSync(
                '.local/ci-evidence/migration-safety.json',
                'utf8',
              ));
            } catch (error) {
              console.error('migration safety scan failed');
              console.error('scanner exit status =', process.env.MIGRATION_SCAN_STATUS);
              console.error('migration verdict JSON is unreadable:', error.message);
              process.exit(1);
            }
            if (!Number.isSafeInteger(scannerStatus) || scannerStatus !== 0 || !result.ok) {
              console.error('migration safety scan failed');
              console.error('scanner exit status =', process.env.MIGRATION_SCAN_STATUS);
              for (const error of result.errors || []) console.error(error);
              process.exit(1);
            }
            const cd = result.cdEligibility;
            if (!Array.isArray(result.migrationInventory) || result.migrationInventory.length === 0) {
              console.error('migration verdict carries no inventory; --emit-inventory is required');
              process.exit(1);
            }
            console.log('inventory entries =', result.migrationInventory.length);
            console.log('cdEligibility.eligible =', cd.eligible);
            console.log('cdEligibility.predecessorCompatible =', cd.predecessorCompatible);
            if (!cd.eligible) {
              console.log('reasons:', cd.reasons.join(', '));
              console.log(
                'This release is not eligible for unattended deployment. The container'
                + ' maintenance executor is not implemented; owner policy is required.'
              );
            }
          "

      # The verdict is produced on the test runner and consumed by the hosted
      # builder. The Pi never signs or publishes anything.
      - name: Upload the migration verdict for the release manifest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-safety-${{ github.sha }}
          path: .local/ci-evidence/migration-safety.json
          if-no-files-found: error
          retention-days: 30
