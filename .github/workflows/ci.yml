name: CI — Risk-based parallel matrix

# release-pipeline-risk-based-optimization (2026-05-03):
# Refactored from the serial `lint → test → build` chain into a parallel
# matrix that runs typecheck, focused tests, migration check, Python
# compile, and build concurrently. Complete deterministic verification is
# owned exclusively by the explicit release-checkpoint workflow.
#
# Decisions encoded here:
#   1. lint, focused-tests, migrations, python-test, build run IN
#      PARALLEL after install. None depend on each other.
#   2. focused-tests delegates to scripts/risk-gate.sh. PRs and main use one
#      affected-group run; full breadth lives only in the explicit checkpoint.
#   3. python-test runs the full content-engine pytest suite when
#      content-engine/** changed.
#   4. build runs unconditionally as a "does dist still build" check.
#
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'
  # The required security workflow owns dependency vulnerability gating.
  # Preserve exact lockfile installs while suppressing duplicate advisory and
  # funding calls and preferring setup-node's integrity-checked package cache.
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_PREFER_OFFLINE: 'true'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  # ═══════════════════════════════════════════════════
  # CHANGED-AREA CLASSIFIER (drives the rest)
  # ═══════════════════════════════════════════════════
  classify:
    name: 🧭 Classify changes
    runs-on: ubuntu-latest
    outputs:
      vitest_mode: ${{ steps.classify.outputs.vitest_mode }}
      vitest_globs: ${{ steps.classify.outputs.vitest_globs }}
      run_python_test: ${{ steps.classify.outputs.run_python_test }}
      run_migrations: ${{ steps.classify.outputs.run_migrations }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      test_cleanup: ${{ steps.classify.outputs.test_cleanup }}
      selected_groups: ${{ steps.classify.outputs.selected_groups }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # need history to diff against base

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run classifier
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_REF=""
          # github.event.before is the only push identity that covers every
          # commit in a multi-commit delivery. Missing or unsafe ancestry is a
          # classification error; ordinary CI never substitutes the full suite.
          if ! BASE_REF="$(bash scripts/resolve-ci-change-base.sh)"; then
            BASE_REF=""
          fi
          test -n "$BASE_REF" || {
            echo "Change base is missing or unsafe; refusing partial classification." >&2
            exit 1
          }
          echo "base_sha=$BASE_REF" >> "$GITHUB_OUTPUT"
          TEST_CLEANUP="$(node scripts/test-cleanup-classifier.mjs --base "$BASE_REF" --field requiresMutation)"
          chmod +x scripts/changed-area-classifier.sh
          JSON="$(scripts/changed-area-classifier.sh --base "$BASE_REF" --format json)"
          echo "$JSON" > /tmp/classifier.json
          echo "$JSON"
          MODE="$(jq -r '.vitest["mode"]' /tmp/classifier.json)"
          GLOBS="$(jq -r '.vitest.globs | join(" ")' /tmp/classifier.json)"
          PY="$(jq -r '.flags.pythonEngine' /tmp/classifier.json)"
          MIG="$(jq -r '.flags.migration' /tmp/classifier.json)"
          DOCS_ONLY="$(jq -r '.flags.docsOnly' /tmp/classifier.json)"
          SELECTED_GROUPS="$(jq -c '.vitest.groups' /tmp/classifier.json)"
          echo "vitest_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "vitest_globs=$GLOBS" >> "$GITHUB_OUTPUT"
          echo "run_python_test=$PY" >> "$GITHUB_OUTPUT"
          echo "run_migrations=$MIG" >> "$GITHUB_OUTPUT"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "test_cleanup=$TEST_CLEANUP" >> "$GITHUB_OUTPUT"
          echo "selected_groups=$SELECTED_GROUPS" >> "$GITHUB_OUTPUT"

  mutation_cleanup:
    name: 🧬 Test-cleanup mutation protection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: classify
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.test_cleanup == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Mutate the deleted test's mapped behavior owner
        run: npm run test:mutation -- --base '${{ needs.classify.outputs.base_sha }}' --scope test-cleanup
      - name: Upload mutation plan and score
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/mutation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # LINT & TYPE CHECK (parallel — no `needs` chain)
  # ═══════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The advisory documentation audit resolves historical release SHAs.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Project map freshness
        run: npm run project:map:check

      - name: Migration replay governance
        run: npm run test:migration-hook-lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint prompts (no empty files)
        run: |
          for f in prompts/*.md; do
            if [ ! -s "$f" ]; then
              echo "❌ Empty prompt file: $f"
              exit 1
            fi
          done
          echo "✅ All prompt files have content"

      - name: vi.mock completeness lint
        # Gating against scripts/.vi-mock-baseline.txt. Lower the baseline
        # monthly until partial factories are effectively eliminated.
        run: node scripts/vi-mock-completeness-lint.mjs --top --strict

      - name: release-doc drift check (advisor)
        # Verifies short SHAs in current/QA docs resolve to commits in
        # engine + ios history. Non-gating during the soak window.
        run: scripts/release-doc-drift-check.sh || true

      - name: closed-beta identity scan (strict, gating)
        # Catches v4.14.118-class hardcoded-founder-identity residue in
        # runtime code (prompts, persisted-payload writers, etc.).
        # Closed-beta-readiness-hardening (2026-05-03): promoted from
        # advisor (`|| true`) to strict gating. Any new flagged literal
        # in src/, prompts/, content-engine/, src/skills/ that isn't
        # explicitly allow-listed (copyright headers, manifest authors,
        # backward-compat reads tagged `nx-allow-identity-scan`,
        # tests/fixtures) blocks the PR. Run locally via
        # `./scripts/closed-beta-identity-scan.sh --strict` to
        # reproduce.
        run: scripts/closed-beta-identity-scan.sh --strict

  # ═══════════════════════════════════════════════════
  # SINGLE FOCUSED VITEST INVOCATION (driven by group classifier)
  # ═══════════════════════════════════════════════════
  docs_and_secrets:
    name: 📚 Docs & secrets
    runs-on: ubuntu-latest
    needs: classify
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Enforce documentation policy
        run: node scripts/audit-docs.mjs --strict
      - name: Scan added lines for secrets
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          test -n "$BASE"
          node scripts/changed-secret-scan.mjs --base "$BASE"
  test_focused:
    name: 🧪 Focused tests
    runs-on: ubuntu-latest
    # Multi-area changes can conservatively select every group with coverage;
    # keep enough headroom for Vitest to emit its governed result artifact.
    timeout-minutes: 45
    needs: classify
    if: ${{ needs.classify.outputs.vitest_mode == 'focused' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Verify exact checked-out source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROTECTED_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_HEAD_SHA"
            test "$(git rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
            git merge-base --is-ancestor "$PR_HEAD_SHA" "$HEAD_SHA"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run focused Vitest gate
        if: ${{ needs.classify.outputs.vitest_mode == 'focused' }}
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
          NEXUS_RISK_GATE_JSON_OUTPUT: .local/ci-evidence/vitest-results-selected.json
          NEXUS_TEST_SELECTION_OUTPUT: .local/ci-evidence/test-selection.json
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          test -n "$BASE"
          scripts/risk-gate.sh \
            --base "$BASE" \
            --coverage \
            --skip-typecheck \
            --skip-python \
            --skip-migrations

      - name: Bind exact-SHA coverage for advisory Sonar
        if: ${{ needs.classify.outputs.vitest_mode == 'focused' }}
        run: |
          if [ -s .local/coverage/selected/lcov.info ]; then
            node scripts/quality-sonar-coverage-manifest.mjs \
              --runtime-sha "$GITHUB_SHA" \
              --coverage-dir .local/coverage/selected \
              --output .local/coverage/selected/sonar-coverage-evidence.json
          else
            echo "No instrumented JavaScript source changed; advisory Sonar coverage is unavailable for this SHA."
          fi

      - name: Record docs-only exact selection without Vitest
        if: ${{ needs.classify.outputs.vitest_mode == 'skip' }}
        run: |
          mkdir -p .local/ci-evidence
          BASE='${{ needs.classify.outputs.base_sha }}'
          test -n "$BASE"
          scripts/changed-area-classifier.sh --base "$BASE" --json > .local/ci-evidence/classifier.json
          node scripts/select-vitest-files.mjs \
            --base "$BASE" \
            --classifier .local/ci-evidence/classifier.json \
            --output .local/ci-evidence/test-selection.json >/dev/null

      - name: Upload exact protected-main selected result
        if: ${{ always() && needs.classify.outputs.vitest_mode == 'focused' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-main-vitest-${{ github.run_id }}-${{ github.run_attempt }}-selected
          path: .local/ci-evidence/vitest-results-selected.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact protected-main test selection
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-main-test-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-evidence/test-selection.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload selected-test coverage
        if: ${{ always() && needs.classify.outputs.vitest_mode == 'focused' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selected-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/coverage/selected/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  test:
    # Keep this aggregate check-run name stable because the main-branch
    # ruleset requires the exact `🧪 Tests` context. Pull requests bind the
    # single selected-test run and any applicable test-cleanup mutation gate
    # into this required context.
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: [classify, docs_and_secrets, mutation_cleanup, test_focused, python-test, migrations, science_policy]
    if: ${{ always() }}
    steps:
      - name: Verify selected test lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROTECTED_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          VITEST_MODE: ${{ needs.classify.outputs.vitest_mode }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          TEST_CLEANUP: ${{ needs.classify.outputs.test_cleanup }}
          MUTATION_RESULT: ${{ needs.mutation_cleanup.result }}
          DOCS_RESULT: ${{ needs.docs_and_secrets.result }}
          PYTHON_REQUIRED: ${{ needs.classify.outputs.run_python_test }}
          PYTHON_RESULT: ${{ needs.python-test.result }}
          MIGRATIONS_REQUIRED: ${{ needs.classify.outputs.run_migrations }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          SCIENCE_POLICY_RESULT: ${{ needs.science_policy.result }}
          FOCUSED_RESULT: ${{ needs.test_focused.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"

          test "$DOCS_RESULT" = "success"

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$TEST_CLEANUP" = "true" ]; then
            test "$MUTATION_RESULT" = "success"
          else
            test "$MUTATION_RESULT" = "skipped"
          fi

          if [ "$PYTHON_REQUIRED" = "true" ]; then
            test "$PYTHON_RESULT" = "success"
          else
            test "$PYTHON_RESULT" = "skipped"
          fi

          if [ "$MIGRATIONS_REQUIRED" = "true" ]; then
            test "$MIGRATIONS_RESULT" = "success"
          else
            test "$MIGRATIONS_RESULT" = "skipped"
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            test "$SCIENCE_POLICY_RESULT" = "skipped"
          else
            test "$SCIENCE_POLICY_RESULT" = "success"
          fi

          case "$VITEST_MODE" in
            skip)
              if [ "$PROTECTED_MAIN" = "true" ]; then
                test "$FOCUSED_RESULT" = "success"
              else
                test "$FOCUSED_RESULT" = "skipped"
              fi
              ;;
            focused)
              test "$FOCUSED_RESULT" = "success"
              ;;
            *)
              echo "Unexpected Vitest mode: $VITEST_MODE" >&2
              exit 1
              ;;
          esac

  # ═══════════════════════════════════════════════════
  # BUILD VERIFICATION (parallel; no `needs: test`)
  # ═══════════════════════════════════════════════════
  build:
    name: 🔨 Build
    runs-on: ubuntu-24.04
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    outputs:
      artifact_name: ${{ steps.runtime_artifact.outputs.artifact_name }}
      artifact_digest: ${{ steps.runtime_artifact.outputs.digest }}
      python_version: ${{ steps.runtime_artifact.outputs.python_version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.3'

      - run: npm ci

      - run: npm run build

      - name: Bind the Ubuntu 24.04 x86-64 runtime artifact identity
        id: runtime_artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          test "$(uname -m)" = 'x86_64'
          . /etc/os-release
          test "$ID" = 'ubuntu'
          test "$VERSION_ID" = '24.04'
          scripts/build-release-runtime-dependencies.sh
          node scripts/release-bundle.mjs --runtime-sha "$GITHUB_SHA" >/dev/null
          digest="$(node scripts/release-artifact-manifest.mjs --digest | tr -d '\n')"
          bundle_root=".local/release/bundles/$GITHUB_SHA/$digest"
          artifact_name="release-bundle-$GITHUB_SHA-$digest"
          node scripts/release-artifact-manifest.mjs \
            --verify-bundle "$bundle_root" \
            --expected-runtime-sha "$GITHUB_SHA" \
            --expected-digest "$digest" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "bundle_root=$bundle_root" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "python_version=$(python --version)" >> "$GITHUB_OUTPUT"

      - name: Verify dist output
        run: |
          test -f dist/index.js || { echo "❌ dist/index.js not found"; exit 1; }
          echo "✅ Build output verified"

      - name: Upload exact runtime release bundle
        id: upload_runtime_bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.runtime_artifact.outputs.artifact_name }}
          path: ${{ steps.runtime_artifact.outputs.bundle_root }}/
          # The 93 MB-class payload is dominated by digest-bound gzip runtime
          # archives. Recompressing it adds CPU time without meaningful size
          # reduction; the artifact service still wraps and digests the bytes.
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Download and verify the uploaded exact runtime bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.runtime_artifact.outputs.artifact_name }}
          path: .local/ci-evidence/downloaded-runtime-bundle

      - name: Prove uploaded bundle bytes match the recorded digest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          node scripts/release-artifact-manifest.mjs \
            --verify-bundle .local/ci-evidence/downloaded-runtime-bundle \
            --expected-runtime-sha "$GITHUB_SHA" \
            --expected-digest '${{ steps.runtime_artifact.outputs.digest }}' >/dev/null

  # ═══════════════════════════════════════════════════
  # PYTHON CONTENT-ENGINE (only when content-engine/** changed)
  # ═══════════════════════════════════════════════════
  python-test:
    name: 🐍 Content Engine Check
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_python_test == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.3'
          cache: 'pip'
          cache-dependency-path: |
            content-engine/requirements.txt
            content-engine/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd content-engine
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Syntax check
        run: |
          cd content-engine
          python -m py_compile main.py
          python -m py_compile config.py
          find . -name "*.py" -not -path "./.venv/*" -not -path "./__pycache__/*" \
            -exec python -m py_compile {} \;
          echo "✅ All Python files compile"

      - name: Python content-engine tests
        run: |
          cd content-engine
          python -m pytest tests/ -v

  # ═══════════════════════════════════════════════════
  # SCIENCE-POLICY VERSION GATE (always — fail-closed)
  # ═══════════════════════════════════════════════════
  # R4 P2 fix — Codex caught that the gate only existed as a script
  # under scripts/ci/, with no CI workflow or pre-commit hook calling
  # it. That meant any change to training-principles.json could land
  # without bumping `sciencePolicyVersion`, breaking the audit /
  # reproducibility invariant. This job runs unconditionally on every
  # push and PR (the check is millisecond-cheap) and fails the build
  # when the JSON content hash drifts from the pinned hash without a
  # corresponding version bump.
  science_policy:
    name: 🧪 Science-policy version
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify training-principles content hash matches pinned version
        run: node scripts/ci/science-policy-version-check.mjs

  # ═══════════════════════════════════════════════════
  # MIGRATION SAFETY CHECK (only when migrations/** changed)
  # ═══════════════════════════════════════════════════
  migrations:
    name: 🗃️ Migration Check
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_migrations == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Scan migration sequence, cumulative apply, and review subject
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          if [ -n "$BASE" ]; then
            node scripts/migration-safety-check.mjs \
              --base "$BASE" \
              --changed-only \
              --approval-mode scan
          else
            node scripts/migration-safety-check.mjs
          fi
