name: CI — Risk-based parallel matrix

# release-pipeline-risk-based-optimization (2026-05-03):
# Refactored from the serial `lint → test → build` chain into a parallel
# matrix that runs typecheck, focused tests, migration check, Python
# compile, and build concurrently. Full coverage is now driven by
# `nightly.yml` and `workflow_dispatch`, NOT every push.
#
# Decisions encoded here:
#   1. lint, focused-tests, migrations, python-test, build run IN
#      PARALLEL after install. None depend on each other.
#   2. focused-tests delegates to scripts/risk-gate.sh. Main pushes are
#      focused; full breadth lives on v* RC tags, nightly, and manual full.
#   3. python-test runs the full content-engine pytest suite when
#      content-engine/** changed.
#   4. build runs unconditionally as a "does dist still build" check.
#
# Manual full-suite + coverage:
#   gh workflow run "CI — Risk-based parallel matrix" -f mode=full

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode: focused (default for PRs), full (full vitest), full+coverage (nightly)'
        required: false
        default: 'focused'
        type: choice
        options:
          - focused
          - full
          - full+coverage

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'

jobs:
  # ═══════════════════════════════════════════════════
  # CHANGED-AREA CLASSIFIER (drives the rest)
  # ═══════════════════════════════════════════════════
  classify:
    name: 🧭 Classify changes
    runs-on: ubuntu-latest
    outputs:
      vitest_mode: ${{ steps.classify.outputs.vitest_mode }}
      vitest_globs: ${{ steps.classify.outputs.vitest_globs }}
      run_python_test: ${{ steps.classify.outputs.run_python_test }}
      run_migrations: ${{ steps.classify.outputs.run_migrations }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      test_cleanup: ${{ steps.classify.outputs.test_cleanup }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # need history to diff against base

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run classifier
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_REF=""
          # github.event.before is the only push identity that covers every
          # commit in a multi-commit delivery. The resolver also rejects zero,
          # missing, unresolved, and non-ancestor identities; those all select
          # the full lane below instead of attempting an unsafe partial diff.
          if ! BASE_REF="$(bash scripts/resolve-ci-change-base.sh)"; then
            BASE_REF=""
          fi
          if [ -z "$BASE_REF" ]; then
            echo "Change base is missing or unsafe; failing closed to full verification."
          fi
          echo "base_sha=$BASE_REF" >> "$GITHUB_OUTPUT"
          TEST_CLEANUP=false
          if [ -n "$BASE_REF" ] && git diff --numstat "$BASE_REF" HEAD -- '__tests__/**' \
            | awk '$2 > 0 { found=1 } END { exit found ? 0 : 1 }'; then
            TEST_CLEANUP=true
          fi

          # Manual mode override
          MODE_OVERRIDE='${{ github.event.inputs.mode }}'
          if [ -z "$BASE_REF" ] || [ "$MODE_OVERRIDE" = "full" ] || [ "$MODE_OVERRIDE" = "full+coverage" ]; then
            echo "Full verification selected (mode=${MODE_OVERRIDE:-focused}, base=${BASE_REF:-unresolved})."
            echo "vitest_mode=full" >> "$GITHUB_OUTPUT"
            echo "vitest_globs=" >> "$GITHUB_OUTPUT"
            echo "run_python_test=true" >> "$GITHUB_OUTPUT"
            echo "run_migrations=true" >> "$GITHUB_OUTPUT"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "test_cleanup=$TEST_CLEANUP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x scripts/changed-area-classifier.sh
          JSON="$(scripts/changed-area-classifier.sh --base "$BASE_REF" --format json)"
          echo "$JSON" > /tmp/classifier.json
          echo "$JSON"
          MODE="$(jq -r '.vitest["mode"]' /tmp/classifier.json)"
          GLOBS="$(jq -r '.vitest.globs | join(" ")' /tmp/classifier.json)"
          PY="$(jq -r '.flags.pythonEngine' /tmp/classifier.json)"
          MIG="$(jq -r '.flags.migration' /tmp/classifier.json)"
          DOCS_ONLY="$(jq -r '.flags.docsOnly' /tmp/classifier.json)"
          echo "vitest_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "vitest_globs=$GLOBS" >> "$GITHUB_OUTPUT"
          echo "run_python_test=$PY" >> "$GITHUB_OUTPUT"
          echo "run_migrations=$MIG" >> "$GITHUB_OUTPUT"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "test_cleanup=$TEST_CLEANUP" >> "$GITHUB_OUTPUT"

  mutation_cleanup:
    name: 🧬 Test-cleanup mutation protection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: classify
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.test_cleanup == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Mutate affected critical source dependencies
        run: npm run test:mutation -- --base '${{ needs.classify.outputs.base_sha }}' --scope test-cleanup
      - name: Upload mutation plan and score
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/mutation/
          if-no-files-found: error
          retention-days: 30

  changed_coverage:
    name: 📈 Changed-module coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: classify
    if: ${{ github.event_name == 'pull_request' && needs.classify.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Enforce changed and critical coverage ratchets
        run: npm run test:coverage:changed -- --base '${{ needs.classify.outputs.base_sha }}'
      - name: Upload changed coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changed-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/coverage/changed/
          if-no-files-found: error
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # LINT & TYPE CHECK (parallel — no `needs` chain)
  # ═══════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Project map freshness
        run: npm run project:map:check

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint prompts (no empty files)
        run: |
          for f in prompts/*.md; do
            if [ ! -s "$f" ]; then
              echo "❌ Empty prompt file: $f"
              exit 1
            fi
          done
          echo "✅ All prompt files have content"

      - name: vi.mock completeness lint
        # Gating against scripts/.vi-mock-baseline.txt. Lower the baseline
        # monthly until partial factories are effectively eliminated.
        run: node scripts/vi-mock-completeness-lint.mjs --top --strict

      - name: release-doc drift check (advisor)
        # Verifies short SHAs in current/QA docs resolve to commits in
        # engine + ios history. Non-gating during the soak window.
        run: scripts/release-doc-drift-check.sh || true

      - name: closed-beta identity scan (strict, gating)
        # Catches v4.14.118-class hardcoded-founder-identity residue in
        # runtime code (prompts, persisted-payload writers, etc.).
        # Closed-beta-readiness-hardening (2026-05-03): promoted from
        # advisor (`|| true`) to strict gating. Any new flagged literal
        # in src/, prompts/, content-engine/, src/skills/ that isn't
        # explicitly allow-listed (copyright headers, manifest authors,
        # backward-compat reads tagged `nx-allow-identity-scan`,
        # tests/fixtures) blocks the PR. Run locally via
        # `./scripts/closed-beta-identity-scan.sh --strict` to
        # reproduce.
        run: scripts/closed-beta-identity-scan.sh --strict

  # ═══════════════════════════════════════════════════
  # FOCUSED OR FULL VITEST (driven by classifier)
  # ═══════════════════════════════════════════════════
  test_full_shard:
    name: 🧪 Full test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: classify
    if: ${{ needs.classify.outputs.vitest_mode == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Verify exact checked-out source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_HEAD_SHA"
            test "$(git rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
            git merge-base --is-ancestor "$PR_HEAD_SHA" "$HEAD_SHA"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run full Vitest shard
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          ARGS=(
            --full
            --vitest-shard "${{ matrix.shard }}/4"
            --skip-typecheck
            --skip-python
            --skip-migrations
          )
          if [ -n "$BASE" ]; then
            ARGS=(--base "$BASE" "${ARGS[@]}")
          fi
          scripts/risk-gate.sh "${ARGS[@]}"

  docs_and_secrets:
    name: 📚 Docs & secrets
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Enforce documentation policy
        run: node scripts/audit-docs.mjs --strict
      - name: Scan added lines for secrets
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          test -n "$BASE"
          node scripts/changed-secret-scan.mjs --base "$BASE"
  test_focused:
    name: 🧪 Focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: classify
    if: ${{ needs.classify.outputs.vitest_mode != 'skip' && needs.classify.outputs.vitest_mode != 'full' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Verify exact checked-out source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "$EXPECTED_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_HEAD_SHA"
            test "$(git rev-parse 'HEAD^2')" = "$PR_HEAD_SHA"
            git merge-base --is-ancestor "$PR_HEAD_SHA" "$HEAD_SHA"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run focused Vitest gate
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          test -n "$BASE"
          scripts/risk-gate.sh \
            --base "$BASE" \
            --skip-typecheck \
            --skip-python \
            --skip-migrations

  test:
    # Keep this aggregate check-run name stable because the main-branch
    # ruleset requires the exact `🧪 Tests` context. Full mode succeeds only
    # after all four shards pass. Pull requests also bind changed-module
    # coverage and any applicable test-cleanup mutation gate into this one
    # required context, so an optional-looking lane cannot fail independently
    # while the branch-protection check remains green.
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: [classify, mutation_cleanup, changed_coverage, test_full_shard, test_focused]
    if: ${{ always() }}
    steps:
      - name: Verify selected test lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          VITEST_MODE: ${{ needs.classify.outputs.vitest_mode }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          TEST_CLEANUP: ${{ needs.classify.outputs.test_cleanup }}
          MUTATION_RESULT: ${{ needs.mutation_cleanup.result }}
          COVERAGE_RESULT: ${{ needs.changed_coverage.result }}
          FULL_RESULT: ${{ needs.test_full_shard.result }}
          FOCUSED_RESULT: ${{ needs.test_focused.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$DOCS_ONLY" != "true" ]; then
            test "$COVERAGE_RESULT" = "success"
          else
            test "$COVERAGE_RESULT" = "skipped"
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$TEST_CLEANUP" = "true" ]; then
            test "$MUTATION_RESULT" = "success"
          else
            test "$MUTATION_RESULT" = "skipped"
          fi

          case "$VITEST_MODE" in
            skip)
              test "$FULL_RESULT" = "skipped"
              test "$FOCUSED_RESULT" = "skipped"
              ;;
            full)
              test "$FULL_RESULT" = "success"
              test "$FOCUSED_RESULT" = "skipped"
              ;;
            focused|changed-only)
              test "$FULL_RESULT" = "skipped"
              test "$FOCUSED_RESULT" = "success"
              ;;
            *)
              echo "Unexpected Vitest mode: $VITEST_MODE" >&2
              exit 1
              ;;
          esac

  # ═══════════════════════════════════════════════════
  # BUILD VERIFICATION (parallel; no `needs: test`)
  # ═══════════════════════════════════════════════════
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js || { echo "❌ dist/index.js not found"; exit 1; }
          echo "✅ Build output verified"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ═══════════════════════════════════════════════════
  # PYTHON CONTENT-ENGINE (only when content-engine/** changed)
  # ═══════════════════════════════════════════════════
  python-test:
    name: 🐍 Content Engine Check
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_python_test == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: content-engine/requirements.txt

      - name: Install dependencies
        run: |
          cd content-engine
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Syntax check
        run: |
          cd content-engine
          python -m py_compile main.py
          python -m py_compile config.py
          find . -name "*.py" -not -path "./.venv/*" -not -path "./__pycache__/*" \
            -exec python -m py_compile {} \;
          echo "✅ All Python files compile"

      - name: Python content-engine tests
        run: |
          cd content-engine
          python -m pytest tests/ -v

  # ═══════════════════════════════════════════════════
  # SCIENCE-POLICY VERSION GATE (always — fail-closed)
  # ═══════════════════════════════════════════════════
  # R4 P2 fix — Codex caught that the gate only existed as a script
  # under scripts/ci/, with no CI workflow or pre-commit hook calling
  # it. That meant any change to training-principles.json could land
  # without bumping `sciencePolicyVersion`, breaking the audit /
  # reproducibility invariant. This job runs unconditionally on every
  # push and PR (the check is millisecond-cheap) and fails the build
  # when the JSON content hash drifts from the pinned hash without a
  # corresponding version bump.
  science_policy:
    name: 🧪 Science-policy version
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify training-principles content hash matches pinned version
        run: node scripts/ci/science-policy-version-check.mjs

  # ═══════════════════════════════════════════════════
  # MIGRATION SAFETY CHECK (only when migrations/** changed)
  # ═══════════════════════════════════════════════════
  migrations:
    name: 🗃️ Migration Check
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.run_migrations == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Scan migration sequence, cumulative apply, and review subject
        run: |
          BASE='${{ needs.classify.outputs.base_sha }}'
          if [ -n "$BASE" ]; then
            node scripts/migration-safety-check.mjs \
              --base "$BASE" \
              --changed-only \
              --approval-mode scan
          else
            node scripts/migration-safety-check.mjs
          fi
