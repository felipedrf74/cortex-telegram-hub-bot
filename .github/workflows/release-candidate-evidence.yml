name: RC — Release Evidence

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: rc-release-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  vitest-full:
    name: 🧪 Full Vitest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Vitest shard
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
        run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=json --outputFile=vitest-results-${{ matrix.shard }}.json

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results-${{ matrix.shard }}
          path: vitest-results-${{ matrix.shard }}.json
          retention-days: 14

  python-full:
    name: 🐍 Content Engine full pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: content-engine/requirements.txt

      - name: Install dependencies
        run: |
          cd content-engine
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Full pytest
        run: |
          cd content-engine
          python -m pytest tests/ -v

  release-evidence:
    name: 📦 Write release evidence
    runs-on: ubuntu-latest
    needs: [vitest-full, python-full]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-results-*
          path: rc-test-results
          merge-multiple: true

      - name: Typecheck, build, migration rehearsal, cannot-skip dashboard
        run: |
          npx tsc --noEmit
          npm run build
          node scripts/migration-safety-check.mjs
          scripts/cannot-skip-gate-dashboard.sh --json --no-evidence > cannot-skip-dashboard.json

      - name: Count tests from shard artifacts
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const path = require('path');
          function countTests(value) {
            if (!value || typeof value !== 'object') return 0;
            if (typeof value.numTotalTests === 'number') return value.numTotalTests;
            if (typeof value.totalTestCount === 'number') return value.totalTestCount;
            if (Array.isArray(value.assertionResults)) return value.assertionResults.length;
            let total = 0;
            for (const child of Object.values(value)) {
              if (Array.isArray(child)) total += child.reduce((sum, item) => sum + countTests(item), 0);
              else if (child && typeof child === 'object') total += countTests(child);
            }
            return total;
          }
          let total = 0;
          for (const file of fs.readdirSync('rc-test-results').filter((name) => name.endsWith('.json'))) {
            try {
              total += countTests(JSON.parse(fs.readFileSync(path.join('rc-test-results', file), 'utf8')));
            } catch {}
          }
          console.log(`NEXUS_RELEASE_VITEST_TEST_COUNT=${total}`);
          NODE

      - name: Write release evidence
        env:
          NEXUS_RELEASE_EVIDENCE_PATH: docs/release/evidence/release-evidence-${{ github.sha }}.json
          NEXUS_RELEASE_VITEST_RESULT: passed
          NEXUS_RELEASE_TYPECHECK_RESULT: passed
          NEXUS_RELEASE_PYTEST_RESULT: passed
          NEXUS_RELEASE_MIGRATIONS_RESULT: passed
          NEXUS_RELEASE_CANNOT_SKIP_RESULT: passed
          NEXUS_RELEASE_PYTEST_TEST_COUNT: 0
        run: |
          node scripts/release-evidence.mjs write --json
          cp "docs/release/evidence/release-evidence-${{ github.sha }}.json" docs/release/evidence/latest-release-evidence.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            docs/release/evidence/release-evidence-${{ github.sha }}.json
            docs/release/evidence/latest-release-evidence.json
            cannot-skip-dashboard.json
            rc-test-results/*.json
          retention-days: 30
