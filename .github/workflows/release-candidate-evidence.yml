name: Release Checkpoint — exact main artifact

# Owner-triggered manual evidence for the PM2 first-cutover fallback only.
# This workflow never authorizes the default signed-container release path; a
# successful protected-main CI conclusion authorizes hosted OCI publication and
# the root VPS poller decides deployment from signed evidence and host receipts.

on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: Exact protected-main SHA for the PM2 first-cutover fallback
        required: true
        type: string
      irreversible_migration_review_sha256:
        description: Review identity only; irreversible changes remain non-promotable
        required: false
        type: string

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: '22.23.1'
  PYTHON_VERSION: '3.12.3'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  verify-main:
    name: Verify exact protected-main source
    runs-on: ubuntu-24.04
    outputs:
      runtime_sha: ${{ steps.identity.outputs.runtime_sha }}
      deployed_sha: ${{ steps.identity.outputs.deployed_sha }}
      protected_run_id: ${{ steps.main.outputs.run_id }}
      protected_run_attempt: ${{ steps.main.outputs.run_attempt }}
      selection_artifact: ${{ steps.main.outputs.selection_artifact }}
      selected_result_artifact: ${{ steps.main.outputs.selected_result_artifact }}
      python_required: ${{ steps.impact.outputs.python_required }}
      migration_required: ${{ steps.impact.outputs.migration_required }}
      release_groups: ${{ steps.impact.outputs.release_groups }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.runtime_sha }}
          fetch-depth: 0

      - name: Bind exact protected main and deployed predecessor
        id: identity
        env:
          REQUESTED_SHA: ${{ inputs.runtime_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
          deployed="$(node -e 'const x=require("./docs/release/release-state.json");process.stdout.write(x.backend.runtimeSha)')"
          [[ "$deployed" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$deployed" "$REQUESTED_SHA"
          echo "runtime_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$deployed" >> "$GITHUB_OUTPUT"

      - name: Locate one successful protected-main run and test evidence
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SHA: ${{ steps.identity.outputs.runtime_sha }}
        run: |
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$RUNTIME_SHA&per_page=20")"
          run_count="$(jq --arg sha "$RUNTIME_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .event=="push" and .status=="completed" and .conclusion=="success")] | length' <<<"$runs")"
          test "$run_count" -ge 1
          run_id="$(jq -r --arg sha "$RUNTIME_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .event=="push" and .status=="completed" and .conclusion=="success")] | sort_by(.run_attempt,.id) | last | .id' <<<"$runs")"
          run_attempt="$(jq -r --arg sha "$RUNTIME_SHA" '[.workflow_runs[] | select(.head_sha==$sha and .head_branch=="main" and .event=="push" and .status=="completed" and .conclusion=="success")] | sort_by(.run_attempt,.id) | last | .run_attempt' <<<"$runs")"
          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[] | [.name,.status,.conclusion] | @tsv')"
          for required in '🧪 Tests' '🔍 Lint & Type Check' '🔨 Build'; do
            awk -F '\t' -v name="$required" '$1==name && $2=="completed" && $3=="success"{found=1} END{exit !found}' <<<"$jobs"
          done
          artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          selection_artifact="protected-main-test-selection-$run_id-$run_attempt"
          jq -e --arg name "$selection_artifact" '.artifacts[] | select(.expired==false and .name==$name)' <<<"$artifacts" >/dev/null
          selected_result_artifact="$(jq -r --arg name "protected-main-vitest-$run_id-$run_attempt-selected" \
            '[.artifacts[] | select(.expired==false and .name==$name)] | if length==0 then "" elif length==1 then .[0].name else error("duplicate selected Vitest artifacts") end' <<<"$artifacts")"
          {
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
            echo "selection_artifact=$selection_artifact"
            echo "selected_result_artifact=$selected_result_artifact"
          } >> "$GITHUB_OUTPUT"

      - name: Classify cumulative release impact
        id: impact
        env:
          DEPLOYED_SHA: ${{ steps.identity.outputs.deployed_sha }}
          RUNTIME_SHA: ${{ steps.identity.outputs.runtime_sha }}
        run: |
          mkdir -p .local/release/checkpoint
          node scripts/changed-area-classifier.mjs \
            --base "$DEPLOYED_SHA" \
            --json > .local/release/checkpoint/release-impact.json
          release_groups="$(
            jq -c '.testGroups.selected | unique | sort' \
              .local/release/checkpoint/release-impact.json
          )"
          test "$(jq -r 'type' <<<"$release_groups")" = array
          echo "release_groups=$release_groups" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$DEPLOYED_SHA" "$RUNTIME_SHA" -- content-engine/; then
            echo 'python_required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'python_required=true' >> "$GITHUB_OUTPUT"
          fi
          migration_required="$(
            jq -r '.flags.migration' .local/release/checkpoint/release-impact.json
          )"
          [[ "$migration_required" == true || "$migration_required" == false ]]
          echo "migration_required=$migration_required" >> "$GITHUB_OUTPUT"

  vitest-remainder:
    name: Deterministic remainder shard ${{ matrix.shard }}/4
    needs: verify-main
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify-main.outputs.runtime_sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify-main.outputs.selection_artifact }}
          path: .local/release/checkpoint/selection
          run-id: ${{ needs.verify-main.outputs.protected_run_id }}
          github-token: ${{ github.token }}

      - name: Run only this deterministic remainder shard
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
        run: |
          mkdir -p .local/release/checkpoint
          selection="$(find .local/release/checkpoint/selection -type f -name 'test-selection.json' -print -quit)"
          test -n "$selection"
          node scripts/release-test-remainder.mjs run \
            --selection "$selection" \
            --shard '${{ matrix.shard }}/4' \
            --output ".local/release/checkpoint/vitest-results-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-checkpoint-vitest-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release/checkpoint/vitest-results-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  python:
    name: Conditional full Python
    needs: verify-main
    if: needs.verify-main.outputs.python_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify-main.outputs.runtime_sha }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            content-engine/requirements.txt
            content-engine/requirements-dev.txt

      - run: pip install -r content-engine/requirements.txt -r content-engine/requirements-dev.txt
      - run: python -m pytest content-engine/tests -q

  migrations:
    name: Migration safety
    needs: verify-main
    if: needs.verify-main.outputs.migration_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify-main.outputs.runtime_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run cumulative migration rehearsal and bind irreversible review
        env:
          DEPLOYED_SHA: ${{ needs.verify-main.outputs.deployed_sha }}
          APPROVED_REVIEW_SHA256: ${{ inputs.irreversible_migration_review_sha256 }}
        run: |
          mkdir -p .local/release/checkpoint
          node scripts/migration-safety-check.mjs \
            --base "$DEPLOYED_SHA" \
            --changed-only \
            --approval-mode scan \
            --json > .local/release/checkpoint/migration-result.json
          required="$(jq -r '.requiredReviewSubject.sha256 // ""' .local/release/checkpoint/migration-result.json)"
          if [ -n "$required" ]; then
            test "$APPROVED_REVIEW_SHA256" = "$required"
            if [ "$(jq -r '.authorization.approvalRequired' .local/release/checkpoint/migration-result.json)" = true ]; then
              echo "Irreversible migration SQL remains blocked in the lean release path until the canonical promotion rehearsal and database-restore contract is implemented." >&2
              exit 1
            fi
            test "$(jq -r '.authorization.governanceReviewRequired' .local/release/checkpoint/migration-result.json)" = true
          else
            test -z "$APPROVED_REVIEW_SHA256"
            test "$(jq -r '.authorization.approvalRequired' .local/release/checkpoint/migration-result.json)" = false
            test "$(jq -r '.authorization.governanceReviewRequired' .local/release/checkpoint/migration-result.json)" = false
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checkpoint-migrations-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release/checkpoint/migration-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Compact checksum manifest
    needs: [verify-main, vitest-remainder, python, migrations]
    if: ${{ always() && needs.verify-main.result == 'success' && needs.vitest-remainder.result == 'success' && (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') && (needs.python.result == 'success' || needs.python.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.verify-main.outputs.runtime_sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: content-engine/requirements.txt

      - run: npm ci

      - run: npm run build

      - name: Build and verify exact PM2 fallback bundle
        id: fallback_bundle
        env:
          RUNTIME_SHA: ${{ needs.verify-main.outputs.runtime_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RUNTIME_SHA"
          scripts/build-release-runtime-dependencies.sh
          node scripts/release-bundle.mjs \
            --runtime-sha "$RUNTIME_SHA" \
            --output .local/release/checkpoint/bundle >/dev/null
          artifact_digest="$(node -e 'const x=require("./.local/release/checkpoint/bundle/.complete.json");process.stdout.write(x.artifactDigest)')"
          [[ "$artifact_digest" =~ ^[0-9a-f]{64}$ ]]
          artifact_name="release-bundle-$RUNTIME_SHA-$artifact_digest"
          node scripts/release-artifact-manifest.mjs \
            --verify-bundle .local/release/checkpoint/bundle \
            --expected-runtime-sha "$RUNTIME_SHA" \
            --expected-digest "$artifact_digest" >/dev/null
          {
            echo "artifact_name=$artifact_name"
            echo "artifact_digest=$artifact_digest"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.verify-main.outputs.selected_result_artifact != '' }}
        with:
          name: ${{ needs.verify-main.outputs.selected_result_artifact }}
          path: .local/release/checkpoint/selected-result
          run-id: ${{ needs.verify-main.outputs.protected_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify-main.outputs.selection_artifact }}
          path: .local/release/checkpoint/selection
          run-id: ${{ needs.verify-main.outputs.protected_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-checkpoint-vitest-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release/checkpoint/shards
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.verify-main.outputs.migration_required == 'true' }}
        with:
          name: release-checkpoint-migrations-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release/checkpoint/migrations

      - name: Write and independently validate the compact manifest
        env:
          MIGRATION_REVIEW_SHA256: ${{ inputs.irreversible_migration_review_sha256 }}
          RELEASE_GROUPS_JSON: ${{ needs.verify-main.outputs.release_groups }}
        run: |
          selection="$(find .local/release/checkpoint/selection -type f -name 'test-selection.json' -print -quit)"
          test -n "$selection"
          selected_result=""
          if [ -d .local/release/checkpoint/selected-result ]; then
            selected_result="$(find .local/release/checkpoint/selected-result -type f -name 'vitest-results-selected.json' -print -quit)"
            test -n "$selected_result"
          fi
          migration_result=""
          if [ -d .local/release/checkpoint/migrations ]; then
            migration_result="$(find .local/release/checkpoint/migrations -type f -name 'migration-result.json' -print -quit)"
            test -n "$migration_result"
          fi
          node scripts/release-checksum-manifest.mjs write \
            --source-sha '${{ needs.verify-main.outputs.runtime_sha }}' \
            --bundle .local/release/checkpoint/bundle \
            --artifact-name '${{ steps.fallback_bundle.outputs.artifact_name }}' \
            --protected-run-id '${{ needs.verify-main.outputs.protected_run_id }}' \
            --protected-run-attempt '${{ needs.verify-main.outputs.protected_run_attempt }}' \
            --checkpoint-run-id "$GITHUB_RUN_ID" \
            --checkpoint-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release-deployed-sha '${{ needs.verify-main.outputs.deployed_sha }}' \
            --release-groups-json "$RELEASE_GROUPS_JSON" \
            --selection "$selection" \
            --selected-result "$selected_result" \
            --policy-file config/test-groups.json \
            --shard-results .local/release/checkpoint/shards \
            --python-required '${{ needs.verify-main.outputs.python_required }}' \
            --python-status '${{ needs.python.result == 'success' && 'passed' || 'skipped' }}' \
            --migration-required '${{ needs.verify-main.outputs.migration_required }}' \
            --migration-status '${{ needs.migrations.result == 'success' && 'passed' || 'skipped' }}' \
            --migration-result "$migration_result" \
            --migration-review-sha256 "$MIGRATION_REVIEW_SHA256" \
            --output .local/release/checkpoint/release-manifest.json
          node scripts/release-checksum-manifest.mjs validate \
            --manifest .local/release/checkpoint/release-manifest.json \
            --bundle .local/release/checkpoint/bundle \
            --expect-source-sha '${{ needs.verify-main.outputs.runtime_sha }}' \
            --expect-artifact-digest '${{ steps.fallback_bundle.outputs.artifact_digest }}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.fallback_bundle.outputs.artifact_name }}
          path: .local/release/checkpoint/bundle/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checkpoint-${{ needs.verify-main.outputs.runtime_sha }}
          path: .local/release/checkpoint/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
