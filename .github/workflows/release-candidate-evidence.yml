name: RC — Release Evidence

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: rc-release-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  TZ: Europe/Lisbon

jobs:
  vitest-full:
    name: 🧪 Full Vitest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Vitest shard
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
        run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=json --outputFile=vitest-results-${{ matrix.shard }}.json

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-results-${{ matrix.shard }}
          path: vitest-results-${{ matrix.shard }}.json
          retention-days: 14

  python-full:
    name: 🐍 Content Engine full pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: content-engine/requirements.txt

      - name: Install dependencies
        run: |
          cd content-engine
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Full pytest
        run: |
          cd content-engine
          set -o pipefail
          python -m pytest tests/ -v | tee ../pytest-results.log

      - name: Upload pytest result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-results
          path: pytest-results.log
          retention-days: 14

  release-evidence:
    name: 📦 Write release evidence
    runs-on: ubuntu-latest
    needs: [vitest-full, python-full]
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Stop when full-suite prerequisites failed
        if: ${{ needs.vitest-full.result != 'success' || needs.python-full.result != 'success' }}
        run: |
          echo "Full-suite prerequisites did not pass."
          echo "vitest-full=${{ needs.vitest-full.result }}"
          echo "python-full=${{ needs.python-full.result }}"
          exit 1

      - name: Prepare result directory
        run: mkdir -p rc-test-results

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: vitest-results-*
          path: rc-test-results
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: pytest-results
          path: rc-test-results

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Science policy
        id: science_policy
        continue-on-error: true
        run: npm run science-policy:check

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Migration rehearsal
        id: migrations
        continue-on-error: true
        run: node scripts/migration-safety-check.mjs

      - name: Cannot-skip dashboard
        id: cannot_skip_dashboard
        continue-on-error: true
        run: scripts/cannot-skip-gate-dashboard.sh --json --no-evidence > cannot-skip-dashboard.json

      - name: Build release-test container
        id: release_test_image
        continue-on-error: true
        run: DOCKER_BUILDKIT=1 docker build -f Dockerfile.release-test -t nexus-hub-release-test:ci .

      - name: Sandbox smoke / container release gate contract
        id: sandbox_smoke
        continue-on-error: true
        env:
          NEXUS_RELEASE_TEST_IMAGE: nexus-hub-release-test:ci
          NEXUS_RELEASE_TEST_SKIP_BUILD: '1'
        run: scripts/release-verify-container.sh --skip-vitest --skip-pytest

      - name: Count tests from shard artifacts
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const path = require('path');
          function countTests(value) {
            if (!value || typeof value !== 'object') return 0;
            if (typeof value.numTotalTests === 'number') return value.numTotalTests;
            if (typeof value.totalTestCount === 'number') return value.totalTestCount;
            if (Array.isArray(value.assertionResults)) return value.assertionResults.length;
            let total = 0;
            for (const child of Object.values(value)) {
              if (Array.isArray(child)) total += child.reduce((sum, item) => sum + countTests(item), 0);
              else if (child && typeof child === 'object') total += countTests(child);
            }
            return total;
          }
          let total = 0;
          const resultDir = 'rc-test-results';
          const files = fs.existsSync(resultDir)
            ? fs.readdirSync(resultDir).filter((name) => name.endsWith('.json'))
            : [];
          for (const file of files) {
            try {
              total += countTests(JSON.parse(fs.readFileSync(path.join(resultDir, file), 'utf8')));
            } catch {}
          }
          console.log(`NEXUS_RELEASE_VITEST_TEST_COUNT=${total}`);
          const pytestPath = path.join(resultDir, 'pytest-results.log');
          const pytestLog = fs.existsSync(pytestPath)
            ? fs.readFileSync(pytestPath, 'utf8')
            : '';
          const pytestMatch = pytestLog.match(/(\d+)\s+passed(?:,|\s)/);
          console.log(`NEXUS_RELEASE_PYTEST_TEST_COUNT=${pytestMatch ? Number(pytestMatch[1]) : 0}`);
          NODE

      - name: Write release evidence
        id: write_evidence
        env:
          NEXUS_RELEASE_TEST_IMAGE: nexus-hub-release-test:ci
          NEXUS_RELEASE_TEST_SKIP_BUILD: '1'
          NEXUS_RELEASE_EVIDENCE_PATH: docs/release/evidence/release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          NEXUS_RELEASE_EVIDENCE_PRIVATE_KEY_PEM: ${{ secrets.NEXUS_RELEASE_EVIDENCE_PRIVATE_KEY_PEM }}
          NEXUS_RELEASE_EVIDENCE_KEY_ID: github-actions-release-evidence-2026-06
          NEXUS_RELEASE_CI_PROVIDER: github-actions
          NEXUS_RELEASE_RUN_ID: ${{ github.run_id }}
          NEXUS_RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          NEXUS_RELEASE_VERDICT: ${{ needs.vitest-full.result == 'success' && needs.python-full.result == 'success' && steps.typecheck.outcome == 'success' && steps.science_policy.outcome == 'success' && steps.build.outcome == 'success' && steps.migrations.outcome == 'success' && steps.cannot_skip_dashboard.outcome == 'success' && steps.release_test_image.outcome == 'success' && steps.sandbox_smoke.outcome == 'success' && 'passed' || 'failed' }}
          NEXUS_RELEASE_VITEST_RESULT: ${{ needs.vitest-full.result }}
          NEXUS_RELEASE_TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          NEXUS_RELEASE_BUILD_RESULT: ${{ steps.build.outcome }}
          NEXUS_RELEASE_PYTEST_RESULT: ${{ needs.python-full.result }}
          NEXUS_RELEASE_SCIENCE_POLICY_RESULT: ${{ steps.science_policy.outcome }}
          NEXUS_RELEASE_MIGRATIONS_RESULT: ${{ steps.migrations.outcome }}
          NEXUS_RELEASE_CANNOT_SKIP_DASHBOARD_RESULT: ${{ steps.cannot_skip_dashboard.outcome }}
          NEXUS_RELEASE_SMOKE_RESULT: ${{ steps.sandbox_smoke.outcome }}
        run: |
          scripts/release-evidence-container.sh write --json
          cp "docs/release/evidence/release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.json" docs/release/evidence/latest-release-evidence.json

      - name: Validate signed release evidence
        run: |
          node scripts/release-evidence.mjs validate \
            --evidence "docs/release/evidence/release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.json" \
            --public-key docs/release/evidence/release-evidence-public-key.pem \
            --expect-sha "${{ github.sha }}" \
            --json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            docs/release/evidence/release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.json
            docs/release/evidence/latest-release-evidence.json
            cannot-skip-dashboard.json
            rc-test-results/*.json
          retention-days: 30
