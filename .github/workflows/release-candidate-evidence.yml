name: RC — Release Evidence
run-name: RC evidence ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      contract_scope:
        description: 'Classify this candidate as backend-only or shared backend/iOS'
        required: true
        type: choice
        options:
          - select_contract_scope
          - backend_only
          - shared_backend_ios
      ios_sha:
        description: 'Exact lowercase 40-character iOS Git SHA (shared releases only)'
        required: false
        type: string
      ios_build_number:
        description: 'Positive App Store build number (shared releases only)'
        required: false
        type: string
      ios_contract_result:
        description: 'Must be passed for a shared backend/iOS release'
        required: false
        type: string
      force_full:
        description: 'Force the four-shard full Vitest suite for this RC'
        required: false
        default: false
        type: boolean
      protected_reuse_activation_b64:
        description: 'Optional GitHub-signed protected-main reuse activation; invalid or absent evidence falls back to RC Vitest'
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: rc-release-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'
  PYTHON_VERSION: '3.12'
  TZ: Europe/Lisbon
  CONTRACT_SCOPE: ${{ inputs.contract_scope }}
  IOS_SHA: ${{ inputs.ios_sha }}
  IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
  IOS_CONTRACT_RESULT: ${{ inputs.ios_contract_result }}

jobs:
  contract-binding:
    name: 🔗 Validate release contract binding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an explicit, complete contract scope
        run: |
          case "$CONTRACT_SCOPE" in
            backend_only)
              [[ -z "$IOS_SHA" && -z "$IOS_BUILD_NUMBER" && -z "$IOS_CONTRACT_RESULT" ]] || {
                echo "backend_only candidates must not include iOS contract fields" >&2
                exit 64
              }
              ;;
            shared_backend_ios)
              [[ "$IOS_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                echo "ios_sha must be an exact lowercase Git SHA" >&2
                exit 64
              }
              [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
                echo "ios_build_number must be a positive integer" >&2
                exit 64
              }
              [[ "$IOS_CONTRACT_RESULT" == 'passed' ]] || {
                echo "ios_contract_result must be passed" >&2
                exit 64
              }
              ;;
            *)
              echo "contract_scope must be explicitly selected" >&2
              exit 64
              ;;
          esac

  test-plan:
    name: 🧭 Resolve release test tier
    needs: contract-binding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full_required: ${{ steps.plan.outputs.full_required }}
      full_required_reason: ${{ steps.plan.outputs.full_required_reason }}
      tier: ${{ steps.plan.outputs.tier }}
      reuse_allowed: ${{ steps.reuse.outputs.reuse_allowed }}
      protected_main_run_id: ${{ steps.reuse.outputs.main_run_id }}
      protected_main_artifact_name: ${{ steps.reuse.outputs.artifact_name }}
      protected_main_artifact_digest: ${{ steps.reuse.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download recent qualifying-nightly candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/release/nightly-evidence
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=10" \
            --jq '.workflow_runs[].id' > .local/release/nightly-run-ids.txt
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'nightly-full-suite-evidence-*' \
              --dir ".local/release/nightly-evidence/$run_id" >/dev/null 2>&1 || true
          done < .local/release/nightly-run-ids.txt

      - name: Resolve exact release test selection
        id: plan
        env:
          FORCE_FULL: ${{ inputs.force_full || 'false' }}
        run: |
          node scripts/release-test-evidence.mjs plan \
            --head "$GITHUB_SHA" \
            --nightly-dir .local/release/nightly-evidence \
            --force-full "$FORCE_FULL" \
            --out .local/release/test-selection.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const selection = require('./.local/release/test-selection.json');
          console.log(`full_required=${selection.fullRequired}`);
          console.log(`full_required_reason=${selection.fullRequiredReason ?? 'none'}`);
          console.log(`tier=${selection.tier}`);
          NODE

      - name: Authorize exact-SHA protected-main evidence reuse
        id: reuse
        env:
          ACTIVATION_B64: ${{ inputs.protected_reuse_activation_b64 }}
          FORCE_FULL: ${{ inputs.force_full || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "reuse_allowed=false" >> "$GITHUB_OUTPUT"
          echo "main_run_id=" >> "$GITHUB_OUTPUT"
          echo "artifact_name=" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=" >> "$GITHUB_OUTPUT"
          if [[ -z "$ACTIVATION_B64" || "$FORCE_FULL" == 'true' ]]; then
            echo "Protected-main reuse is inactive; the existing RC Vitest path remains selected."
            exit 0
          fi
          [[ ${#ACTIVATION_B64} -le 60000 && "$ACTIVATION_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] \
            || { echo "Reuse activation input is malformed; retaining RC fallback."; exit 0; }
          install -d -m 700 .local/release/protected-main-reuse/main
          if ! printf '%s' "$ACTIVATION_B64" | base64 --decode \
            > .local/release/protected-main-reuse/activation.json; then
            echo "Reuse activation cannot be decoded; retaining RC fallback."
            exit 0
          fi
          main_run_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=10" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")][0].id // empty')"
          if [[ ! "$main_run_id" =~ ^[1-9][0-9]*$ ]] || ! gh run download "$main_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "protected-main-ci-evidence-$main_run_id-*" \
            --dir .local/release/protected-main-reuse/main; then
            echo "Exact protected-main evidence is unavailable; retaining RC fallback."
            exit 0
          fi
          mapfile -t evidence_files < <(find .local/release/protected-main-reuse/main \
            -type f -name protected-main-ci-evidence.json -print)
          [[ "${#evidence_files[@]}" -eq 1 ]] || {
            echo "Exact protected-main evidence is ambiguous; retaining RC fallback."
            exit 0
          }
          if ! node scripts/protected-main-reuse-activation.mjs authorize \
            --activation .local/release/protected-main-reuse/activation.json \
            --main-evidence "${evidence_files[0]}" \
            --selection .local/release/test-selection.json \
            --release-public-key docs/release/evidence/release-evidence-public-key.pem \
            --repository "$GITHUB_REPOSITORY" \
            --output .local/release/protected-main-reuse/decision.json; then
            echo "Reuse activation verification failed; retaining RC fallback."
            exit 0
          fi
          allowed="$(jq -r '.allowed' .local/release/protected-main-reuse/decision.json)"
          [[ "$allowed" == 'true' ]] || {
            echo "Protected-main evidence is not reusable; retaining RC fallback."
            exit 0
          }
          cp "${evidence_files[0]}" .local/release/protected-main-reuse/protected-main-ci-evidence.json
          echo "reuse_allowed=true" >> "$GITHUB_OUTPUT"
          echo "main_run_id=$(jq -r '.mainRunId' .local/release/protected-main-reuse/decision.json)" \
            >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(jq -r '.artifactName' .local/release/protected-main-reuse/decision.json)" \
            >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$(jq -r '.artifactDigest' .local/release/protected-main-reuse/decision.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Upload exact release test selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/release/test-selection.json
            .local/release/protected-main-reuse/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  vitest-full:
    name: 🧪 Full Vitest shard ${{ matrix.shard }}/4
    needs: test-plan
    if: ${{ needs.test-plan.outputs.full_required == 'true' && needs.test-plan.outputs.reuse_allowed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Vitest shard
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
        run: |
          node scripts/run-test-tier.mjs deterministic \
            --shard '${{ matrix.shard }}/4' \
            --reporter json \
            --json-output 'vitest-results-${{ matrix.shard }}.json'

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-results-${{ matrix.shard }}
          path: vitest-results-${{ matrix.shard }}.json
          retention-days: 14

  vitest-selected:
    name: 🧪 Policy-selected Vitest
    needs: test-plan
    if: ${{ needs.test-plan.outputs.full_required == 'false' && needs.test-plan.outputs.reuse_allowed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-test-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release

      - name: Run changed plus critical plus cannot-skip selection
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
        run: |
          node scripts/release-test-evidence.mjs run-selected \
            --selection .local/release/test-selection.json \
            --output vitest-results-selected.json

      - name: Upload selected result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-results-selected
          path: vitest-results-selected.json
          retention-days: 14

  python-full:
    name: 🐍 Content Engine full pytest
    needs: contract-binding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      python_version: ${{ steps.python_identity.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: content-engine/requirements.txt

      - name: Record exact Python test toolchain
        id: python_identity
        run: echo "version=$(python --version)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          cd content-engine
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Full pytest
        run: |
          cd content-engine
          set -o pipefail
          python -m pytest tests/ -v | tee ../pytest-results.log

      - name: Upload pytest result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: pytest-results.log
          retention-days: 14

  release-evidence:
    name: 📦 Write unsigned release candidate
    runs-on: ubuntu-24.04
    needs: [contract-binding, test-plan, vitest-full, vitest-selected, python-full]
    if: ${{ always() }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: npm ci

      - name: Verify production artifact build platform
        run: |
          test "$(uname -m)" = 'x86_64'
          . /etc/os-release
          test "$ID" = 'ubuntu'
          test "$VERSION_ID" = '24.04'
          test "$(python --version)" = '${{ needs.python-full.outputs.python_version }}'

      - name: Stop when selected test prerequisites failed
        if: ${{ needs.contract-binding.result != 'success' || needs.test-plan.result != 'success' || needs.python-full.result != 'success' || (needs.test-plan.outputs.reuse_allowed != 'true' && needs.test-plan.outputs.full_required == 'true' && needs.vitest-full.result != 'success') || (needs.test-plan.outputs.reuse_allowed != 'true' && needs.test-plan.outputs.full_required == 'false' && needs.vitest-selected.result != 'success') }}
        run: |
          echo "Release test prerequisites did not pass."
          echo "contract-binding=${{ needs.contract-binding.result }}"
          echo "test-plan=${{ needs.test-plan.result }}"
          echo "tier=${{ needs.test-plan.outputs.tier }}"
          echo "full-required=${{ needs.test-plan.outputs.full_required }}"
          echo "full-required-reason=${{ needs.test-plan.outputs.full_required_reason }}"
          echo "reuse-allowed=${{ needs.test-plan.outputs.reuse_allowed }}"
          echo "vitest-full=${{ needs.vitest-full.result }}"
          echo "vitest-selected=${{ needs.vitest-selected.result }}"
          echo "python-full=${{ needs.python-full.result }}"
          exit 1

      - name: Prepare result directory
        run: mkdir -p .local/release/rc-test-results

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-test-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.test-plan.outputs.reuse_allowed != 'true' }}
        with:
          pattern: vitest-results-*
          path: .local/release/rc-test-results
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pytest-results
          path: .local/release/rc-test-results

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Science policy
        id: science_policy
        continue-on-error: true
        run: npm run science-policy:check

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Migration rehearsal
        id: migrations
        continue-on-error: true
        run: node scripts/migration-safety-check.mjs

      - name: Cannot-skip dashboard
        id: cannot_skip_dashboard
        continue-on-error: true
        run: scripts/cannot-skip-gate-dashboard.sh --json --no-evidence > .local/release/cannot-skip-dashboard.json

      - name: Build release-test container
        id: release_test_image
        continue-on-error: true
        run: DOCKER_BUILDKIT=1 docker build -f Dockerfile.release-test -t nexus-hub-release-test:ci .

      - name: Sandbox smoke / container release gate contract
        id: sandbox_smoke
        continue-on-error: true
        env:
          NEXUS_RELEASE_TEST_IMAGE: nexus-hub-release-test:ci
          NEXUS_RELEASE_TEST_SKIP_BUILD: '1'
        run: scripts/release-verify-container.sh --skip-vitest --skip-pytest

      - name: Build immutable runtime bundle
        if: ${{ needs.test-plan.outputs.reuse_allowed != 'true' }}
        run: |
          scripts/build-release-runtime-dependencies.sh
          node scripts/release-bundle.mjs --runtime-sha "${{ github.sha }}"

      - name: Reuse and verify the exact protected-main runtime bundle
        if: ${{ needs.test-plan.outputs.reuse_allowed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_RUN_ID: ${{ needs.test-plan.outputs.protected_main_run_id }}
          ARTIFACT_NAME: ${{ needs.test-plan.outputs.protected_main_artifact_name }}
          ARTIFACT_DIGEST: ${{ needs.test-plan.outputs.protected_main_artifact_digest }}
        run: |
          [[ "$MAIN_RUN_ID" =~ ^[1-9][0-9]*$ \
            && "$ARTIFACT_NAME" == "release-bundle-$GITHUB_SHA-$ARTIFACT_DIGEST" \
            && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 64
          bundle_root=".local/release/bundles/$GITHUB_SHA/$ARTIFACT_DIGEST"
          install -d -m 700 "$bundle_root"
          gh run download "$MAIN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir "$bundle_root"
          node scripts/release-artifact-manifest.mjs \
            --verify-bundle "$bundle_root" \
            --expected-runtime-sha "$GITHUB_SHA" \
            --expected-digest "$ARTIFACT_DIGEST"

      - name: Write exact release-test result
        id: write_test_result
        env:
          NEXUS_RELEASE_VERDICT: ${{ steps.typecheck.outcome == 'success' && steps.science_policy.outcome == 'success' && steps.build.outcome == 'success' && steps.migrations.outcome == 'success' && steps.cannot_skip_dashboard.outcome == 'success' && steps.release_test_image.outcome == 'success' && steps.sandbox_smoke.outcome == 'success' && 'passed' || 'failed' }}
          NEXUS_RELEASE_PYTHON_VERSION: ${{ needs.python-full.outputs.python_version }}
        run: |
          if [[ '${{ needs.test-plan.outputs.reuse_allowed }}' == 'true' ]]; then
            node scripts/release-test-evidence.mjs write-reused-result \
              --status "$NEXUS_RELEASE_VERDICT" \
              --runtime-sha "$GITHUB_SHA" \
              --selection .local/release/test-selection.json \
              --main-evidence .local/release/protected-main-reuse/protected-main-ci-evidence.json \
              --activation .local/release/protected-main-reuse/activation.json \
              --pytest-log .local/release/rc-test-results/pytest-results.log \
              --python-version "$NEXUS_RELEASE_PYTHON_VERSION" \
              --repository "$GITHUB_REPOSITORY" \
              --out .local/release/test-results.json
          else
            node scripts/release-test-evidence.mjs write-result \
              --status "$NEXUS_RELEASE_VERDICT" \
              --runtime-sha "$GITHUB_SHA" \
              --selection .local/release/test-selection.json \
              --vitest-results-dir .local/release/rc-test-results \
              --pytest-log .local/release/rc-test-results/pytest-results.log \
              --python-version "$NEXUS_RELEASE_PYTHON_VERSION" \
              --artifact-digest "$(node scripts/release-artifact-manifest.mjs --digest | tr -d '\n')" \
              --out .local/release/test-results.json
          fi

      - name: Compare protected-main evidence in shadow mode
        if: ${{ needs.test-plan.outputs.reuse_allowed != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/release/protected-main
          main_run_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=10" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")][0].id // empty')"
          if [ -z "$main_run_id" ]; then
            node scripts/protected-main-ci-evidence.mjs missing \
              --release-results .local/release/test-results.json \
              --reason protected_main_evidence_missing \
              --out .local/release/protected-main-shadow-comparison.json
          elif ! gh run download "$main_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "protected-main-ci-evidence-$main_run_id-*" \
            --dir .local/release/protected-main; then
            node scripts/protected-main-ci-evidence.mjs missing \
              --release-results .local/release/test-results.json \
              --reason protected_main_artifact_missing \
              --out .local/release/protected-main-shadow-comparison.json
          else
            mapfile -t protected_main_files < <(find .local/release/protected-main \
              -type f -name protected-main-ci-evidence.json -print)
            if [ "${#protected_main_files[@]}" -ne 1 ] \
              || ! node scripts/protected-main-ci-evidence.mjs compare \
                --main-evidence "${protected_main_files[0]:-missing}" \
                --release-results .local/release/test-results.json \
                --out .local/release/protected-main-shadow-comparison.json; then
              node scripts/protected-main-ci-evidence.mjs missing \
                --release-results .local/release/test-results.json \
                --reason protected_main_evidence_invalid \
                --out .local/release/protected-main-shadow-comparison.json
            fi
          fi

      - name: Bind the protected-main shadow record into release-test evidence
        if: ${{ needs.test-plan.outputs.reuse_allowed != 'true' }}
        run: |
          bind_args=(
            --results .local/release/test-results.json
            --comparison .local/release/protected-main-shadow-comparison.json
          )
          mapfile -t protected_main_files < <(find .local/release/protected-main \
            -type f -name protected-main-ci-evidence.json -print 2>/dev/null || true)
          comparison_has_main="$(node -e \
            'const x=require("./.local/release/protected-main-shadow-comparison.json"); process.stdout.write(x.mainCi === null ? "false" : "true")')"
          if [ "${#protected_main_files[@]}" -eq 1 ] && [ "$comparison_has_main" = 'true' ]; then
            bind_args+=(--main-evidence "${protected_main_files[0]}")
          fi
          node scripts/release-test-evidence.mjs bind-protected-main-shadow "${bind_args[@]}"

      - name: Write unsigned ReleaseManifestV2 candidate
        env:
          NEXUS_RELEASE_PYTHON_VERSION: Python ${{ env.PYTHON_VERSION }}
        run: |
          contract_args=(--backend-only)
          if [[ "$CONTRACT_SCOPE" == 'shared_backend_ios' ]]; then
            contract_args=(
              --includes-ios
              --ios-sha "$IOS_SHA"
              --ios-build-number "$IOS_BUILD_NUMBER"
              --ios-contract-result "$IOS_CONTRACT_RESULT"
            )
          fi
          node scripts/release-manifest-v2.mjs write \
            --allow-unsigned \
            --key-id unsigned-release-candidate \
            --manifest ".local/release/manifests/${{ github.sha }}.unsigned.json" \
            --runtime-sha "${{ github.sha }}" \
            --docs-head "${{ github.sha }}" \
            "${contract_args[@]}"

      - name: Validate unsigned candidate payload
        run: |
          expectation_args=(--expect-backend-only)
          if [[ "$CONTRACT_SCOPE" == 'shared_backend_ios' ]]; then
            expectation_args=(
              --require-ios-contract
              --expect-ios-sha "$IOS_SHA"
              --expect-ios-build-number "$IOS_BUILD_NUMBER"
              --expect-ios-contract-result "$IOS_CONTRACT_RESULT"
            )
          fi
          node scripts/release-manifest-v2.mjs validate-payload \
            --manifest ".local/release/manifests/${{ github.sha }}.unsigned.json" \
            --expect-runtime-sha "${{ github.sha }}" \
            "${expectation_args[@]}"

      - name: Upload unsigned release candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-v2-${{ github.sha }}
          path: |
            .local/release/manifests/${{ github.sha }}.unsigned.json
            .local/release/bundles/${{ github.sha }}/**
            .local/release/bundles/${{ github.sha }}/**/.complete.json
            .local/release/test-selection.json
            .local/release/test-results.json
            .local/release/protected-main-shadow-comparison.json
            .local/release/cannot-skip-dashboard.json
            .local/release/rc-test-results/*
          include-hidden-files: true
          retention-days: 30
