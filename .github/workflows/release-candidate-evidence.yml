name: RC — Release Evidence

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: rc-release-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.1'
  PYTHON_VERSION: '3.12'
  TZ: Europe/Lisbon

jobs:
  vitest-full:
    name: 🧪 Full Vitest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Vitest shard
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
        run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=json --outputFile=vitest-results-${{ matrix.shard }}.json

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-results-${{ matrix.shard }}
          path: vitest-results-${{ matrix.shard }}.json
          retention-days: 14

  python-full:
    name: 🐍 Content Engine full pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: content-engine/requirements.txt

      - name: Install dependencies
        run: |
          cd content-engine
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Full pytest
        run: |
          cd content-engine
          set -o pipefail
          python -m pytest tests/ -v | tee ../pytest-results.log

      - name: Upload pytest result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: pytest-results.log
          retention-days: 14

  release-evidence:
    name: 📦 Write release evidence
    runs-on: ubuntu-latest
    needs: [vitest-full, python-full]
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Stop when full-suite prerequisites failed
        if: ${{ needs.vitest-full.result != 'success' || needs.python-full.result != 'success' }}
        run: |
          echo "Full-suite prerequisites did not pass."
          echo "vitest-full=${{ needs.vitest-full.result }}"
          echo "python-full=${{ needs.python-full.result }}"
          exit 1

      - name: Prepare result directory
        run: mkdir -p .local/release/rc-test-results

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: vitest-results-*
          path: .local/release/rc-test-results
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: pytest-results
          path: .local/release/rc-test-results

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Science policy
        id: science_policy
        continue-on-error: true
        run: npm run science-policy:check

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Migration rehearsal
        id: migrations
        continue-on-error: true
        run: node scripts/migration-safety-check.mjs

      - name: Cannot-skip dashboard
        id: cannot_skip_dashboard
        continue-on-error: true
        run: scripts/cannot-skip-gate-dashboard.sh --json --no-evidence > .local/release/cannot-skip-dashboard.json

      - name: Build release-test container
        id: release_test_image
        continue-on-error: true
        run: DOCKER_BUILDKIT=1 docker build -f Dockerfile.release-test -t nexus-hub-release-test:ci .

      - name: Sandbox smoke / container release gate contract
        id: sandbox_smoke
        continue-on-error: true
        env:
          NEXUS_RELEASE_TEST_IMAGE: nexus-hub-release-test:ci
          NEXUS_RELEASE_TEST_SKIP_BUILD: '1'
        run: scripts/release-verify-container.sh --skip-vitest --skip-pytest

      - name: Count tests from shard artifacts
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const path = require('path');
          function countTests(value) {
            if (!value || typeof value !== 'object') return 0;
            if (typeof value.numTotalTests === 'number') return value.numTotalTests;
            if (typeof value.totalTestCount === 'number') return value.totalTestCount;
            if (Array.isArray(value.assertionResults)) return value.assertionResults.length;
            let total = 0;
            for (const child of Object.values(value)) {
              if (Array.isArray(child)) total += child.reduce((sum, item) => sum + countTests(item), 0);
              else if (child && typeof child === 'object') total += countTests(child);
            }
            return total;
          }
          let total = 0;
          const resultDir = '.local/release/rc-test-results';
          const files = fs.existsSync(resultDir)
            ? fs.readdirSync(resultDir).filter((name) => name.endsWith('.json'))
            : [];
          for (const file of files) {
            try {
              total += countTests(JSON.parse(fs.readFileSync(path.join(resultDir, file), 'utf8')));
            } catch {}
          }
          console.log(`NEXUS_RELEASE_VITEST_TEST_COUNT=${total}`);
          const pytestPath = path.join(resultDir, 'pytest-results.log');
          const pytestLog = fs.existsSync(pytestPath)
            ? fs.readFileSync(pytestPath, 'utf8')
            : '';
          const pytestMatch = pytestLog.match(/(\d+)\s+passed(?:,|\s)/);
          console.log(`NEXUS_RELEASE_PYTEST_TEST_COUNT=${pytestMatch ? Number(pytestMatch[1]) : 0}`);
          NODE

      - name: Write exact release-test result
        id: write_test_result
        env:
          NEXUS_RELEASE_VERDICT: ${{ needs.vitest-full.result == 'success' && needs.python-full.result == 'success' && steps.typecheck.outcome == 'success' && steps.science_policy.outcome == 'success' && steps.build.outcome == 'success' && steps.migrations.outcome == 'success' && steps.cannot_skip_dashboard.outcome == 'success' && steps.release_test_image.outcome == 'success' && steps.sandbox_smoke.outcome == 'success' && 'passed' || 'failed' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('.local/release/test-results.json', JSON.stringify({
            schema: 'nexus.release-test-results.v1',
            status: process.env.NEXUS_RELEASE_VERDICT,
            runtimeSha: process.env.GITHUB_SHA,
            completedAt: new Date().toISOString(),
            toolchain: { node: process.version, python: `Python ${process.env.PYTHON_VERSION}` },
            counts: {
              vitest: Number(process.env.NEXUS_RELEASE_VITEST_TEST_COUNT || 0),
              pytest: Number(process.env.NEXUS_RELEASE_PYTEST_TEST_COUNT || 0),
            },
            ci: { runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT },
          }, null, 2) + '\n', { mode: 0o600 });
          NODE
          test "$NEXUS_RELEASE_VERDICT" = passed

      - name: Build immutable runtime bundle
        run: node scripts/release-bundle.mjs --runtime-sha "${{ github.sha }}"

      - name: Sign ReleaseManifestV2
        env:
          NEXUS_RELEASE_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.NEXUS_RELEASE_EVIDENCE_PRIVATE_KEY_PEM }}
          NEXUS_RELEASE_MANIFEST_KEY_ID: github-actions-release-manifest-2026-07
          NEXUS_RELEASE_PYTHON_VERSION: Python ${{ env.PYTHON_VERSION }}
        run: |
          node scripts/release-manifest-v2.mjs write \
            --manifest ".local/release/manifests/${{ github.sha }}.json" \
            --runtime-sha "${{ github.sha }}" \
            --docs-head "${{ github.sha }}"

      - name: Validate signed ReleaseManifestV2
        env:
          NEXUS_RELEASE_MANIFEST_PUBLIC_KEY_PEM: ${{ vars.NEXUS_RELEASE_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          node scripts/release-manifest-v2.mjs validate \
            --manifest ".local/release/manifests/${{ github.sha }}.json" \
            --public-key docs/release/evidence/release-evidence-public-key.pem \
            --expect-runtime-sha "${{ github.sha }}"

      - name: Artifact-bound reward verification
        env:
          NEXUS_RELEASE_MANIFEST_PUBLIC_KEY_PEM: ${{ vars.NEXUS_RELEASE_MANIFEST_PUBLIC_KEY_PEM }}
        run: |
          node scripts/reward-check.mjs --area release --advisory --json \
            --release-manifest ".local/release/manifests/${{ github.sha }}.json" \
            --output ".local/release/reward-${{ github.sha }}.json" \
            > .local/release/reward-summary.json

      - name: Upload immutable release bundle and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-v2-${{ github.sha }}
          path: |
            .local/release/manifests/${{ github.sha }}.json
            .local/release/bundles/${{ github.sha }}/**
            .local/release/bundles/${{ github.sha }}/**/.complete.json
            .local/release/test-results.json
            .local/release/reward-${{ github.sha }}.json
            .local/release/reward-summary.json
            .local/release/cannot-skip-dashboard.json
            .local/release/rc-test-results/*
          include-hidden-files: true
          retention-days: 30
