name: Manual — Test rationalization mutation evidence

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional explicit mutation base SHA
        required: false
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'

jobs:
  test-cleanup-mutation:
    name: Mutation score — deleted test behavior owners
    runs-on: ubuntu-latest
    # Advisory only: execute every changed critical range in sequential
    # one-source processes. Start conservatively, then ratchet this timeout
    # from measured successful sweeps instead of dropping deferred targets.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Resolve the rationalization source window
        id: base
        env:
          INPUT_BASE: ${{ inputs.base_sha }}
        run: |
          BASE="$INPUT_BASE"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          test -n "$BASE"
          git rev-parse --verify "${BASE}^{commit}"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - name: Run mapped test-cleanup mutation gate
        run: npm run test:mutation -- --base '${{ steps.base.outputs.sha }}' --scope test-cleanup
      - name: Upload mutation plan and score
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/mutation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
