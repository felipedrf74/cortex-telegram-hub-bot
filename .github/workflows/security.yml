name: Security — supply chain and static analysis

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
  schedule:
    - cron: '40 5 * * 1'
  workflow_dispatch:
    inputs:
      codeql_scope:
        description: 'Broad required scan or manual deployed-source shadow'
        required: true
        default: broad
        type: choice
        options:
          - broad
          - deployed_source_shadow

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'
  PYTHON_VERSION: '3.12'

jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Initialize broad required CodeQL scan
        if: ${{ inputs.codeql_scope != 'deployed_source_shadow' }}
        uses: github/codeql-action/init@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          languages: javascript-typescript
      - name: Initialize manual deployed-source shadow
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.codeql_scope == 'deployed_source_shadow' }}
        uses: github/codeql-action/init@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/deployed-source-shadow.yml
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # CodeQL extracts JavaScript/TypeScript source directly. Dependency
      # installation and compilation are owned by required CI and only created
      # duplicate generated-code work in this exact-SHA security job.
      - name: Analyze and upload broad required SARIF
        if: ${{ inputs.codeql_scope != 'deployed_source_shadow' }}
        uses: github/codeql-action/analyze@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          upload: always
          upload-database: false
          wait-for-processing: true
      - name: Analyze and upload deployed-source shadow SARIF
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.codeql_scope == 'deployed_source_shadow' }}
        uses: github/codeql-action/analyze@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          category: /language:javascript-typescript/scope:deployed-source-shadow
          upload: always
          upload-database: false
          wait-for-processing: true

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit production dependencies (high+)
        run: npm audit --audit-level=high --omit=dev

  python-audit:
    name: Python content-engine audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            content-engine/requirements-audit-tool.in
            content-engine/requirements-audit-tool.txt
            content-engine/requirements-lock-tool.txt
            content-engine/requirements-release.txt
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify hash-locked Python release closure
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r content-engine/requirements-lock-tool.txt
          node scripts/generate-python-release-lock.mjs --check
          python -m pip install --dry-run --ignore-installed --require-hashes \
            --only-binary=:all: -r content-engine/requirements-release.txt
      - name: pip-audit
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r content-engine/requirements-audit-tool.txt
          if [ -f content-engine/requirements-release.txt ]; then
            pip-audit -r content-engine/requirements-release.txt
          fi

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@99c09fe975337306107572b4fdf4db224cf8e2f2 # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
        with:
          sarif_file: scorecard-results.sarif
