name: Promote Reachability Smoke

on:
  workflow_dispatch:
    inputs:
      runner_labels:
        description: 'JSON labels for the self-hosted promote runner'
        required: true
        default: '["self-hosted","nexus-hub-promote"]'
        type: string

permissions:
  contents: read

env:
  DEPLOY_SERVER: dominguez@serverdominguez
  PUBLIC_PROD_HEALTH_URL: https://api.nexushub.me/health
  PUBLIC_STAGING_HEALTH_URL: https://api-staging.nexushub.me/health

jobs:
  cloudflare-https-smoke:
    name: Cloudflare HTTPS reachability
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and probe public tunnel hosts
        shell: bash
        run: |
          set -euo pipefail

          for url in "$PUBLIC_PROD_HEALTH_URL" "$PUBLIC_STAGING_HEALTH_URL"; do
            host="${url#https://}"
            host="${host%%/*}"

            echo "Resolving $host"
            getent ahosts "$host" | awk '{ print "  " $1 " " $2 }' | sort -u

            echo "Probing $url"
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url")"
            case "$code" in
              200|503)
                echo "  HTTP $code from $host"
                ;;
              *)
                echo "Expected $url to resolve through Cloudflare and return HTTP 200 or 503, got $code"
                cat "$body"
                exit 1
                ;;
            esac
          done

  self-hosted-ssh-smoke:
    name: Self-hosted SSH reachability
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Verify local promote tooling is present
        shell: bash
        run: |
          set -euo pipefail
          command -v bash
          command -v curl
          command -v ssh
          command -v rsync
          command -v npm
          test -x scripts/deploy-staging.sh
          test -x scripts/promote-to-prod.sh
          test -x scripts/deploy.sh

      - name: Resolve SSH target
        shell: bash
        run: |
          set -euo pipefail
          target="${DEPLOY_SERVER##*@}"
          DEPLOY_TARGET="$target" node <<'NODE'
          const dns = require('node:dns').promises;

          const target = process.env.DEPLOY_TARGET;
          dns.lookup(target, { all: true }).then((records) => {
            if (!records.length) {
              throw new Error(`No DNS records returned for ${target}`);
            }
            for (const record of records) {
              console.log(`${target} ${record.address} family=${record.family}`);
            }
          }).catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Assert SSH works from self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 "$DEPLOY_SERVER" "printf 'ssh-ok\n'"
