name: Nightly — Full regression + coverage

# release-pipeline-risk-based-optimization (2026-05-03):
# Coverage upload + full vitest now run nightly + on-demand instead of on
# every PR. The risk-based ci.yml runs focused tests on PRs; nightly is
# where the breadth lives.
#
# Manual run:
#   gh workflow run "Nightly — Full regression + coverage"

on:
  schedule:
    - cron: '15 4 * * *'   # 04:15 UTC daily
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: '22.23.1'

jobs:
  full-vitest-coverage:
    name: 🧪 Full vitest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Download recent timing history (advisory)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/test-profile/timing-history
          mkdir -p .local/test-profile/timing-history-downloads
          if ! gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=10" \
            --jq '.workflow_runs[].id' > .local/test-profile/timing-history-run-ids.txt; then
            echo "::warning::Nightly timing history is unavailable; current timing remains advisory."
            exit 0
          fi
          considered=0
          selected=0
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            [ "$run_id" != "$GITHUB_RUN_ID" ] || continue
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || continue
            [ "$considered" -lt 10 ] || break
            considered=$((considered + 1))
            run_download=".local/test-profile/timing-history-downloads/$run_id"
            mkdir -p "$run_download"
            artifacts_json="$run_download/artifacts.json"
            if ! gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              > "$artifacts_json"; then
              echo "::warning::Could not inspect timing artifacts for prior run $run_id."
              continue
            fi
            selection_json="$run_download/selection.json"
            if ! artifact_id="$(node scripts/test-timing-history-artifact.mjs select \
              --run-id "$run_id" \
              --artifacts "$artifacts_json" \
              --output "$selection_json")"; then
              echo "::warning::Prior run $run_id has no unique bounded timing artifact."
              continue
            fi
            archive="$run_download/artifact.zip"
            if ! gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$archive"; then
              echo "::warning::Could not download timing artifact for prior run $run_id."
              continue
            fi
            inventory=".local/test-profile/timing-history/$run_id/test-inventory.json"
            if ! node scripts/test-timing-history-artifact.mjs extract \
              --archive "$archive" \
              --output "$inventory"; then
              echo "::warning::Prior run $run_id timing inventory failed bounded extraction."
              continue
            fi
            selected=$((selected + 1))
          done < .local/test-profile/timing-history-run-ids.txt
          echo "Selected $selected bounded timing artifact(s) from $considered prior successful nightly run(s)."

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Full vitest with coverage
        env:
          NODE_ENV: test
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_ALLOWED_USER_IDS: '123456789'
          ANTHROPIC_API_KEY: sk-ant-test-key
          DATABASE_PATH: ':memory:'
        run: |
          mkdir -p .local/test-profile
          node scripts/run-test-tier.mjs deterministic \
            --reporter default \
            --json-output .local/test-profile/vitest-results.json \
            --coverage
          node scripts/test-inventory.mjs \
            --timings .local/test-profile/vitest-results.json \
            --timing-history-dir .local/test-profile/timing-history \
            --timing-scope deterministic \
            --timing-mode advisory \
            --enforce-evidence

      - name: Write qualifying nightly full-suite evidence
        env:
          GITHUB_WORKFLOW: Nightly — Full regression + coverage
        run: |
          node scripts/release-test-evidence.mjs write-nightly \
            --head "$GITHUB_SHA" \
            --vitest-results .local/test-profile/vitest-results.json \
            --out .local/test-profile/nightly-full-suite-evidence.json

      - name: Upload qualifying nightly full-suite evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-full-suite-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/test-profile/nightly-full-suite-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload test timing and disposition inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/test-profile/vitest-results.json
            .local/test-inventory/test-inventory.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  python-full-compile:
    name: 🐍 Content Engine full compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: content-engine/requirements.txt

      - run: |
          cd content-engine
          pip install -r requirements.txt
          python -m py_compile main.py config.py
          find . -name "*.py" -not -path "./.venv/*" -not -path "./__pycache__/*" \
            -exec python -m py_compile {} \;

  migration-rehearsal:
    name: 🗃️ Migration full rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Verify sequence, duplicates, and cumulative apply
        run: node scripts/migration-safety-check.mjs

  release-doc-drift-strict:
    name: 📝 Release-doc drift (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # audit-docs.mjs shells out to generate-project-map.mjs, which imports
      # the `typescript` package — without node_modules that import throws
      # ERR_MODULE_NOT_FOUND and the crash surfaced as project-map-drift.
      - run: npm ci

      - name: Strict drift check
        # Nightly is when we want to FAIL on stale SHAs in current/QA
        # docs. PR runs use the advisor mode; nightly raises the bar.
        run: scripts/release-doc-drift-check.sh --strict

  closed-beta-identity-scan-strict:
    name: 🔒 Closed-beta identity scan (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Strict identity scan
        # Closed-beta-readiness-hardening (2026-05-03). Strict mode in
        # nightly catches the v4.14.118-class hardcoded-founder-identity
        # regression before it can leak to production. PR-side runs in
        # advisor mode; nightly is the gate.
        run: scripts/closed-beta-identity-scan.sh --strict

  vi-mock-completeness:
    name: 🧪 vi.mock completeness lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Lint vi.mock factories (top-25 + JSON artifact)
        run: |
          node scripts/vi-mock-completeness-lint.mjs --top
          node scripts/vi-mock-completeness-lint.mjs --json > /tmp/vi-mock-lint.json
          echo "Top-level summary:"
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/vi-mock-lint.json','utf8')); console.log(j.summary);"

      - name: Upload lint JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vi-mock-completeness-lint-${{ github.run_id }}
          path: /tmp/vi-mock-lint.json
          retention-days: 14
