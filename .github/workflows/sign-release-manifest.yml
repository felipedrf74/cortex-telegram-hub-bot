name: Release — Sign exact candidate
run-name: Sign release candidate ${{ inputs.runtime_sha }} run ${{ inputs.candidate_run_id }} request ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: Exact candidate runtime SHA
        required: true
        type: string
      candidate_run_id:
        description: Successful RC workflow run ID for the exact runtime SHA
        required: true
        type: string
      request_id:
        description: Unique coordinator request identifier used for crash-safe run correlation
        required: true
        type: string
      contract_scope:
        description: Must match the RC candidate contract scope
        required: true
        type: choice
        options:
          - select_contract_scope
          - backend_only
          - shared_backend_ios
      ios_attestation_base64:
        description: Signed iOS compatibility attestation JSON encoded as base64 (shared releases only)
        required: false
        type: string
      ios_distribution_attestation_base64:
        description: Signed Xcode Cloud distribution attestation JSON encoded as base64 (shared releases only)
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  sign:
    if: ${{ github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNTIME_SHA: ${{ inputs.runtime_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      REQUEST_ID: ${{ inputs.request_id }}
      CONTRACT_SCOPE: ${{ inputs.contract_scope }}
      IOS_ATTESTATION_BASE64: ${{ inputs.ios_attestation_base64 }}
      IOS_DISTRIBUTION_ATTESTATION_BASE64: ${{ inputs.ios_distribution_attestation_base64 }}
    steps:
      - name: Validate workflow dispatch identity
        run: |
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "runtime_sha must be an exact lowercase Git SHA" >&2
            exit 64
          }
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "candidate_run_id must contain decimal digits only" >&2
            exit 64
          }
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || {
            echo "request_id must be a canonical lowercase UUID" >&2
            exit 64
          }
          case "$CONTRACT_SCOPE" in
            backend_only)
              [[ -z "$IOS_ATTESTATION_BASE64" && -z "$IOS_DISTRIBUTION_ATTESTATION_BASE64" ]] || {
                echo "backend_only signing must not include iOS evidence" >&2
                exit 64
              }
              ;;
            shared_backend_ios)
              [[ -n "$IOS_ATTESTATION_BASE64" && ${#IOS_ATTESTATION_BASE64} -le 32768 ]] || {
                echo "ios_attestation_base64 must be present and bounded" >&2
                exit 64
              }
              [[ "$IOS_ATTESTATION_BASE64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || {
                echo "ios_attestation_base64 is not canonical base64" >&2
                exit 64
              }
              [[ -n "$IOS_DISTRIBUTION_ATTESTATION_BASE64" && ${#IOS_DISTRIBUTION_ATTESTATION_BASE64} -le 131072 ]] || {
                echo "ios_distribution_attestation_base64 must be present and bounded" >&2
                exit 64
              }
              [[ "$IOS_DISTRIBUTION_ATTESTATION_BASE64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || {
                echo "ios_distribution_attestation_base64 is not canonical base64" >&2
                exit 64
              }
              ;;
            *)
              echo "contract_scope must be explicitly selected" >&2
              exit 64
              ;;
          esac

      - name: Check out protected main signing tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/heads/main
          path: trusted-tooling
          # The signer proves the candidate is reachable from protected main;
          # full main history is required for that ancestry check.
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact candidate as inert data
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.RUNTIME_SHA }}
          path: candidate-source
          # Policy-selected RCs bind changed tests to a qualifying nightly
          # ancestor; the signer independently verifies that ancestry.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'

      - name: Fetch exact GitHub run, job, and artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 700 trusted-input
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" > trusted-input/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/jobs?per_page=100" > trusted-input/jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?per_page=100" > trusted-input/artifacts.json

      - name: Download exact unsigned candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-v2-${{ env.RUNTIME_SHA }}
          # The RC archive strips its common `.local/release` source prefix.
          # Restore that canonical boundary for the trusted signer.
          path: candidate-artifact/.local/release
          run-id: ${{ env.CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Resolve protected-main reuse provenance request
        run: |
          mode="$(jq -r '.protectedMainShadow.mode // "invalid"' \
            candidate-artifact/.local/release/test-results.json)"
          case "$mode" in
            shadow)
              echo "NEXUS_PROTECTED_MAIN_REUSE=false" >> "$GITHUB_ENV"
              ;;
            reuse)
              run_id="$(jq -r '.protectedMainShadow.evidence.ci.runId // empty' \
                candidate-artifact/.local/release/test-results.json)"
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
                echo "reused protected-main run identity is invalid" >&2
                exit 64
              }
              echo "NEXUS_PROTECTED_MAIN_REUSE=true" >> "$GITHUB_ENV"
              echo "NEXUS_PROTECTED_MAIN_RUN_ID=$run_id" >> "$GITHUB_ENV"
              ;;
            *)
              echo "candidate protected-main evidence mode is invalid" >&2
              exit 64
              ;;
          esac
          run_id="$(jq -r '.protectedMainShadow.evidence.ci.runId // empty' \
            candidate-artifact/.local/release/test-results.json)"
          if [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "NEXUS_PROTECTED_TIMING_AVAILABLE=true" >> "$GITHUB_ENV"
            echo "NEXUS_PROTECTED_MAIN_RUN_ID=$run_id" >> "$GITHUB_ENV"
          else
            echo "NEXUS_PROTECTED_TIMING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "Exact protected-main timing is unavailable; release timing remains advisory." >&2
          fi

      - name: Fetch exact reused protected-main GitHub identity
        if: ${{ env.NEXUS_PROTECTED_TIMING_AVAILABLE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NEXUS_PROTECTED_MAIN_RUN_ID}" \
            > trusted-input/protected-main-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NEXUS_PROTECTED_MAIN_RUN_ID}/artifacts?per_page=100" \
            > trusted-input/protected-main-artifacts.json

      - name: Fetch current protected signing run and job timing
        if: ${{ env.NEXUS_PROTECTED_TIMING_AVAILABLE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > trusted-input/signing-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > trusted-input/signing-jobs.json

      - name: Resolve protected nightly evidence request
        run: |
          node trusted-tooling/scripts/trusted-release-signer.mjs nightly-request \
            --trusted-root trusted-tooling \
            --candidate-artifact candidate-artifact \
            --runtime-sha "$RUNTIME_SHA" > trusted-input/nightly-request.json
          required="$(jq -r '.required' trusted-input/nightly-request.json)"
          [[ "$required" == 'true' || "$required" == 'false' ]] || exit 64
          echo "NEXUS_NIGHTLY_EVIDENCE_REQUIRED=$required" >> "$GITHUB_ENV"
          if [[ "$required" == 'true' ]]; then
            run_id="$(jq -r '.runId' trusted-input/nightly-request.json)"
            run_attempt="$(jq -r '.runAttempt' trusted-input/nightly-request.json)"
            artifact_name="$(jq -r '.artifactName' trusted-input/nightly-request.json)"
            [[ "$run_id" =~ ^[0-9]+$ ]] || exit 64
            [[ "$run_attempt" =~ ^[0-9]+$ ]] || exit 64
            [[ "$artifact_name" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 64
            echo "NEXUS_NIGHTLY_RUN_ID=$run_id" >> "$GITHUB_ENV"
            echo "NEXUS_NIGHTLY_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          fi

      - name: Fetch exact qualifying-nightly identity and evidence
        if: ${{ env.NEXUS_NIGHTLY_EVIDENCE_REQUIRED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NEXUS_NIGHTLY_RUN_ID}" \
            > trusted-input/nightly-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NEXUS_NIGHTLY_RUN_ID}/artifacts?per_page=100" \
            > trusted-input/nightly-artifacts.json
          install -d -m 700 trusted-input/nightly-evidence
          gh run download "$NEXUS_NIGHTLY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$NEXUS_NIGHTLY_ARTIFACT_NAME" \
            --dir trusted-input/nightly-evidence

      - name: Materialize untrusted signed iOS contract evidence
        if: ${{ env.CONTRACT_SCOPE == 'shared_backend_ios' }}
        run: |
          install -d -m 700 trusted-input/ios-evidence
          printf '%s' "$IOS_ATTESTATION_BASE64" \
            | base64 --decode \
            > trusted-input/ios-evidence/ios-contract-attestation.json
          chmod 600 trusted-input/ios-evidence/ios-contract-attestation.json

      - name: Materialize untrusted signed iOS distribution evidence
        if: ${{ env.CONTRACT_SCOPE == 'shared_backend_ios' }}
        run: |
          install -d -m 700 trusted-input/ios-distribution-evidence
          printf '%s' "$IOS_DISTRIBUTION_ATTESTATION_BASE64" \
            | base64 --decode \
            > trusted-input/ios-distribution-evidence/ios-distribution-attestation.json
          chmod 600 trusted-input/ios-distribution-evidence/ios-distribution-attestation.json

      - name: Verify candidate without executing candidate code
        run: |
          contract_args=(--contract-scope "$CONTRACT_SCOPE")
          if [[ "$CONTRACT_SCOPE" == 'shared_backend_ios' ]]; then
            contract_args+=(
              --ios-evidence-root trusted-input/ios-evidence
              --ios-distribution-evidence-root trusted-input/ios-distribution-evidence
            )
          fi
          nightly_args=()
          if [[ "$NEXUS_NIGHTLY_EVIDENCE_REQUIRED" == 'true' ]]; then
            nightly_args=(
              --nightly-run-metadata trusted-input/nightly-run.json
              --nightly-artifact-metadata trusted-input/nightly-artifacts.json
              --nightly-evidence-root trusted-input/nightly-evidence
            )
          fi
          protected_timing_args=()
          if [[ "$NEXUS_PROTECTED_TIMING_AVAILABLE" == 'true' ]]; then
            protected_timing_args+=(
              --protected-main-run-metadata trusted-input/protected-main-run.json
              --signing-run-metadata trusted-input/signing-run.json
              --signing-jobs-metadata trusted-input/signing-jobs.json
            )
          fi
          if [[ "$NEXUS_PROTECTED_MAIN_REUSE" == 'true' ]]; then
            protected_timing_args+=(
              --protected-main-artifact-metadata trusted-input/protected-main-artifacts.json
            )
          fi
          node trusted-tooling/scripts/trusted-release-signer.mjs verify-candidate \
            --trusted-root trusted-tooling \
            --candidate-source candidate-source \
            --candidate-artifact candidate-artifact \
            --run-metadata trusted-input/run.json \
            --jobs-metadata trusted-input/jobs.json \
            --artifact-metadata trusted-input/artifacts.json \
            --repository "${GITHUB_REPOSITORY}" \
            --runtime-sha "$RUNTIME_SHA" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            "${contract_args[@]}" \
            "${nightly_args[@]}" \
            "${protected_timing_args[@]}"

      - name: Sign exact ReleaseManifestV2 with protected-main tooling
        env:
          NEXUS_RELEASE_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.NEXUS_RELEASE_EVIDENCE_PRIVATE_KEY_PEM }}
        run: |
          contract_args=(--contract-scope "$CONTRACT_SCOPE")
          if [[ "$CONTRACT_SCOPE" == 'shared_backend_ios' ]]; then
            contract_args+=(
              --ios-evidence-root trusted-input/ios-evidence
              --ios-distribution-evidence-root trusted-input/ios-distribution-evidence
            )
          fi
          nightly_args=()
          if [[ "$NEXUS_NIGHTLY_EVIDENCE_REQUIRED" == 'true' ]]; then
            nightly_args=(
              --nightly-run-metadata trusted-input/nightly-run.json
              --nightly-artifact-metadata trusted-input/nightly-artifacts.json
              --nightly-evidence-root trusted-input/nightly-evidence
            )
          fi
          protected_timing_args=()
          if [[ "$NEXUS_PROTECTED_TIMING_AVAILABLE" == 'true' ]]; then
            protected_timing_args+=(
              --protected-main-run-metadata trusted-input/protected-main-run.json
              --signing-run-metadata trusted-input/signing-run.json
              --signing-jobs-metadata trusted-input/signing-jobs.json
            )
          fi
          if [[ "$NEXUS_PROTECTED_MAIN_REUSE" == 'true' ]]; then
            protected_timing_args+=(
              --protected-main-artifact-metadata trusted-input/protected-main-artifacts.json
            )
          fi
          node trusted-tooling/scripts/trusted-release-signer.mjs sign-manifest \
            --trusted-root trusted-tooling \
            --candidate-source candidate-source \
            --candidate-artifact candidate-artifact \
            --run-metadata trusted-input/run.json \
            --jobs-metadata trusted-input/jobs.json \
            --artifact-metadata trusted-input/artifacts.json \
            --repository "${GITHUB_REPOSITORY}" \
            --runtime-sha "$RUNTIME_SHA" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            "${contract_args[@]}" \
            "${nightly_args[@]}" \
            "${protected_timing_args[@]}" \
            --output-root signed-artifact

      - name: Upload signed immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-v2-${{ env.RUNTIME_SHA }}
          path: signed-artifact/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
