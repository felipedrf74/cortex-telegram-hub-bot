name: 📝 Update Changelog

on:
  # Changelog generation is a release-preparation action. Running this on
  # every push created abandoned automation branches and obscured runtime CI.
  workflow_dispatch:

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install git-cliff
        uses: taiki-e/install-action@e1c4cd42111751368541a7cb5db3522bd1f846a4 # v2
        with:
          tool: git-cliff

      - name: Generate Changelog
        run: git-cliff --output CHANGELOG.md

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet CHANGELOG.md 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create release-preparation PR
        if: steps.check.outputs.changed == 'true'
        run: |
          BRANCH="chore/release-changelog-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: update changelog [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "docs: update CHANGELOG.md" \
            --body "Auto-generated changelog update via git-cliff." \
            --base main \
            --head "$BRANCH" \
            --label "documentation" || {
              echo "::warning::Changelog branch pushed to $BRANCH, but this repository does not allow GitHub Actions to create pull requests."
              echo "::warning::Create the pull request manually from https://github.com/${{ github.repository }}/pull/new/$BRANCH"
            }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
