name: Release — Sign staging attestation
run-name: Sign ${{ inputs.evidence_kind }} ${{ inputs.request_id }} digest ${{ inputs.request_sha256 }}

on:
  workflow_dispatch:
    inputs:
      evidence_kind:
        description: Protected operational evidence type
        required: true
        default: staging_attestation
        type: choice
        options:
          - staging_attestation
          - rollback_drill_staging
          - rollback_drill
          - protected_main_reuse_activation
          - release_quality
      request_id:
        description: Unique operational evidence request identifier
        required: true
        type: string
      runtime_sha:
        description: Exact reviewed runtime SHA
        required: true
        type: string
      request_b64:
        description: Base64 encoded non-secret operational evidence request
        required: true
        type: string
      request_sha256:
        description: Exact raw request digest
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  sign:
    if: ${{ github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out protected main signing tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: trusted-tooling
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'

      - name: Validate protected operational request identity
        env:
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
          REQUEST_B64: ${{ inputs.request_b64 }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || {
            echo "request_id must be a canonical lowercase UUID" >&2
            exit 64
          }
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "runtime_sha must be an exact lowercase Git SHA" >&2
            exit 64
          }
          [[ -n "$REQUEST_B64" && ${#REQUEST_B64} -le 60000 ]] || {
            echo "request_b64 must be present and bounded" >&2
            exit 64
          }
          [[ "$REQUEST_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || {
            echo "request_b64 is not canonical base64" >&2
            exit 64
          }
          [[ "$REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "request_sha256 must be an exact lowercase SHA-256" >&2
            exit 64
          }
          node - <<'NODE'
          const crypto = require('crypto');
          const input = process.env.REQUEST_B64 ?? '';
          const decoded = Buffer.from(input, 'base64');
          if (decoded.toString('base64') !== input) {
            throw new Error('request_b64 is not canonical base64');
          }
          if (crypto.createHash('sha256').update(decoded).digest('hex') !== process.env.REQUEST_SHA256) {
            throw new Error('decoded request bytes do not match request_sha256');
          }
          NODE
          case "$EVIDENCE_KIND" in
            staging_attestation|rollback_drill_staging|rollback_drill|protected_main_reuse_activation|release_quality) ;;
            *)
              echo "unsupported operational evidence kind" >&2
              exit 64
              ;;
          esac

      - name: Decode and validate staging request
        if: ${{ inputs.evidence_kind == 'staging_attestation' }}
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          git -C trusted-tooling cat-file -e "${RUNTIME_SHA}^{commit}"
          git -C trusted-tooling merge-base --is-ancestor "$RUNTIME_SHA" HEAD
          install -d -m 700 .local/release/staging
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const request = Buffer.from(process.env.REQUEST_B64, 'base64');
          const parsed = JSON.parse(request);
          if (parsed.requestId !== process.env.REQUEST_ID) throw new Error('request id mismatch');
          if (crypto.createHash('sha256').update(request).digest('hex') !== process.env.REQUEST_SHA256) {
            throw new Error('staging request digest mismatch');
          }
          fs.writeFileSync('.local/release/staging/request.json', request, { mode: 0o600 });
          NODE
          node trusted-tooling/scripts/release-staging-attestation.mjs validate-request \
            --root "$GITHUB_WORKSPACE" \
            --request .local/release/staging/request.json \
            --expect-runtime-sha "$RUNTIME_SHA"

      - name: Decode and validate non-promotable rollback-drill staging request
        if: ${{ inputs.evidence_kind == 'rollback_drill_staging' }}
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          DRILL_PUBLIC_KEY=trusted-tooling/docs/release/evidence/rollback-drill-staging-public-key.pem
          [[ -f "$DRILL_PUBLIC_KEY" && ! -L "$DRILL_PUBLIC_KEY" ]] || {
            echo "reviewed rollback-drill staging public key is not committed" >&2
            exit 77
          }
          git -C trusted-tooling cat-file -e "${RUNTIME_SHA}^{commit}"
          git -C trusted-tooling merge-base --is-ancestor "$RUNTIME_SHA" HEAD
          install -d -m 700 .local/release/rollback-drill-staging
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const request = Buffer.from(process.env.REQUEST_B64, 'base64');
          const parsed = JSON.parse(request);
          if (parsed.requestId !== process.env.REQUEST_ID) throw new Error('request id mismatch');
          if (crypto.createHash('sha256').update(request).digest('hex') !== process.env.REQUEST_SHA256) {
            throw new Error('rollback-drill staging request digest mismatch');
          }
          fs.writeFileSync(
            '.local/release/rollback-drill-staging/request.json',
            request,
            { mode: 0o600 },
          );
          NODE
          node trusted-tooling/scripts/rollback-drill-staging-attestation.mjs validate-request \
            --root "$GITHUB_WORKSPACE" \
            --request .local/release/rollback-drill-staging/request.json \
            --expect-runtime-sha "$RUNTIME_SHA"

      - name: Fetch and validate exact production-signed source manifest for rollback drill
        if: ${{ inputs.evidence_kind == 'rollback_drill_staging' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          manifest_run_id="$(
            node -e 'process.stdout.write(require("./.local/release/rollback-drill-staging/request.json").manifestSigningRunId)'
          )"
          [[ "$manifest_run_id" =~ ^[1-9][0-9]*$ ]] || exit 64
          gh run view "$manifest_run_id" \
            --json databaseId,headSha,headBranch,event,status,conclusion,workflowName \
            > .local/release/rollback-drill-staging/manifest-run.json
          node - "$manifest_run_id" "$RUNTIME_SHA" <<'NODE'
          const fs=require('fs');
          const [id,sha]=process.argv.slice(2);
          const run=JSON.parse(fs.readFileSync(
            '.local/release/rollback-drill-staging/manifest-run.json',
            'utf8',
          ));
          if(String(run.databaseId)!==id||run.headSha!==sha||run.headBranch!=='main'
            ||run.event!=='workflow_dispatch'||run.status!=='completed'
            ||run.conclusion!=='success'||run.workflowName!=='Release — Sign exact candidate'){
            throw new Error('source release-manifest signing run identity is invalid');
          }
          NODE
          install -d -m 700 .local/release/rollback-drill-staging/source
          gh run download "$manifest_run_id" \
            --name "release-manifest-v2-$RUNTIME_SHA" \
            --dir .local/release/rollback-drill-staging/source
          manifest="$(
            find .local/release/rollback-drill-staging/source -type f \
              -path "*/.local/release/manifests/$RUNTIME_SHA.json" -print
          )"
          [[ "$(printf '%s\n' "$manifest" | sed '/^$/d' | wc -l | tr -d ' ')" == 1 ]] || {
            echo "source release manifest is missing or ambiguous" >&2
            exit 1
          }
          marker="$(
            find .local/release/rollback-drill-staging/source -type f \
              -path "*/.local/release/bundles/$RUNTIME_SHA/*/.complete.json" -print
          )"
          [[ "$(printf '%s\n' "$marker" | sed '/^$/d' | wc -l | tr -d ' ')" == 1 ]] || {
            echo "source release bundle is missing or ambiguous" >&2
            exit 1
          }
          bundle="$(dirname "$marker")"
          node trusted-tooling/scripts/release-manifest-v2.mjs validate \
            --manifest "$manifest" \
            --root "$bundle" \
            --verify-bundle \
            --public-key trusted-tooling/docs/release/evidence/release-evidence-public-key.pem \
            --expect-runtime-sha "$RUNTIME_SHA"
          node trusted-tooling/scripts/rollback-drill-staging-attestation.mjs validate-inputs \
            --root "$GITHUB_WORKSPACE" \
            --request .local/release/rollback-drill-staging/request.json \
            --manifest "$manifest" \
            --production-public-key trusted-tooling/docs/release/evidence/release-evidence-public-key.pem \
            --expect-runtime-sha "$RUNTIME_SHA"
          printf '%s' "$manifest" > .local/release/rollback-drill-staging/source-manifest-path

      - name: Fetch independent current staging-signing run provenance
        if: ${{ inputs.evidence_kind == 'staging_attestation' || inputs.evidence_kind == 'rollback_drill_staging' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 700 trusted-input
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > trusted-input/staging-signing-run.json

      - name: Decode and validate rollback drill request
        if: ${{ inputs.evidence_kind == 'rollback_drill' }}
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          git -C trusted-tooling cat-file -e "${RUNTIME_SHA}^{commit}"
          git -C trusted-tooling merge-base --is-ancestor "$RUNTIME_SHA" HEAD
          install -d -m 700 .local/release/rollback-drill
          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const request = Buffer.from(process.env.REQUEST_B64, 'base64');
          const digest = crypto.createHash('sha256').update(request).digest('hex');
          if (digest !== process.env.REQUEST_SHA256) throw new Error('rollback request digest mismatch');
          const parsed = JSON.parse(request);
          if (parsed.targetSha !== process.env.RUNTIME_SHA) throw new Error('rollback target SHA mismatch');
          fs.writeFileSync('.local/release/rollback-drill/request.json', request, { mode: 0o600 });
          NODE
          node trusted-tooling/scripts/rollback-drill-check.mjs validate-payload \
            --root "$GITHUB_WORKSPACE" \
            --evidence .local/release/rollback-drill/request.json \
            --expect-sha "$RUNTIME_SHA" \
            --release-gate \
            --max-age-days 30 \
            --json

      - name: Decode and validate ServerDominguez reuse activation request
        if: ${{ inputs.evidence_kind == 'protected_main_reuse_activation' }}
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          SERVER_PROVENANCE_PUBLIC_KEY_PEM: ${{ secrets.NEXUS_SERVERDOMINGUEZ_PROVENANCE_PUBLIC_KEY_PEM }}
        run: |
          [[ -n "$SERVER_PROVENANCE_PUBLIC_KEY_PEM" ]] || {
            echo "protected ServerDominguez provenance public key is not configured" >&2
            exit 77
          }
          install -d -m 700 .local/release/protected-main-reuse trusted-input
          printf '%s' "$SERVER_PROVENANCE_PUBLIC_KEY_PEM" \
            > trusted-input/serverdominguez-provenance-public-key.pem
          chmod 600 trusted-input/serverdominguez-provenance-public-key.pem
          printf '%s' "$REQUEST_B64" | base64 --decode \
            > .local/release/protected-main-reuse/server-request.json
          chmod 600 .local/release/protected-main-reuse/server-request.json
          actual_sha="$(sha256sum .local/release/protected-main-reuse/server-request.json | cut -d' ' -f1)"
          [[ "$actual_sha" == "$REQUEST_SHA256" ]] || {
            echo "ServerDominguez activation request digest mismatch" >&2
            exit 64
          }
          node trusted-tooling/scripts/protected-main-reuse-activation.mjs \
            validate-server-request \
            --source-root trusted-tooling \
            --request .local/release/protected-main-reuse/server-request.json \
            --server-public-key trusted-input/serverdominguez-provenance-public-key.pem \
            > .local/release/protected-main-reuse/validated-request.json
          node - <<'NODE'
          const request = require('./.local/release/protected-main-reuse/validated-request.json');
          if (request.requestId !== process.env.REQUEST_ID) throw new Error('request id mismatch');
          if (request.entries.at(-1)?.runtimeSha !== process.env.RUNTIME_SHA) {
            throw new Error('activation runtime SHA must be the fifth production comparison');
          }
          NODE

      - name: Fetch independent protected GitHub provenance for reuse activation
        if: ${{ inputs.evidence_kind == 'protected_main_reuse_activation' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 700 trusted-input/protected-main-reuse-github
          jq -r '.entries[] | [.runtimeSha, .mainCi.runId, .releaseCi.runId] | @tsv' \
            .local/release/protected-main-reuse/validated-request.json \
            > trusted-input/protected-main-reuse-github/runs.tsv
          index=0
          while IFS=$'\t' read -r runtime_sha main_run_id release_run_id; do
            entry="trusted-input/protected-main-reuse-github/$index"
            install -d -m 700 "$entry"
            printf '%s' "$runtime_sha" > "$entry/runtime-sha"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$main_run_id" > "$entry/main-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$main_run_id/artifacts?per_page=100" \
              > "$entry/main-artifacts.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_run_id" > "$entry/release-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_run_id/artifacts?per_page=100" \
              > "$entry/release-artifacts.json"
            index=$((index + 1))
          done < trusted-input/protected-main-reuse-github/runs.tsv
          [[ "$index" -eq 5 ]] || exit 64
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const base = 'trusted-input/protected-main-reuse-github';
          const entries = Array.from({ length: 5 }, (_, index) => {
            const directory = path.join(base, String(index));
            return {
              runtimeSha: fs.readFileSync(path.join(directory, 'runtime-sha'), 'utf8'),
              main: {
                run: JSON.parse(fs.readFileSync(path.join(directory, 'main-run.json'))),
                artifacts: JSON.parse(fs.readFileSync(path.join(directory, 'main-artifacts.json'))),
              },
              release: {
                run: JSON.parse(fs.readFileSync(path.join(directory, 'release-run.json'))),
                artifacts: JSON.parse(fs.readFileSync(path.join(directory, 'release-artifacts.json'))),
              },
            };
          });
          fs.writeFileSync(
            '.local/release/protected-main-reuse/github-provenance.json',
            `${JSON.stringify({
              schema: 'nexus.protected-main-reuse-github-provenance.v1',
              repository: process.env.GITHUB_REPOSITORY,
              entries,
            }, null, 2)}\n`,
            { mode: 0o600 },
          );
          NODE

      - name: Decode and validate ServerDominguez release quality request
        if: ${{ inputs.evidence_kind == 'release_quality' }}
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          SERVER_PROVENANCE_PUBLIC_KEY_PEM: ${{ secrets.NEXUS_SERVERDOMINGUEZ_PROVENANCE_PUBLIC_KEY_PEM }}
        run: |
          [[ -n "$SERVER_PROVENANCE_PUBLIC_KEY_PEM" ]] || {
            echo "protected ServerDominguez provenance public key is not configured" >&2
            exit 77
          }
          git -C trusted-tooling cat-file -e "${RUNTIME_SHA}^{commit}"
          git -C trusted-tooling merge-base --is-ancestor "$RUNTIME_SHA" HEAD
          install -d -m 700 .local/release/quality trusted-input
          printf '%s' "$SERVER_PROVENANCE_PUBLIC_KEY_PEM" \
            > trusted-input/serverdominguez-provenance-public-key.pem
          chmod 600 trusted-input/serverdominguez-provenance-public-key.pem
          printf '%s' "$REQUEST_B64" | base64 --decode \
            > .local/release/quality/server-request.json
          chmod 600 .local/release/quality/server-request.json
          actual_sha="$(sha256sum .local/release/quality/server-request.json | cut -d' ' -f1)"
          [[ "$actual_sha" == "$REQUEST_SHA256" ]] || {
            echo "ServerDominguez release quality request digest mismatch" >&2
            exit 64
          }
          node trusted-tooling/scripts/release-quality-evidence.mjs \
            validate-server-request \
            --source-root trusted-tooling \
            --request .local/release/quality/server-request.json \
            --server-public-key trusted-input/serverdominguez-provenance-public-key.pem \
            --expect-runtime-sha "$RUNTIME_SHA" \
            > .local/release/quality/validated-request.json
          node - <<'NODE'
          const request = require('./.local/release/quality/validated-request.json');
          if (request.requestId !== process.env.REQUEST_ID) throw new Error('request id mismatch');
          NODE

      - name: Refuse release quality collection while release workflows are active
        if: ${{ inputs.evidence_kind == 'release_quality' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          snapshots=()
          for status in queued in_progress requested waiting pending; do
            file=".local/release/quality/actions-${status}.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=${status}&per_page=100" \
              > "$file"
            snapshots+=(--actions-snapshot "$file")
          done
          node trusted-tooling/scripts/release-quality-evidence.mjs assert-actions-idle \
            --current-run-id "$CURRENT_RUN_ID" \
            "${snapshots[@]}"

      - name: Sign protected operational evidence
        env:
          SIGNING_PRIVATE_KEY_PEM: ${{ inputs.evidence_kind != 'rollback_drill_staging' && secrets.NEXUS_RELEASE_EVIDENCE_PRIVATE_KEY_PEM || '' }}
          ROLLBACK_DRILL_STAGING_PRIVATE_KEY_PEM: ${{ inputs.evidence_kind == 'rollback_drill_staging' && secrets.NEXUS_ROLLBACK_DRILL_STAGING_PRIVATE_KEY_PEM || '' }}
          NEXUS_SENTRY_QUALITY_READ_TOKEN: ${{ inputs.evidence_kind == 'release_quality' && secrets.NEXUS_SENTRY_QUALITY_READ_TOKEN || '' }}
          NEXUS_SENTRY_ORGANIZATION: ${{ inputs.evidence_kind == 'release_quality' && vars.NEXUS_SENTRY_ORGANIZATION || '' }}
          NEXUS_SENTRY_PROJECT_IDS: ${{ inputs.evidence_kind == 'release_quality' && vars.NEXUS_SENTRY_PROJECT_IDS || '' }}
          NEXUS_SENTRY_API_BASE_URL: ${{ inputs.evidence_kind == 'release_quality' && vars.NEXUS_SENTRY_API_BASE_URL || '' }}
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          case "$EVIDENCE_KIND" in
            staging_attestation)
              NEXUS_RELEASE_MANIFEST_PRIVATE_KEY_PEM="$SIGNING_PRIVATE_KEY_PEM" \
              NEXUS_RELEASE_MANIFEST_KEY_ID=github-environment-release-signing-2026-07 \
                node trusted-tooling/scripts/release-staging-attestation.mjs sign \
                  --root "$GITHUB_WORKSPACE" \
                  --request .local/release/staging/request.json \
                  --signing-run-metadata trusted-input/staging-signing-run.json \
                  --output .local/release/staging/staging-attestation.json \
                  --expect-runtime-sha "$RUNTIME_SHA"
              ;;
            rollback_drill_staging)
              [[ -n "$ROLLBACK_DRILL_STAGING_PRIVATE_KEY_PEM" ]] || {
                echo "protected rollback-drill staging private key is not configured" >&2
                exit 77
              }
              NEXUS_ROLLBACK_DRILL_STAGING_PRIVATE_KEY_PEM="$ROLLBACK_DRILL_STAGING_PRIVATE_KEY_PEM" \
                node trusted-tooling/scripts/rollback-drill-staging-attestation.mjs sign \
                  --root "$GITHUB_WORKSPACE" \
                  --request .local/release/rollback-drill-staging/request.json \
                  --manifest "$(< .local/release/rollback-drill-staging/source-manifest-path)" \
                  --signing-run-metadata trusted-input/staging-signing-run.json \
                  --output-dir .local/release/rollback-drill-staging/signed \
                  --drill-public-key trusted-tooling/docs/release/evidence/rollback-drill-staging-public-key.pem \
                  --production-public-key trusted-tooling/docs/release/evidence/release-evidence-public-key.pem \
                  --expect-runtime-sha "$RUNTIME_SHA"
              ;;
            rollback_drill)
              NEXUS_RELEASE_EVIDENCE_PRIVATE_KEY_PEM="$SIGNING_PRIVATE_KEY_PEM" \
              NEXUS_RELEASE_EVIDENCE_KEY_ID=github-environment-release-signing-2026-07 \
                node trusted-tooling/scripts/rollback-drill-check.mjs sign \
                  --root "$GITHUB_WORKSPACE" \
                  --evidence .local/release/rollback-drill/request.json \
                  --output .local/release/rollback-drill/rollback-drill.json \
                  --expect-sha "$RUNTIME_SHA" \
                  --release-gate \
                  --max-age-days 30 \
                --json
              ;;
            protected_main_reuse_activation)
              NEXUS_RELEASE_EVIDENCE_PRIVATE_KEY_PEM="$SIGNING_PRIVATE_KEY_PEM" \
                node trusted-tooling/scripts/protected-main-reuse-activation.mjs issue \
                  --source-root trusted-tooling \
                  --request .local/release/protected-main-reuse/server-request.json \
                  --server-public-key trusted-input/serverdominguez-provenance-public-key.pem \
                  --github-evidence .local/release/protected-main-reuse/github-provenance.json \
                  --repository "$GITHUB_REPOSITORY" \
                  --output .local/release/protected-main-reuse/activation.json
              ;;
            release_quality)
              NEXUS_RELEASE_EVIDENCE_PRIVATE_KEY_PEM="$SIGNING_PRIVATE_KEY_PEM" \
                node trusted-tooling/scripts/release-quality-evidence.mjs collect-and-sign \
                  --source-root trusted-tooling \
                  --request .local/release/quality/server-request.json \
                  --server-public-key trusted-input/serverdominguez-provenance-public-key.pem \
                  --expect-runtime-sha "$RUNTIME_SHA" \
                  --output .local/release/quality/release-quality.json
              ;;
            *)
              echo "unsupported operational evidence kind" >&2
              exit 64
              ;;
          esac

      - name: Validate signed staging attestation
        if: ${{ inputs.evidence_kind == 'staging_attestation' }}
        env:
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          node trusted-tooling/scripts/release-staging-attestation.mjs validate-signed \
            --root "$GITHUB_WORKSPACE" \
            --attestation .local/release/staging/staging-attestation.json \
            --public-key trusted-tooling/docs/release/evidence/release-evidence-public-key.pem \
            --expect-runtime-sha "$RUNTIME_SHA"

      - name: Validate signed non-promotable rollback-drill staging attestation
        if: ${{ inputs.evidence_kind == 'rollback_drill_staging' }}
        env:
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          node trusted-tooling/scripts/rollback-drill-staging-attestation.mjs validate \
            --root "$GITHUB_WORKSPACE" \
            --bundle .local/release/rollback-drill-staging/signed \
            --request .local/release/rollback-drill-staging/request.json \
            --source-manifest "$(< .local/release/rollback-drill-staging/source-manifest-path)" \
            --drill-public-key trusted-tooling/docs/release/evidence/rollback-drill-staging-public-key.pem \
            --production-public-key trusted-tooling/docs/release/evidence/release-evidence-public-key.pem \
            --expect-runtime-sha "$RUNTIME_SHA"

      - name: Validate signed rollback drill
        if: ${{ inputs.evidence_kind == 'rollback_drill' }}
        env:
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          node trusted-tooling/scripts/rollback-drill-check.mjs validate \
            --root "$GITHUB_WORKSPACE" \
            --evidence .local/release/rollback-drill/rollback-drill.json \
            --public-key trusted-tooling/docs/release/evidence/release-evidence-public-key.pem \
            --expect-sha "$RUNTIME_SHA" \
            --release-gate \
            --max-age-days 30 \
            --json

      - name: Validate signed protected-main reuse activation
        if: ${{ inputs.evidence_kind == 'protected_main_reuse_activation' }}
        run: |
          node trusted-tooling/scripts/protected-main-reuse-activation.mjs \
            validate-activation \
            --source-root trusted-tooling \
            --activation .local/release/protected-main-reuse/activation.json \
            --release-public-key trusted-tooling/docs/release/evidence/release-evidence-public-key.pem \
            --repository "$GITHUB_REPOSITORY"

      - name: Recheck release workflow isolation after Sentry collection
        if: ${{ inputs.evidence_kind == 'release_quality' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          snapshots=()
          for status in queued in_progress requested waiting pending; do
            file=".local/release/quality/actions-${status}-after.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=${status}&per_page=100" \
              > "$file"
            snapshots+=(--actions-snapshot "$file")
          done
          node trusted-tooling/scripts/release-quality-evidence.mjs assert-actions-idle \
            --current-run-id "$CURRENT_RUN_ID" \
            "${snapshots[@]}"
          node trusted-tooling/scripts/release-quality-evidence.mjs validate-evidence \
            --source-root trusted-tooling \
            --request .local/release/quality/server-request.json \
            --server-public-key trusted-input/serverdominguez-provenance-public-key.pem \
            --evidence .local/release/quality/release-quality.json \
            --release-public-key trusted-tooling/docs/release/evidence/release-evidence-public-key.pem \
            --expect-runtime-sha "$RUNTIME_SHA"

      - name: Upload signed staging attestation
        if: ${{ inputs.evidence_kind == 'staging_attestation' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-attestation-${{ inputs.request_id }}
          path: .local/release/staging/staging-attestation.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload signed non-promotable rollback-drill staging bundle
        if: ${{ inputs.evidence_kind == 'rollback_drill_staging' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-drill-staging-bundle-${{ inputs.request_id }}
          path: .local/release/rollback-drill-staging/signed
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload signed rollback drill
        if: ${{ inputs.evidence_kind == 'rollback_drill' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-drill-${{ inputs.request_id }}
          path: .local/release/rollback-drill/rollback-drill.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Upload signed protected-main reuse activation
        if: ${{ inputs.evidence_kind == 'protected_main_reuse_activation' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-main-reuse-activation-${{ inputs.request_id }}
          path: .local/release/protected-main-reuse/activation.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Upload signed release quality evidence
        if: ${{ inputs.evidence_kind == 'release_quality' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-quality-${{ inputs.request_id }}
          path: .local/release/quality/release-quality.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
