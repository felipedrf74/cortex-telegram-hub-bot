name: Release — Sign staging attestation
run-name: Sign staging attestation ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique staging request identifier
        required: true
        type: string
      runtime_sha:
        description: Exact reviewed runtime SHA
        required: true
        type: string
      request_b64:
        description: Base64 encoded non-secret staging attestation request
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    if: ${{ github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out protected main signing tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/heads/main
          path: trusted-tooling
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'

      - name: Decode and validate staging request
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          install -d -m 700 .local/release/staging
          node - <<'NODE'
          const fs = require('fs');
          const request = Buffer.from(process.env.REQUEST_B64, 'base64');
          const parsed = JSON.parse(request);
          if (parsed.requestId !== process.env.REQUEST_ID) throw new Error('request id mismatch');
          fs.writeFileSync('.local/release/staging/request.json', request, { mode: 0o600 });
          NODE
          node trusted-tooling/scripts/release-staging-attestation.mjs validate-request \
            --root "$GITHUB_WORKSPACE" \
            --request .local/release/staging/request.json \
            --expect-runtime-sha "$RUNTIME_SHA"

      - name: Sign detached staging attestation
        env:
          NEXUS_RELEASE_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.NEXUS_RELEASE_EVIDENCE_PRIVATE_KEY_PEM }}
          NEXUS_RELEASE_MANIFEST_KEY_ID: github-environment-release-signing-2026-07
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          node trusted-tooling/scripts/release-staging-attestation.mjs sign \
            --root "$GITHUB_WORKSPACE" \
            --request .local/release/staging/request.json \
            --output .local/release/staging/staging-attestation.json \
            --expect-runtime-sha "$RUNTIME_SHA"

      - name: Validate signed staging attestation
        env:
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          node trusted-tooling/scripts/release-staging-attestation.mjs validate-signed \
            --root "$GITHUB_WORKSPACE" \
            --attestation .local/release/staging/staging-attestation.json \
            --public-key trusted-tooling/docs/release/evidence/release-evidence-public-key.pem \
            --expect-runtime-sha "$RUNTIME_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-attestation-${{ inputs.request_id }}
          path: .local/release/staging/staging-attestation.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
