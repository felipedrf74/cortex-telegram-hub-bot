name: 🏷️ Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      changelog:
        description: 'Release notes (what changed)'
        required: true
        type: string

jobs:
  release:
    name: Create Release ${{ github.event.inputs.bump }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          
          IFS='.' read -ra PARTS <<< "$CURRENT"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}
          
          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "old=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "tag=v${NEW}" >> $GITHUB_OUTPUT
          
          # Update package.json
          npm version "$NEW" --no-git-tag-version
          echo "📦 Version: $CURRENT → $NEW"

      - name: Update CHANGELOG.md
        run: |
          DATE=$(date +%Y-%m-%d)
          VERSION="${{ steps.bump.outputs.new }}"
          NOTES="${{ github.event.inputs.changelog }}"
          
          # Prepend new entry to CHANGELOG
          {
            head -3 CHANGELOG.md
            echo ""
            echo "## [${VERSION}] — ${DATE}"
            echo ""
            echo "${NOTES}"
            echo ""
            echo "---"
            echo ""
            tail -n +4 CHANGELOG.md
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit & Tag
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "release: ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          body: |
            ## What's Changed
            
            ${{ github.event.inputs.changelog }}
            
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.bump.outputs.old }}...${{ steps.bump.outputs.tag }}
          draft: false
          prerelease: false

      - name: Update Notion release log
        if: env.NOTION_TOKEN != ''
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_RELEASES_DB: ${{ secrets.NOTION_RELEASES_DB }}
        run: |
          curl -s -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            -d "{
              \"parent\": { \"database_id\": \"$NOTION_RELEASES_DB\" },
              \"properties\": {
                \"Release\": { \"title\": [{ \"text\": { \"content\": \"${{ steps.bump.outputs.tag }}\" } }] },
                \"Status\": { \"select\": { \"name\": \"✅ Released\" } },
                \"Type\": { \"select\": { \"name\": \"Release\" } },
                \"Date\": { \"date\": { \"start\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" } },
                \"Notes\": { \"rich_text\": [{ \"text\": { \"content\": \"${{ github.event.inputs.changelog }}\" } }] }
              }
            }" || echo "⚠️  Notion update skipped"
