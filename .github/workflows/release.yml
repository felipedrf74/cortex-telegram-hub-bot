name: 🏷️ Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-prepared package version to tag, for example 4.14.206 or v4.14.206'
        required: true
        type: string
      changelog:
        description: 'Release notes (what changed)'
        required: true
        type: string

jobs:
  release:
    name: Create Release ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_RELEASES_DB: ${{ secrets.NOTION_RELEASES_DB }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate prepared release version
        id: release
        run: |
          EXPECTED="${{ github.event.inputs.version }}"
          EXPECTED="${EXPECTED#v}"
          CURRENT=$(node -p "require('./package.json').version")

          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "package.json version ($CURRENT) does not match requested release ($EXPECTED)." >&2
            echo "Run scripts/release-prep.sh before staging, then tag the exact promoted commit." >&2
            exit 1
          fi

          TAG="v$CURRENT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite release history." >&2
            exit 1
          fi

          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "📦 Prepared release: $TAG at $GITHUB_SHA"

      - name: Tag prepared commit
        run: |
          git tag -a "${{ steps.release.outputs.tag }}" -m "Release ${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body: |
            ## What's Changed
            
            ${{ github.event.inputs.changelog }}
            
            Commit: `${{ github.sha }}`
          draft: false
          prerelease: false

      - name: Update Notion release log
        if: ${{ env.NOTION_TOKEN != '' }}
        run: |
          curl -s -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            -d "{
              \"parent\": { \"database_id\": \"$NOTION_RELEASES_DB\" },
              \"properties\": {
                \"Release\": { \"title\": [{ \"text\": { \"content\": \"${{ steps.release.outputs.tag }}\" } }] },
                \"Status\": { \"select\": { \"name\": \"✅ Released\" } },
                \"Type\": { \"select\": { \"name\": \"Release\" } },
                \"Environment\": { \"select\": { \"name\": \"Production\" } },
                \"Date\": { \"date\": { \"start\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" } },
                \"Commit\": { \"rich_text\": [{ \"text\": { \"content\": \"${GITHUB_SHA:0:8}\" } }] },
                \"Author\": { \"rich_text\": [{ \"text\": { \"content\": \"$GITHUB_ACTOR\" } }] },
                \"Notes\": { \"rich_text\": [{ \"text\": { \"content\": \"${{ github.event.inputs.changelog }}\" } }] }
              }
            }" && echo "✅ Notion release logged" || echo "⚠️  Notion update failed"
