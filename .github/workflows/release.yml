name: 🏷️ Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-prepared package version to tag, for example 4.14.206 or v4.14.206'
        required: true
        type: string
      changelog:
        description: 'Release notes (what changed)'
        required: true
        type: string
      runtime_sha:
        description: 'Exact 40-character production runtime SHA from the terminal promotion journal'
        required: true
        type: string
      artifact_digest:
        description: 'Exact production artifact digest from the terminal promotion journal'
        required: true
        type: string
      promotion_transaction_id:
        description: 'Exact root-owned production promotion transaction ID'
        required: true
        type: string
      promotion_evidence_sha256:
        description: 'SHA-256 of the downloaded terminal promotion evidence'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Create Release ${{ github.event.inputs.version }}
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_RELEASES_DB: ${{ secrets.NOTION_RELEASES_DB }}
      RELEASE_VERSION_INPUT: ${{ inputs.version }}
      RELEASE_CHANGELOG_INPUT: ${{ inputs.changelog }}
      PROMOTED_RUNTIME_SHA_INPUT: ${{ inputs.runtime_sha }}
      PROMOTED_ARTIFACT_DIGEST_INPUT: ${{ inputs.artifact_digest }}
      PROMOTION_TRANSACTION_ID_INPUT: ${{ inputs.promotion_transaction_id }}
      PROMOTION_EVIDENCE_SHA256_INPUT: ${{ inputs.promotion_evidence_sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.runtime_sha }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate prepared release version
        id: release
        run: |
          EXPECTED="$RELEASE_VERSION_INPUT"
          EXPECTED="${EXPECTED#v}"
          RUNTIME_SHA="$PROMOTED_RUNTIME_SHA_INPUT"
          ARTIFACT_DIGEST="$PROMOTED_ARTIFACT_DIGEST_INPUT"
          TRANSACTION_ID="$PROMOTION_TRANSACTION_ID_INPUT"
          EVIDENCE_SHA256="$PROMOTION_EVIDENCE_SHA256_INPUT"
          [[ "$RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Promoted runtime SHA is invalid." >&2
            exit 64
          }
          [[ "$TRANSACTION_ID" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+-[a-f0-9]{12}$ ]] || {
            echo "Promotion transaction ID is invalid." >&2
            exit 64
          }
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Promoted artifact digest is invalid." >&2
            exit 64
          }
          [[ "$EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Promotion evidence digest is invalid." >&2
            exit 64
          }
          [ "$(git rev-parse HEAD)" = "$RUNTIME_SHA" ] || {
            echo "Checked-out commit is not the exact promoted runtime." >&2
            exit 1
          }
          CURRENT="$(jq -er '.version | select(type == "string" and length > 0)' package.json)"
          [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Prepared package version is not safe to tag." >&2
            exit 64
          }

          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "package.json version ($CURRENT) does not match requested release ($EXPECTED)." >&2
            echo "Run scripts/release-prep.sh before staging, then tag the exact promoted commit." >&2
            exit 1
          fi

          TAG="v$CURRENT"
          set +e
          remote_tag_refs="$(git ls-remote --exit-code --tags origin \
            "refs/tags/$TAG" "refs/tags/$TAG^{}" 2>/dev/null)"
          remote_tag_status=$?
          set -e
          if [ "$remote_tag_status" -eq 0 ]; then
            remote_tag_target="$(printf '%s\n' "$remote_tag_refs" \
              | awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}')"
            if [ -z "$remote_tag_target" ]; then
              remote_tag_target="$(printf '%s\n' "$remote_tag_refs" \
                | awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}')"
            fi
            if [ "$remote_tag_target" != "$RUNTIME_SHA" ]; then
              echo "Tag $TAG already exists at another commit; refusing to overwrite release history." >&2
              exit 1
            fi
            tag_exists=true
          elif [ "$remote_tag_status" -ne 2 ]; then
            echo "Remote tag existence could not be verified." >&2
            exit 1
          else
            tag_exists=false
          fi

          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "runtime_sha=$RUNTIME_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
          echo "transaction_id=$TRANSACTION_ID" >> "$GITHUB_OUTPUT"
          echo "evidence_sha256=$EVIDENCE_SHA256" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "📦 Prepared release: $TAG at $RUNTIME_SHA"

      - name: Tag prepared commit
        if: ${{ steps.release.outputs.tag_exists != 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PROMOTED_RUNTIME_SHA: ${{ steps.release.outputs.runtime_sha }}
        run: |
          git tag -a "$RELEASE_TAG" "$PROMOTED_RUNTIME_SHA" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Write exact release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PROMOTED_RUNTIME_SHA: ${{ steps.release.outputs.runtime_sha }}
          PROMOTED_ARTIFACT_DIGEST: ${{ steps.release.outputs.artifact_digest }}
          PROMOTION_TRANSACTION_ID: ${{ steps.release.outputs.transaction_id }}
          PROMOTION_EVIDENCE_SHA256: ${{ steps.release.outputs.evidence_sha256 }}
        run: |
          install -d -m 700 .local/release
          {
            printf '## What changed\n\n'
            printf '%s\n\n' "$RELEASE_CHANGELOG_INPUT"
            printf 'Commit: `%s`\n\n' "$PROMOTED_RUNTIME_SHA"
            printf 'Artifact digest: `%s`\n\n' "$PROMOTED_ARTIFACT_DIGEST"
            printf 'Promotion transaction: `%s`\n\n' "$PROMOTION_TRANSACTION_ID"
            printf 'Promotion evidence SHA-256: `%s`\n' "$PROMOTION_EVIDENCE_SHA256"
          } > .local/release/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.runtime_sha }}
          body_path: .local/release/release-notes.md
          draft: false
          prerelease: false

      - name: Update Notion release log
        if: ${{ env.NOTION_TOKEN != '' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PROMOTED_RUNTIME_SHA: ${{ steps.release.outputs.runtime_sha }}
          PROMOTED_ARTIFACT_DIGEST: ${{ steps.release.outputs.artifact_digest }}
          PROMOTION_TRANSACTION_ID: ${{ steps.release.outputs.transaction_id }}
          PROMOTION_EVIDENCE_SHA256: ${{ steps.release.outputs.evidence_sha256 }}
        run: |
          release_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit_short="${PROMOTED_RUNTIME_SHA:0:8}"
          notes="$(printf '%s\n\nArtifact digest: %s\nPromotion transaction: %s\nPromotion evidence SHA-256: %s' \
            "$RELEASE_CHANGELOG_INPUT" "$PROMOTED_ARTIFACT_DIGEST" \
            "$PROMOTION_TRANSACTION_ID" "$PROMOTION_EVIDENCE_SHA256")"
          jq -n \
            --arg database "$NOTION_RELEASES_DB" \
            --arg release "$RELEASE_TAG" \
            --arg date "$release_date" \
            --arg commit "$commit_short" \
            --arg author "$GITHUB_ACTOR" \
            --arg notes "$notes" \
            '{
              parent: {database_id: $database},
              properties: {
                Release: {title: [{text: {content: $release}}]},
                Status: {select: {name: "✅ Released"}},
                Type: {select: {name: "Release"}},
                Environment: {select: {name: "Production"}},
                Date: {date: {start: $date}},
                Commit: {rich_text: [{text: {content: $commit}}]},
                Author: {rich_text: [{text: {content: $author}}]},
                Notes: {rich_text: [{text: {content: $notes}}]}
              }
            }' > "$RUNNER_TEMP/notion-release.json"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 20 \
            -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            --data-binary @"$RUNNER_TEMP/notion-release.json" \
            && echo "✅ Notion release logged" || echo "⚠️  Notion update failed"
