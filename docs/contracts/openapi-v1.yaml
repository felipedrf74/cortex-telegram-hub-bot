            schema:
              type: "object"
              description: "Evidenced fields: title (string, required, 1-300 characters), start (ISO 8601, required), end (ISO 8601, required, > start, duration <= 24h), description? (string, <=10000 characters), location? (string, <=500 characters), attendees? (up to 100 valid email strings), source? ('google'|'outlook'; defaults via per-user write preference), recurrence? (bounded JSON object), nexusCategory? (string), categories? (up to 20 strings; Nexus values focus|pomodoro|training|meal|meeting). Aggregate durable payload is limited to 32 KiB."
