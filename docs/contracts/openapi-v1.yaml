      description: |-
        Source: src/api/routes/content.ts:137

        Entitlement: requires the `content` skill entitlement (mount-level requireEntitlement; non-entitled plans receive 403 TIER_REQUIRED, or 403 AI_PLAN_REQUIRED when paid-AI cost-controls enforcement is active).

        Request body (evidenced fields): topic? (trimmed single-line string, 1-160 characters, used only by fallback)

        Notes: runContentDiscovery selects one configured OpenAI/Gemini/Anthropic provider under withAiBudgetReservation. Each provider uses zero transport retries, and a dispatched failure never switches to another paid provider; only configuration or a deterministic pre-dispatch Gemini headroom denial may select the bounded OpenAI path. Client disconnect propagates cancellation before later provider or workspace work. Provider documents are bounded to 80,000 characters; extracted titles are single-line, at most 240 characters, deduplicated, and limited to 15. Malformed provider output is withheld before dedupe or workspace writes and may use the deterministic saved-radar fallback. Canonical database dedup for the complete candidate batch finishes before the first write; an unavailable comparison set returns CONTENT_DEDUP_UNAVAILABLE with no discovery writes. Both live and local successes return only confirmed created/replayed workspace captures plus `persistence:{status:'complete',confirmedCount,createdCount,replayedCount,duplicateCount}` and the message reports confirmed workspace ideas rather than provider candidates. A capture failure returns CONTENT_DISCOVERY_PERSISTENCE_UNAVAILABLE with `details.confirmedBeforeFailure`; that count is already durable, and retry-safe capture reconciles it rather than claiming rollback. The deterministic fallback is evergreen and low-confidence: every returned idea has score 0.35, empty provenanceSources, and a localized no-live-research workflow blocker; the response also carries `degraded:true`, a bounded warning, `generation.providerSemantics:deterministic_local`, and `generation.researchUsed:false`. It never claims what changed, trend status, current-week evidence, or provider grounding. Live output uses `providerSemantics:resolved_provider` and `researchUsed:true` only after grounded output passes validation. Lifecycle, approval, provenance, IDs, and scores remain server-authored. Plan/quota denials are returned as typed AI budget errors, not disguised as fallback; other live-provider failures may use the deterministic saved-radar fallback.
