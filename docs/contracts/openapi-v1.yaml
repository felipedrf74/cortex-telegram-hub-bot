    post:
      operationId: "postContentWorkspaceItemsByItemIdScheduleCancel"
      tags:
        - "content"
      summary: "Durable schedule cancellation"
      description: |-
        Source: src/api/routes/content-workspace-schedule-routes.ts:152; src/services/content-workspace-scheduling.ts:1100,1750; src/services/content-schedule-signal-reconciliation.ts:11

        Entitlement: requires the `content` skill entitlement (mount-level requireEntitlement; non-entitled plans receive 403 TIER_REQUIRED, or 403 AI_PLAN_REQUIRED when paid-AI cost-controls enforcement is active).

        Request body (optional): idempotencyKey? An 8-200 character idempotency key is required in the body or x-idempotency-key header; if both are supplied they must match.

        The canonical cancellation transaction enqueues `content.schedule_signal_reconciliation.requested.v1` with a binding/request-derived idempotency key. The route also performs an immediate strict reconciliation of tenant-user `shoot_day_locked` signals after Secretary no longer reports an active local block. If that strict signal read/dismiss fails, the canonical cancellation and durable outbox event remain committed, and the route returns typed 503 with `details.canonicalCancellationCommitted:true`, `retryable:true`, and `recovery:'retry_cancellation'`. Repeating the same cancellation key safely re-enqueues/retries reconciliation without recreating the work block.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/content-workspace-schedule-routes.ts:152"
      x-entitlement: "content"
      parameters:
        - name: "itemId"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "x-idempotency-key"
          in: "header"
          required: false
          description: "Required unless idempotencyKey is supplied in the body. Body and header values must match."
          schema:
            type: "string"
            minLength: 8
            maxLength: 200
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                idempotencyKey:
                  type: "string"
                  minLength: 8
                  maxLength: 200
              description: "An idempotency key is required in this optional body or x-idempotency-key; both values must match when supplied."
      responses:
        "200":
          description: "{schemaVersion, schedule, mutation} (Standard success envelope unless noted.)"
        "401":
          description: "Error envelope. Stable code(s): CONTENT_TENANT_SCOPE_REQUIRED."
        "403":
          description: "Error envelope. Stable code(s): CONTENT_TENANT_SCOPE_MISMATCH."
        "400":
          description: "Error envelope. Stable code(s): CONTENT_IDEMPOTENCY_KEY_REQUIRED, CONTENT_VALIDATION_FAILED."
        "404":
          description: "Error envelope. Stable code(s): CONTENT_SCHEDULE_NOT_FOUND."
        "409":
          description: "Error envelope. Stable code(s): CONTENT_IDEMPOTENCY_KEY_CONFLICT, CONTENT_IDEMPOTENCY_KEY_REUSED, CONTENT_SCHEDULE_CANCELLATION_IN_PROGRESS, CONTENT_SCHEDULE_ALREADY_COMPLETED, CONTENT_SCHEDULE_STALE."
        "503":
          description: "Error envelope. Stable code(s): CONTENT_WORKSPACE_WRITE_DISABLED, CONTENT_SCHEDULE_AUTHORITY_UNAVAILABLE, CONTENT_SCHEDULE_CANCELLATION_FAILED, CONTENT_SCHEDULE_SIGNAL_RECONCILIATION_UNAVAILABLE, CONTENT_SCHEDULE_SIGNAL_RECONCILIATION_QUEUE_UNAVAILABLE. Reconciliation execution failure reports that canonical cancellation already committed and is safe to retry. Queue failure rolls back the local binding update; a Secretary-owned cancellation may already have committed and the response is safe to retry."
