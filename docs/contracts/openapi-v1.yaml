        "401":
          description: "Error envelope. Stable code(s): CONTENT_TENANT_SCOPE_REQUIRED."
        "403":
          description: "Error envelope. Stable code(s): CONTENT_TENANT_SCOPE_MISMATCH."
        "400":
          description: "Error envelope. Stable code(s): CONTENT_IDEMPOTENCY_KEY_REQUIRED, CONTENT_VALIDATION_FAILED."
        "409":
          description: "Error envelope. Stable code(s): CONTENT_IDEMPOTENCY_KEY_CONFLICT, CONTENT_AGENT_JOB_ACTIVE, CONTENT_AGENT_JOB_CANCELLED, CONTENT_AGENT_JOB_RETRY_REQUIRED, CONTENT_AGENT_JOB_LEASE_LOST. An expired running lease is terminalized as CONTENT_AGENT_JOB_DISPATCH_OUTCOME_UNKNOWN and requires the separate retry mutation before another run."
        "429":
          description: "Error envelope. Stable code(s): SERVICE_DEGRADED. A fail-closed AI_USAGE_PERSISTENCE_FAILED returns Retry-After and is never converted into a successful package fallback."
        "503":
