            "$ref": "#/components/schemas/ApiError"
    ContentCreativeUnavailable:
      description: "Error envelope. Stable code(s): CONTENT_RESEARCH_UNAVAILABLE, CONTENT_CREATIVE_UNAVAILABLE, LOCAL_CAPACITY_BUSY, LOCAL_QUEUE_FULL, LOCAL_QUEUE_DEADLINE, LOCAL_INFERENCE_ATTRIBUTION_UNAVAILABLE, PRIVATE_LOCAL_ROUTE_UNAVAILABLE, INFERENCE_PROVIDER_UNAVAILABLE, LOCAL_INFERENCE_FAILED. For timely proposals, fresh research that reports degraded=true returns CONTENT_RESEARCH_UNAVAILABLE before evidence is marked or persisted as fresh and before creative generation. Forwarded local-inference failures set Retry-After to 60 seconds."
      headers:
        Retry-After:
          required: false
          schema:
            type: "integer"
          description: "Present with the bounded 60-second retry interval for forwarded local-inference failures."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
    ContentScriptEditAccessDenied:
      description: "Error envelope. Stable code(s): TIER_REQUIRED, AI_PLAN_REQUIRED, LOCAL_PLAN_REQUIRED. These are entitlement failures; they do not prove provider execution started."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
    ContentScriptEditQuotaExceeded:
      description: "Error envelope. Stable code(s): AI_DAILY_LIMIT_REACHED, AI_MONTHLY_LIMIT_REACHED, SERVICE_DEGRADED, LOCAL_FAIR_USE_REACHED. Raw local limits, spend, provider responses, and model metadata are never returned."
      headers:
        Retry-After:
          required: true
          schema:
            type: "integer"
          description: "Always set from the model-access reset policy or to the bounded 60-second local retry interval."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
    ContentScriptEditUnavailable:
      description: "Error envelope. Stable code(s): LOCAL_CAPACITY_BUSY, LOCAL_QUEUE_FULL, LOCAL_QUEUE_DEADLINE, FREE_TIER_LOCAL_CAPACITY, PRIVATE_LOCAL_ROUTE_UNAVAILABLE, INFERENCE_PROVIDER_UNAVAILABLE, CONTENT_SCRIPT_EDIT_UNAVAILABLE. Unknown internal/provider failures collapse to CONTENT_SCRIPT_EDIT_UNAVAILABLE; raw messages and details are withheld and the original script is preserved."
      headers:
        Retry-After:
          required: true
          schema:
            type: "integer"
          description: "Set to the bounded 60-second retry interval."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
    ModelAccessDenied:
      description: "AI_PLAN_REQUIRED — the resolved entitlement cannot use model-backed AI (docs/TOKEN-QUOTA-CONTRACT.md). No time-based unblock; unblocksAt is null."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
    ModelQuotaExceeded:
      description: "Stable model-access 429: AI_DAILY_LIMIT_REACHED, AI_MONTHLY_LIMIT_REACHED, or SERVICE_DEGRADED (docs/TOKEN-QUOTA-CONTRACT.md). Details may include window, reset fields, unblocksAt, and retry metadata — never raw caps, spend, model responses, or provider credentials."
      headers:
        Retry-After:
          required: true
          schema:
            type: "integer"
          description: "Always set on stable model-access 429s; derived from the known reset, or a bounded 60-second retry when no deterministic reset exists."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
