        Full-replacement, compare-and-set mutation. `idempotencyKey` must match the required `X-Idempotency-Key` header. Receipts are scoped to the authenticated user and tenant and retained for 30 days. Replaying the same key and canonical request returns the original profile; reusing it for another request fails. A semantically unchanged replacement preserves version and `updatedAt`. Saving does not write any provider calendar or authorize automatic reflow.
