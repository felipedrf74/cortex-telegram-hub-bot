        `confirmationStatus: confirmed`, item status, a work-kind-derived
        planned outcome, estimated effort, dependency, approval state, and next
        action. Dependency is null when the
        calendar has no prerequisite field; next action is never relabelled as
        outcome or dependency. A bounded calendar truncation sets
        `confirmedBlocksComplete: false`, `planStatus: partial`, and partially
        unavailable aggregate authority instead of claiming the list is complete;
        those partial projections still protect their individually current,
        confirmed blocks and never infer confirmation from the aggregate;
        `blockStart`/`blockEnd` remain the earliest-block compatibility summary. A topic deadline is
        `advisory` with `target_date_not_publication` and null block times. A
        recommended work window is a `proposal_not_calendar_reservation`.
