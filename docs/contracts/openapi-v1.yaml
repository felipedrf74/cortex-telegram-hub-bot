  "/api/v1/content/workspace/items/{itemId}/state":
    post:
      operationId: "postContentWorkspaceItemsByItemIdState"
      tags:
        - "content"
      summary: "Version-checked lifecycle transition; projects Decision Center entry when entering review"
      description: |-
        Source: src/api/routes/content-workspace-routes.ts:458

        Entitlement: requires the `content` skill entitlement (mount-level requireEntitlement; non-entitled plans receive 403 TIER_REQUIRED, or 403 AI_PLAN_REQUIRED when paid-AI cost-controls enforcement is active).

        Request body: targetState and expectedWorkflowVersion are required. An 8-200 character idempotencyKey is also required in the body or x-idempotency-key header; if both are supplied they must match.

        Notes: Canonical replacement for legacy /pipeline/{id}/advance. The transition is private-scope, compare-and-swap guarded, idempotently replayable, and limited by the current-state transition graph. Projects support only inbox, active, and archived. Content items may use inbox, active, review, approved, archived, or rejected through this route when the transition is allowed. review requires a saved revision; approval additionally enforces immutable lineage and claim-support policy. scheduled and published are intentionally rejected with CONTENT_PUBLICATION_CONFIRMATION_REQUIRED because private Content work blocks neither publish nor prove publication. Leaving a legacy scheduled state or archiving/rejecting an item with an open work block requires the dedicated cancellation flow. Entering review attempts a Decision Center projection, but projection failure is returned as an explicit unavailable projection and does not roll back the completed canonical state transition.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/content-workspace-routes.ts:458"
      x-entitlement: "content"
      parameters:
        - name: "itemId"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "x-idempotency-key"
          in: "header"
          required: false
          description: "Required unless idempotencyKey is supplied in the body. Body and header values must match."
          schema:
            type: "string"
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: true
              required:
                - "targetState"
                - "expectedWorkflowVersion"
              properties:
                targetState:
                  type: "string"
                  enum:
                    - "inbox"
                    - "active"
                    - "review"
                    - "approved"
                    - "scheduled"
                    - "published"
                    - "archived"
                    - "rejected"
                  description: "scheduled and published remain schema-visible for legacy read compatibility but this mutation rejects them because publication execution/tracking is unsupported."
                expectedWorkflowVersion:
                  type: "integer"
                  minimum: 1
                idempotencyKey:
                  type: "string"
                  minLength: 8
                  maxLength: 200
              description: "An idempotency key is required in this body or x-idempotency-key; both values must match when supplied. Runtime transition and item-type policy remains authoritative."
      responses:
        "200":
          description: "{schemaVersion, item, mutation, decisionProjection?} (Standard success envelope unless noted.)"
        "401":
          description: "Error envelope. Stable code(s): CONTENT_TENANT_SCOPE_REQUIRED."
        "403":
          description: "Error envelope. Stable code(s): CONTENT_TENANT_SCOPE_MISMATCH."
        "400":
          description: "Error envelope. Stable code(s): CONTENT_IDEMPOTENCY_KEY_REQUIRED, CONTENT_VALIDATION_FAILED."
        "404":
          description: "Error envelope. Stable code(s): CONTENT_ITEM_NOT_FOUND."
        "409":
          description: "Error envelope. Stable code(s): CONTENT_IDEMPOTENCY_KEY_CONFLICT, CONTENT_IDEMPOTENCY_KEY_REUSED, CONTENT_WORKFLOW_VERSION_CONFLICT, CONTENT_STATE_TRANSITION_INVALID, CONTENT_STATE_REQUIRES_SAVED_REVISION, CONTENT_LINEAGE_REVIEW_REQUIRED, CONTENT_CLAIM_SAFETY_BLOCKED, CONTENT_PUBLICATION_CONFIRMATION_REQUIRED, CONTENT_SCHEDULE_CANCELLATION_REQUIRED."
        "503":
          description: "Error envelope. Stable code(s): CONTENT_WORKSPACE_WRITE_DISABLED."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
