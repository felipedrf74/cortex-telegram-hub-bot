        `workSchedule` is the canonical private-work-time digest. It contains
        `confirmedThisWeek`, `attentionThisWeek`, `authorityStatus`
        (`current`, `partially_unavailable`, or `unavailable`), fixed
        `semantics: private_work_session`, and `planStatus`
        (`confirmed`, `proposed`, `unplanned`, `partial`, or `unavailable`).
        `confirmed` requires at least one current Secretary-confirmed private
        work block. A current Secretary-local `sync_failed` block remains
        confirmed while its provider-sync failure is also counted in
        `attentionThisWeek`. Current authority with no confirmed block is
        `unplanned` unless an actionable filming recommendation makes it
        `proposed`; cancellation-pending or cancellation-failed attention alone
        is never a proposal. Partial and unavailable authority remain explicit.
        Topic deadlines and filming recommendations are not calendar
        reservations or evidence of publication.

