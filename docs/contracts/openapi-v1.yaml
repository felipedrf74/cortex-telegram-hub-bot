        Request body (optional): idempotencyKey? An 8-200 character idempotency key is required in the body or x-idempotency-key header; if both are supplied they must match.

        Notes: runContentAgentJob pins the authoritative agency package and base revision, then executes four dependency groups under local-primary admission or one workflow-level withAiBudgetReservation. A queued, cancelled-before-work, or failed-before-any-completed-step job reports executionMode=not_started; it is never described as package-derived execution. A budget denial before the reservation callback does not claim provider execution: the job completes with deterministic package-derived steps whose executionMode/basis, null provider, fallbackReason=budget_unavailable, verificationState=not_independently_verified, warnings, and independentReviewPerformed=false remain visible in the read model. Once reservation work has started, ordinary bounded provider/output failures may be represented by package-derived fallbacks with provider_unavailable, budget_unavailable, or provider_output_invalid telemetry; accepted provider output reports provider_routed with verificationState=model_reviewed_not_source_verified. An `AI_USAGE_PERSISTENCE_FAILED` metering failure is different: it is rethrown through every local/cloud specialist catch and returns stable 429 SERVICE_DEGRADED with Retry-After through the shared AI-budget error contract, never as package fallback or provider success. Provider-routed model review is still not source verification, and package fallback is not independently verified. Local-primary grouped inference may make one bounded semantic repair call for only the roles whose first successful response failed deterministic semantic validation. That repair is not a transport retry, never follows an ambiguous provider failure, and unresolved roles remain package_derived/provider_output_invalid. The run registers a lease-bound active AbortController after durable claim. Client disconnect and the separate durable cancel mutation propagate through local/cloud inference and fence every checkpoint/final transaction; a disconnect before claim leaves the job queued, while a disconnect after claim fails it with no fallback checkpoint after the observed abort, and an explicit cancellation remains terminal. A running step is durably claimed before its cost-bearing inference boundary, so an expired lease has an unknown dispatch outcome: merely replaying /run terminalizes only the still-running steps with lastErrorCode=CONTENT_AGENT_JOB_DISPATCH_OUTCOME_UNKNOWN, preserves completed groups, and returns 409 CONTENT_AGENT_JOB_RETRY_REQUIRED with details.retryRequired=true. The owner must invoke the separate /retry mutation before a later /run can repeat those uncertain steps. Account-deletion cancellation, lease/integrity/checkpoint failures, and other workflow failures remain typed job failures. No fallback is represented as provider success or independent source verification.
