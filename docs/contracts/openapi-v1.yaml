  "/api/v1/content/script/expand":
    post:
      operationId: "postContentScriptExpand"
      tags:
        - "content"
      summary: "Expand an existing draft without rerunning research (returns an unapplied proposed patch)"
      description: |-
        Source: src/api/routes/content-script-routes.ts:1216

        Entitlement: requires the `content` skill entitlement (mount-level requireEntitlement; non-entitled plans receive 403 TIER_REQUIRED, or 403 AI_PLAN_REQUIRED when paid-AI cost-controls enforcement is active).

        Request body (evidenced fields): topic (required, ≤240 chars), script (required, ≤20,000 chars), action? (≤80 and must start with 'expand_'), instruction? (≤600), sourceSummary? (array of at most five strings, each at most 220 characters after whitespace normalization)

        Notes: Returns `content-script-edit.v1` with `status=proposed`, `applied=false`, a target/apply mode, base hash, and proposal hash. It does not mutate the canonical draft. Output locale comes from `x-language` when present and otherwise the authenticated user's saved preference; `pt-PT` and `pt-BR` are distinct contracts, including action labels (`guião`/`investigação` versus `roteiro`/`pesquisa`). Explicit non-string topic, script, action, or instruction values return CONTENT_SCRIPT_INPUT_INVALID. Topic, existing script, action, and instruction reject unsupported C0/C1 controls; the existing script may retain normal formatting whitespace. `sourceSummary` rejects non-arrays, non-string entries, more than five entries, normalized entries over 220 characters, and unsupported C0/C1; normal formatting whitespace is collapsed, never truncated. Topic, existing script, instruction, and the validated/normalized source summary are safety-classified before budget/provider work; sourceSummary is untrusted private edit context, not reviewer-attested evidence. The cloud edit boundary explicitly authorizes private data and sets provider `maxRetries=0`; the local path cannot silently escalate. Unsupported/high-risk requests fail closed. A disconnect cancels in-flight work and an ambiguous provider failure is not automatically retried. An empty cloud-provider edit returns 200 with `editPatch:null`, the original script, a localized warning, and `degraded:true`; the governed local-primary boundary instead returns typed 502 INFERENCE_EMPTY_OUTPUT and still preserves the original. Wrong-language, wrong-Portuguese-dialect, or oversized proposed text is withheld and the original remains unchanged. Local-primary failures are projected through a closed public code/message/details map; raw provider messages and metadata are never returned.
      x-nexus-kind: "model-backed"
      x-source: "src/api/routes/content-script-routes.ts:1216"
      x-entitlement: "content"
      parameters:
        - "$ref": "#/components/parameters/ContentOutputLanguage"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["topic", "script"]
              properties:
                topic:
                  type: "string"
                  minLength: 1
                  maxLength: 240
                script:
                  type: "string"
                  minLength: 1
                  maxLength: 20000
                action:
                  type: "string"
                  maxLength: 80
                  pattern: "^expand_"
                instruction:
                  type: "string"
                  maxLength: 600
                sourceSummary:
                  type: "array"
                  maxItems: 5
                  items:
                    type: "string"
                    maxLength: 220
              description: "Non-array, non-string, overfilled, oversized, or unsupported-control input fails rather than becoming a different semantic request. Formatting whitespace inside sourceSummary is normalized before its 220-character bound is applied; whitespace-only entries normalize away, and non-empty entries are never truncated."
      responses:
        "200":
          description: "Script edit response with proposed (not applied) content-script-edit.v1 patch, or a degraded no-change response with editPatch:null and the original script when the cloud provider returns no text (Standard success envelope unless noted.)"
        "400":
          description: "Error envelope. Stable code(s): VALIDATION, CONTENT_SCRIPT_INPUT_INVALID, INFERENCE_CONTEXT_LIMIT_EXCEEDED."
        "403":
          "$ref": "#/components/responses/ContentScriptEditAccessDenied"
        "409":
          description: "Error envelope. Stable code(s): ACCOUNT_DELETION_IN_PROGRESS."
        "413":
          description: "Error envelope. Stable code(s): CONTENT_SCRIPT_INPUT_TOO_LARGE. Input is not truncated."
        "422":
          description: "Error envelope. Stable code(s): CONTENT_UNSUPPORTED_TOPIC, CONTENT_HIGH_RISK_REVIEW_REQUIRED."
        "429":
          "$ref": "#/components/responses/ContentScriptEditQuotaExceeded"
        "502":
          description: "Error envelope. Stable code(s): CONTENT_SCRIPT_EDIT_OUTPUT_TOO_LARGE, CONTENT_SCRIPT_EDIT_LOCALE_MISMATCH, INFERENCE_EMPTY_OUTPUT. The original script is preserved."
        "503":
          "$ref": "#/components/responses/ContentScriptEditUnavailable"
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
