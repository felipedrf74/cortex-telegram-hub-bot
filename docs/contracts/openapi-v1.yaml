  "/api/v1/decisions/{id}/actions":
    post:
      operationId: "postDecisionsByIdActions"
      tags:
        - "decisions"
      summary: "Execute a decision action through the unified replay-safe command contract"
      description: |-
        Source: src/api/routes/decisions.ts:589

        Request body (evidenced fields): actionId (string); idempotencyKey?: stable string <=200, payload (object), channel (string), expectedVersion/recordVersion (positive integer if present), contextVersion (string). New clients persist and reuse idempotencyKey; old clients receive a deterministic request/version-bound compatibility key.

        Notes: DecisionActionError instances pass through with service-defined code/status/details. APNs requires current record/context versions and an exact low-risk executable action; otherwise the response directs the client to open the app without executing. Successful action responses include action-specific exact readback and a commandReceipt. Failed or partially-failed claimed attempts carry the same immutable receipt at error.details.commandReceipt. A replay keeps the original receipt even when the top-level current item has advanced. Replay conflicts: IDEMPOTENCY_KEY_REUSED (409) when the key was already bound to different parameters; DECISION_EXECUTION_RECOVERY_REQUIRED (409, details.recoveryAction = "refresh") when a predecessor execution row cannot prove the exact request bound to the key. Both are terminal for that key: clients retire the stale command, refresh the item, and read the completed effect from the current execution projection instead of retrying the same key. Conflict responses never carry a commandReceipt.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/decisions.ts:589"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Evidenced fields: actionId (string); idempotencyKey?: stable string <=200, payload (object), channel (string), expectedVersion/recordVersion (positive integer if present), contextVersion (string). Route validation code is authoritative for exact shapes."
      responses:
        "200":
          description: "performDecisionAction result including commandReceipt (Standard success envelope unless noted.)"
        "400":
          description: "Error envelope. Stable code(s): VALIDATION, INVALID_DECISION_ACTION."
        "401":
          description: "Error envelope. Stable code(s): UNAUTHORIZED."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
