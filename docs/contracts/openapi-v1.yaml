components:
  securitySchemes:
    appJwt:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "App JWT issued by POST /api/v1/auth/register/* or POST /api/v1/auth/refresh. req.userId === req.tenantId by contract."
  schemas:
    ApiSuccess:
      type: "object"
      description: "Standard success envelope (src/api/response-helpers.ts)."
      required:
        - "ok"
        - "data"
        - "timestamp"
      properties:
        ok:
          const: true
        data:
          description: "Route-specific payload."
        cached:
          type: "boolean"
          description: "True when returning a cached response (stale-while-revalidate UI hint)."
        timestamp:
          type: "string"
          format: "date-time"
    ApiPaginated:
      type: "object"
      description: "Paginated success envelope (src/api/response-helpers.ts)."
      required:
        - "ok"
        - "data"
        - "pagination"
        - "timestamp"
      properties:
        ok:
          const: true
        data:
          type: "array"
          items: {}
        pagination:
          type: "object"
          required:
            - "page"
            - "perPage"
            - "total"
            - "hasMore"
          properties:
            page:
              type: "integer"
            perPage:
              type: "integer"
            total:
              type: "integer"
            hasMore:
              type: "boolean"
        timestamp:
          type: "string"
          format: "date-time"
    ApiError:
      type: "object"
      description: "Standard error envelope (src/api/response-helpers.ts). code is a stable uppercase identifier the app can branch on; details never contain raw user data, raw tokens, or stack traces."
      required:
        - "ok"
        - "error"
        - "timestamp"
      properties:
        ok:
          const: false
        error:
          type: "object"
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
            message:
              type: "string"
            details:
              type: "object"
        timestamp:
          type: "string"
          format: "date-time"
    QuotaStatusFields:
      type: "object"
      description: "Additive public quota fields on billing/status and usage reads, exactly as specified in docs/TOKEN-QUOTA-CONTRACT.md (\"Public billing and status payload\"). Exact cost values are owner/admin-only and never exposed. Legacy usageFraction/usagePercent are the max of the daily and monthly fractions; legacy isOverLimit is the effective blocking verdict; unblocksAt is the authoritative reset for a blocked request (null for plan blocks). All timestamps ISO-8601 UTC."
      properties:
        enforcementEnabled:
          type: "boolean"
        aiAccessAllowed:
          type: "boolean"
        blockReason:
          type:
            - "string"
            - "null"
        dailyUsageFraction:
          type: "number"
        dailyUsagePercent:
          type: "number"
        dailyIsOverLimit:
          type: "boolean"
        dailyResetsAt:
          type: "string"
          format: "date-time"
        monthlyUsageFraction:
          type: "number"
        monthlyUsagePercent:
          type: "number"
        monthlyIsOverLimit:
          type: "boolean"
        monthlyResetsAt:
          type: "string"
          format: "date-time"
        unblocksAt:
          type:
            - "string"
            - "null"
          format: "date-time"
        usageFraction:
          type: "number"
        usagePercent:
          type: "number"
        isOverLimit:
          type: "boolean"
        resetAt:
          type: "string"
          format: "date-time"
        resetsAt:
          type: "string"
          format: "date-time"
  responses:
    ErrorEnvelope:
      description: "Standard error envelope. 400 input validation, 401 missing/invalid auth, 403 authorization failure, 404 not found, 409 conflict, 422 semantically rejectable input, 429 rate limit (sets Retry-After), 503 downstream failure (backend-api-contract-standard §4)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
    ModelAccessDenied:
      description: "AI_PLAN_REQUIRED — the resolved entitlement cannot use model-backed AI (docs/TOKEN-QUOTA-CONTRACT.md). No time-based unblock; unblocksAt is null."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
    ModelQuotaExceeded:
      description: "Stable model-access 429: AI_DAILY_LIMIT_REACHED, AI_MONTHLY_LIMIT_REACHED, or SERVICE_DEGRADED (docs/TOKEN-QUOTA-CONTRACT.md). Details may include window, reset fields, unblocksAt, and retry metadata — never raw caps, spend, model responses, or provider credentials."
      headers:
        Retry-After:
          required: true
          schema:
            type: "integer"
          description: "Always set on stable model-access 429s; derived from the known reset, or a bounded 60-second retry when no deterministic reset exists."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
