    ContentScriptDurationPresetRequest:
      type: "object"
      description: "Closed format-bound duration presets shared by synchronous and asynchronous Content script requests. Both duration fields must be valid when supplied; targetDurationSeconds determines the applied preset when both are present."
      oneOf:
        - title: "YouTube duration"
          description: "The default branch when format is omitted. Defaults to 8 minutes / 480 seconds when neither duration field is supplied."
