  "/api/v1/content/script":
    post:
      operationId: "postContentScript"
      tags:
        - "content"
      summary: "Generate a structured script via canonical pipeline (research + provider/local inference)"
      description: |-
        Source: src/api/routes/content-script-routes.ts:197

        Entitlement: requires the `content` skill entitlement (mount-level requireEntitlement; non-entitled plans receive 403 TIER_REQUIRED, or 403 AI_PLAN_REQUIRED when paid-AI cost-controls enforcement is active).

        Request body (evidenced fields): topic (required, at most 2,000 characters), niche? (at most 160), hookIdea? (at most 500), whyNow? (at most 1,000), angleTag? (at most 160), format? ('YouTube'|'Reel'), maxDurationMinutes?, targetDurationSeconds?, mode?, language?, renderMode?, scriptStyle?/style?, forceRefresh?/regenerate?, regenerationSeed? (at most 120), saveToIdeas?, idempotencyKey?, highRiskAcknowledged?/acknowledgeHighRisk?. YouTube duration presets are 8/10/15 minutes or 480/600/900 seconds and default to 8 minutes; Reel permits maxDurationMinutes=1 or targetDurationSeconds=15/30/45/60 and defaults to 60 seconds. When both duration fields are valid and supplied, targetDurationSeconds is authoritative. Legacy `style` aliases are case-sensitive and must resolve to the same canonical value as `scriptStyle` when both are supplied. When saveToIdeas=true, an 8-200 character idempotencyKey is required in the body or x-idempotency-key header; if both are supplied they must match. The key reserves the normalized request before budget/provider work, atomically settles canonical workspace persistence with the replay receipt, replays the exact completed public response, rejects changed semantic input, and reports concurrent in-progress work without regenerating. Before entering model-backed generation the receipt becomes `dispatched`; that state is never lease-reclaimed. If it has no replayable response, later key reuse returns 409 CONTENT_IDEMPOTENCY_RESULT_UNAVAILABLE with details.requiresNewKey=true rather than repeating an ambiguously dispatched request.

        Notes: The server resolves exact-scope item/topic context, bounds every semantic field, rejects unsupported C0/C1 controls, and classifies topic+niche+hookIdea+whyNow+angleTag before idempotency reservation, source loading, budget admission, persistence, cache/provider work, or direct engine use. Oversized stored context is omitted rather than truncated into a different meaning. A supported body `language` explicitly overrides `x-language`; otherwise the header applies when present, then the authenticated user's saved preference. `pt-PT` and `pt-BR` remain separate output contracts through response assembly and persistence. Unsupported and every high-risk request fail closed; compatibility acknowledgement flags, deep mode, and source attachment do not grant the currently unsupported reviewer-attested source-package authority. The legacy acknowledgement flags are also excluded from the save idempotency fingerprint, so toggling either one cannot create a distinct authorized request. The server derives and binds the canonical topic+niche research query; clients cannot substitute it. Runs under withAiBudgetReservation and honors ForwardedLocalInferenceError and CONTENT_LIVE_EVAL request errors. The v9 script cache identity includes the selected intelligence-signal fingerprint, and `agentSignalsUsed` is a bounded payload-free digest of inputs actually incorporated. `generation.provider=content-engine` identifies the service boundary only and is paired with `providerSemantics=service_boundary`; it is not downstream model attribution. Client disconnect aborts in-flight work. Script provider calls have no provider-level replay key and do not automatically retry an ambiguous transport failure.
      x-nexus-kind: "model-backed"
      x-source: "src/api/routes/content-script-routes.ts:197"
      x-entitlement: "content"
      parameters:
        - "$ref": "#/components/parameters/ContentOutputLanguage"
        - name: "x-idempotency-key"
          in: "header"
          required: false
          description: "Required when saveToIdeas=true unless idempotencyKey is present in the body. Body and header values must match."
          schema:
            type: "string"
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["topic"]
              allOf:
                - "$ref": "#/components/schemas/ContentScriptDurationPresetRequest"
              properties:
                topic:
                  type: "string"
                  minLength: 1
                  maxLength: 2000
                niche:
                  type: "string"
                  maxLength: 160
                hookIdea:
                  type: "string"
                  maxLength: 500
                whyNow:
                  type: "string"
                  maxLength: 1000
                angleTag:
                  type: "string"
                  maxLength: 160
                format:
                  type: "string"
                  enum: ["YouTube", "Reel"]
                maxDurationMinutes:
                  type: "integer"
                  description: "Format-bound minute preset. When targetDurationSeconds is also supplied, both fields must be valid and targetDurationSeconds determines the applied preset."
                targetDurationSeconds:
                  type: "integer"
                  description: "Format-bound seconds preset. Takes precedence over a simultaneously supplied valid maxDurationMinutes value."
                mode:
                  type: "string"
                  enum: ["draft", "quick", "standard", "deep"]
                language:
                  type: "string"
                  enum: ["en-US", "pt-PT", "pt-BR"]
                  description: "Explicit script output locale; overrides x-language and the saved preference."
                renderMode:
                  type: "string"
                  enum: ["structured", "chat"]
                scriptStyle:
                  type: "string"
                  enum: ["detailed", "bullets"]
                style:
                  type: "string"
                  enum: ["bullet", "bullets", "outline", "pontos", "detailed", "full", "script", "roteiro", "completo"]
                  deprecated: true
                  description: "Legacy compatibility alias. Matching is case-sensitive. When scriptStyle is also supplied, both fields must resolve to the same canonical detailed or bullets value."
                forceRefresh:
                  type: "boolean"
                regenerate:
                  type: "boolean"
                regenerationSeed:
                  type: "string"
                  maxLength: 120
                saveToIdeas:
                  type: "boolean"
                idempotencyKey:
                  type: "string"
                  minLength: 8
                  maxLength: 200
                highRiskAcknowledged:
                  type: "boolean"
                acknowledgeHighRisk:
                  type: "boolean"
              description: "Oversized topic, niche, hookIdea, whyNow, angleTag, or regenerationSeed input returns 413 without truncation. Unsupported C0/C1 controls return CONTENT_SCRIPT_INPUT_INVALID before prompt/provider work. These optional semantic fields must be strings when supplied. highRiskAcknowledged/acknowledgeHighRisk never authorize high-risk generation and are excluded from the save replay fingerprint. saveToIdeas=true requires a matching body/header idempotency key and provides atomic durable whole-request replay."
      responses:
        "200":
          description: "Structured ScriptResponse (script, hook, titleOptions, sourcesUsed with publisher/author/publishedAt/accessedAt provenance, claimLedger, research ids, operationTrace, payload-free agentSignalsUsed, cost/quality meta; savedIdea when saveToIdeas). A source-bound claim only reconciles cited IDs to the server-issued source set; it is not entailment, accuracy, or human verification."
        "400":
          description: "Error envelope. Stable code(s): VALIDATION, CONTENT_VALIDATION_FAILED, CONTENT_SCRIPT_INPUT_INVALID, CONTENT_IDEMPOTENCY_KEY_REQUIRED, INFERENCE_CONTEXT_LIMIT_EXCEEDED."
        "403":
          "$ref": "#/components/responses/ContentEngineAccessDenied"
        "409":
          description: "Error envelope. Stable code(s): ACCOUNT_DELETION_IN_PROGRESS, CONTENT_IDEMPOTENCY_KEY_CONFLICT, CONTENT_IDEMPOTENCY_KEY_REUSED, CONTENT_IDEMPOTENCY_IN_PROGRESS, CONTENT_IDEMPOTENCY_RESULT_UNAVAILABLE, LOCAL_PRIMARY_DISABLED. CONTENT_IDEMPOTENCY_RESULT_UNAVAILABLE means the matching receipt crossed the generation boundary but has no replayable response; it is never lease-reclaimed and details.requiresNewKey is true."
        "413":
          description: "Error envelope. Stable code(s): CONTENT_SCRIPT_INPUT_TOO_LARGE. The input is not truncated."
        "422":
          description: "Error envelope. Stable code(s): CONTENT_UNSUPPORTED_TOPIC, CONTENT_HIGH_RISK_REVIEW_REQUIRED, CONTENT_SCRIPT_RESEARCH_QUERY_TOO_LARGE, CONTENT_SCRIPT_RESEARCH_QUERY_MISMATCH, CONTENT_SCRIPT_OUTPUT_BLOCKED, CONTENT_RESEARCH_REQUIRED, CONTENT_RESEARCH_QUERY_INVALID. High-risk details report reviewAuthority=not_supported, requiredEvidence=reviewer_attested_source_package, retryable=false."
        "429":
          "$ref": "#/components/responses/ContentEngineQuotaExceeded"
        "502":
          description: "Error envelope. Stable code(s): CONTENT_SCRIPT_LOCALE_MISMATCH, INFERENCE_EMPTY_OUTPUT, INFERENCE_SCHEMA_VALUE_INVALID. Generated display output is withheld before persistence; the locale-mismatch message follows the selected body/header/profile output locale."
        "503":
          "$ref": "#/components/responses/ContentEngineUnavailable"
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/content/script-jobs":
    post:
      operationId: "postContentScriptJobs"
      tags:
        - "content"
      summary: "Create an async long-form script job (queued for the configured provider route)"
      description: |-
        Source: src/api/routes/content-script-job-routes.ts:33

        Entitlement: requires the `content` skill entitlement (mount-level requireEntitlement; non-entitled plans receive 403 TIER_REQUIRED, or 403 AI_PLAN_REQUIRED when paid-AI cost-controls enforcement is active).

        Request body (evidenced fields): idempotencyKey (required, 1-200 characters in body or x-idempotency-key header; both must match), topic (required, 1-2,000), niche? (at most 160), plus the bounded script request fields. Optional pinned evidence may use `sources` or `sourceContext`, never both; each accepts at most 20 objects with title/url/source-type/relevance limits of 500/2,000/120/1,500 characters.

        Notes: The tenant-user idempotency key binds the normalized public request and pinned source snapshot before job admission. Exact replay returns the existing job with 200 even if runtime admission later turns off; changed semantic input or pinned sources conflict. Topic+niche are classified before admission, and unsupported/high-risk requests fail without queueing; reviewer-attested high-risk authority is not supported. Topic, niche, idempotency key, and pinned source text reject unsupported C0/C1 controls before admission. Both source aliases together, non-arrays, malformed or empty source objects, conflicting field aliases, over 20 entries, oversized fields, and non-HTTP(S) non-empty URLs fail before hashing; no entry is skipped and no source input is filtered or truncated into an idempotency identity. Duration presets match the synchronous route: YouTube accepts 8/10/15 minutes or 480/600/900 seconds and defaults to 8 minutes; Reel accepts maxDurationMinutes=1 or targetDurationSeconds=15/30/45/60 and defaults to 60 seconds. Both supplied fields must be valid, and targetDurationSeconds determines the applied preset. The sync-only `style` compatibility alias is rejected; async clients must use `scriptStyle`. New admission and explicit retry commit the queued job state and credit reservation on the same caller database transaction, so neither side can commit alone. New work returns 202 before inference completes. The server pins either a verified local-model route or the configured cloud-primary provider/model/service tier into the durable job; delivery mode controls queue timing, not publication. Encrypted private request/result material is retained only for its bounded window; terminal reads may later expose a content-free tombstone. Encryption errors surface with ContentScriptJobEncryptionError code/status.
      x-nexus-kind: "model-backed"
      x-source: "src/api/routes/content-script-job-routes.ts:33"
      x-entitlement: "content"
      parameters:
        - name: "x-idempotency-key"
          in: "header"
          required: false
          description: "Required unless idempotencyKey is supplied in the body. Oversized values are rejected rather than truncated."
          schema:
            type: "string"
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              required: ["topic"]
              allOf:
                - "$ref": "#/components/schemas/ContentScriptDurationPresetRequest"
              properties:
                idempotencyKey:
                  type: "string"
                  minLength: 1
                  maxLength: 200
                topic:
                  type: "string"
                  minLength: 1
                  maxLength: 2000
                niche:
                  type: "string"
                  maxLength: 160
                format:
                  type: "string"
                  enum: ["YouTube", "Reel"]
                maxDurationMinutes:
                  type: "integer"
                  description: "Format-bound minute preset. When targetDurationSeconds is also supplied, both fields must be valid and targetDurationSeconds determines the applied preset."
                targetDurationSeconds:
                  type: "integer"
                  description: "Format-bound seconds preset. Takes precedence over a simultaneously supplied valid maxDurationMinutes value."
                mode:
                  type: "string"
                  enum: ["draft", "quick", "standard", "deep"]
                deliveryMode:
                  type: "string"
                  enum: ["standard", "scheduled", "priority"]
                language:
                  type: "string"
                  enum: ["en-US", "pt-PT", "pt-BR"]
                  description: "Explicit output locale; when omitted, the authenticated user's saved preference is normalized for execution. Idempotency binds either the normalized explicit value or a profile_default intent marker."
                renderMode:
                  type: "string"
                  enum: ["structured", "chat"]
                scriptStyle:
                  type: "string"
                  enum: ["detailed", "bullets"]
                forceRefresh:
                  type: "boolean"
                sources:
                  type: "array"
                  maxItems: 20
                  items:
                    type: "object"
                    properties:
                      title:
                        type: "string"
                        maxLength: 500
                      url:
                        type: "string"
                        maxLength: 2000
                        description: "When non-empty, must use http or https and may not contain URL credentials."
                      source_type:
                        type: "string"
                        maxLength: 120
                      sourceType:
                        type: "string"
                        maxLength: 120
                      relevance_note:
                        type: "string"
                        maxLength: 1500
                      relevanceNote:
                        type: "string"
                        maxLength: 1500
                    description: "Snake/camel aliases may not conflict. An object without a non-empty title, URL, or relevance note is invalid, even if it contains only source type; malformed, oversized, control-bearing, credential-bearing, or invalid-URL entries are rejected rather than truncated or skipped."
                sourceContext:
                  type: "array"
                  maxItems: 20
                  items:
                    type: "object"
                    properties:
                      title:
                        type: "string"
                        maxLength: 500
                      url:
                        type: "string"
                        maxLength: 2000
                        description: "When non-empty, must use http or https and may not contain URL credentials."
                      source_type:
                        type: "string"
                        maxLength: 120
                      sourceType:
                        type: "string"
                        maxLength: 120
                      relevance_note:
                        type: "string"
                        maxLength: 1500
                      relevanceNote:
                        type: "string"
                        maxLength: 1500
                    description: "Alias of sources; the request may not contain both top-level aliases. The same strict validation applies, including rejection of empty source objects without filtering them out."
              description: "The idempotency key may be supplied in the body or header. `sources` and `sourceContext` are mutually exclusive. Topic, niche, key, and pinned-source shape/control/bounds fail before admission and hashing, with no truncation. When supplied, niche and every pinned-source text field must be strings (including rejecting null). The sync-only `style` alias is rejected; use `scriptStyle`."
      responses:
        "200":
          description: "Existing job view returned for an exact tenant-user idempotent replay. No new admission, reservation, or inference is started."
        "202":
          description: "Newly admitted job view; inference continues asynchronously (Standard success envelope unless noted.)"
        "402":
