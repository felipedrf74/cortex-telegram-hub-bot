components:
  securitySchemes:
    appJwt:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "App JWT issued by POST /api/v1/auth/register/* or POST /api/v1/auth/refresh. req.userId === req.tenantId by contract."
  parameters:
    ContentWorkspaceIdempotencyKey:
      name: "x-idempotency-key"
      in: "header"
      required: false
      description: "Required for canonical Content workspace mutations unless idempotencyKey is supplied in the JSON body. The value is trimmed, must contain 8-200 characters, and must exactly match the body value when both are supplied."
      schema:
        type: "string"
        minLength: 8
        maxLength: 200
    ContentOutputLanguage:
      name: "x-language"
      in: "header"
      required: false
      description: "Selects the authenticated Content output locale. Canonical values are en-US, pt-PT, and pt-BR; runtime also accepts established aliases such as en, pt, English, Brazilian Portuguese, European Portuguese, and their localized Portuguese names. Retired Spanish locale signals resolve to en-US. When absent, the user's saved language applies; any other present string follows the legacy pt-BR fallback. pt-PT and pt-BR remain distinct dialect contracts, and locale is never inferred from request prose or creator identity."
      schema:
        type: "string"
        example: "en-US"
  schemas:
    DecisionCommandReceiptReadbackItem:
      type: "object"
      additionalProperties: false
      required:
        - "decisionId"
        - "recordVersion"
        - "status"
      properties:
        decisionId:
          type: "string"
          minLength: 1
        recordVersion:
          type: "integer"
          minimum: 1
        contextVersion:
          type: "string"
          minLength: 1
        status:
          type: "string"
          minLength: 1
          description: "Decision domain state at completion, such as read, snoozed, dismissed, or actioned."
        snoozedUntil:
          type: "string"
          format: "date-time"
        actionId:
          type: "string"
          minLength: 1
        actionStatus:
          type: "string"
          enum:
            - "succeeded"
            - "partially_failed"
            - "failed"
          description: "When present, exactly equals the enclosing receipt status."
    DecisionCommandReceiptVerification:
      type: "object"
      additionalProperties: false
      required:
        - "readBackOk"
        - "expectedEffect"
        - "actualEffect"
        - "message"
      properties:
        readBackOk:
          type: "boolean"
        expectedEffect:
          type: "object"
          additionalProperties: true
          description: "Privacy-minimized expected evidence; never contains raw command, prompt, user copy, scope IDs, or idempotency key."
        actualEffect:
          type: "object"
          additionalProperties: true
          description: "Privacy-minimized authoritative effect evidence."
        message:
          type: "string"
          minLength: 1
          maxLength: 240
          description: "Bounded server-authored receipt explanation."
    DecisionCommandReceipt:
      type: "object"
      additionalProperties: false
      required:
        - "schemaVersion"
        - "receiptId"
        - "decisionId"
        - "operation"
        - "idempotencyKeyHash"
        - "status"
        - "completedAt"
      properties:
        schemaVersion:
          const: "decision_command_receipt@1.0.0"
        receiptId:
          type: "string"
          pattern: "^dcr_[a-f0-9]{64}(?:_partial)?$"
          description: "Deterministic and bound to authenticated tenant/user scope, operation, action, decision resource, and stable key. The _partial suffix preserves the first uncertain terminal observation; later reconciliation appends the canonical base receipt instead of mutating it."
        decisionId:
          type: "string"
          minLength: 1
        operation:
          type: "string"
          enum:
            - "create_intent"
            - "act"
            - "review"
            - "edit"
            - "snooze"
            - "dismiss"
            - "mark_viewed"
            - "refresh"
            - "update_preferences"
            - "suppress_type"
            - "unsuppress_type"
            - "record_exposure"
            - "recompute_plan"
        actionId:
          type: "string"
          minLength: 1
        idempotencyKeyHash:
          type: "string"
          pattern: "^[a-f0-9]{64}$"
          description: "Lowercase SHA-256 of the raw stable key with no prefix. The raw key is never returned."
        status:
          type: "string"
          enum:
            - "succeeded"
            - "partially_failed"
            - "failed"
        executionAttemptId:
          type: "string"
          minLength: 1
        completedAt:
          type: "string"
          format: "date-time"
        requestedRecordVersion:
          type: "integer"
          minimum: 1
        requestedContextVersion:
          type: "string"
          minLength: 1
        resultRecordVersion:
          type: "integer"
          minimum: 1
        resultContextVersion:
          type: "string"
          minLength: 1
        readbackItem:
          "$ref": "#/components/schemas/DecisionCommandReceiptReadbackItem"
        verification:
          "$ref": "#/components/schemas/DecisionCommandReceiptVerification"
      allOf:
        - if:
            properties:
              status:
                const: "succeeded"
            required:
              - "status"
          then:
            required:
              - "verification"
        - if:
            properties:
              status:
                const: "succeeded"
              operation:
                enum:
                  - "act"
                  - "review"
                  - "edit"
                  - "snooze"
                  - "dismiss"
                  - "mark_viewed"
                  - "refresh"
            required:
              - "status"
              - "operation"
          then:
            anyOf:
              - required:
                  - "readbackItem"
                  - "resultRecordVersion"
              - required:
                  - "executionAttemptId"
        - if:
            properties:
              status:
                const: "succeeded"
            required:
              - "status"
            anyOf:
              - properties:
                  operation:
                    const: "snooze"
                required:
                  - "operation"
              - properties:
                  operation:
                    const: "review"
                  actionId:
                    const: "review:defer"
                required:
                  - "operation"
                  - "actionId"
          then:
            required:
              - "readbackItem"
              - "resultRecordVersion"
            properties:
              readbackItem:
                allOf:
                  - "$ref": "#/components/schemas/DecisionCommandReceiptReadbackItem"
                  - required:
                      - "snoozedUntil"
                    properties:
                      status:
                        const: "snoozed"
      description: "Immutable privacy-minimized evidence for the original stable-key mutation. The top-level item may be newer on replay; this receipt never changes to describe a later command. Successful receipts require complete verification; successful item mutations additionally require compact readback or an execution attempt, and snooze/review-defer success always carries the resolved snooze instant. Optional receipt absence/null remains compatible only with predecessor responses and rows."
    SecretaryRoutineWindow:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "weekdays"
        - "start"
        - "end"
      properties:
        id:
          type: "string"
          format: "uuid"
        weekdays:
          type: "array"
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: "integer"
            minimum: 1
            maximum: 7
          description: "ISO weekdays, Monday=1 through Sunday=7."
        start:
          type: "string"
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: "string"
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
          description: "Same-day end strictly later than start."
    SecretaryProtectedRoutine:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "weekdays"
        - "start"
        - "end"
        - "label"
        - "kind"
      properties:
        id:
          type: "string"
          format: "uuid"
        weekdays:
          type: "array"
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: "integer"
            minimum: 1
            maximum: 7
        start:
          type: "string"
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: "string"
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        label:
          type: "string"
          minLength: 1
          maxLength: 80
        kind:
          type: "string"
          enum:
            - "focus"
            - "training"
            - "meal"
            - "recovery"
            - "personal"
            - "travel"
    SecretaryRoutineProfile:
      type: "object"
      additionalProperties: false
      required:
        - "status"
        - "version"
        - "timezone"
        - "workingWindows"
        - "preferredFocusWindows"
        - "protectedRoutines"
        - "updatedAt"
      properties:
        status:
          type: "string"
          enum:
            - "unconfigured"
            - "configured"
        version:
          type: "integer"
          minimum: 0
        timezone:
          type: "string"
          description: "Canonical users.timezone IANA identifier."
        workingWindows:
          type: "array"
          maxItems: 14
          items:
            "$ref": "#/components/schemas/SecretaryRoutineWindow"
        preferredFocusWindows:
          type: "array"
          maxItems: 14
          items:
            "$ref": "#/components/schemas/SecretaryRoutineWindow"
        protectedRoutines:
          type: "array"
          maxItems: 28
          items:
            "$ref": "#/components/schemas/SecretaryProtectedRoutine"
        updatedAt:
          type:
            - "string"
            - "null"
          format: "date-time"
    SecretaryRoutineProfilePut:
      type: "object"
      additionalProperties: false
      required:
        - "expectedVersion"
        - "idempotencyKey"
        - "timezone"
        - "workingWindows"
        - "preferredFocusWindows"
        - "protectedRoutines"
      properties:
        expectedVersion:
          type: "integer"
          minimum: 0
        idempotencyKey:
          type: "string"
          minLength: 8
          maxLength: 200
        timezone:
          type: "string"
        workingWindows:
          type: "array"
          maxItems: 14
          items:
            "$ref": "#/components/schemas/SecretaryRoutineWindow"
        preferredFocusWindows:
          type: "array"
          maxItems: 14
          items:
            "$ref": "#/components/schemas/SecretaryRoutineWindow"
        protectedRoutines:
          type: "array"
          maxItems: 28
          items:
            "$ref": "#/components/schemas/SecretaryProtectedRoutine"
    SecretaryRoutineProfileSuccess:
