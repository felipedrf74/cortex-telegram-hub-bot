        Notes: A scoped leased receipt makes exact retries return the stored result without invalidation or orchestration. Reusing a key for a different normalized request returns 409. The first execution invalidates the user's planning caches, composes the week once with signal sync, and projects today from that exact week. The weekly composer durably synchronizes derived mesh signals only when the requested week is the captured current week in the authenticated user's timezone; historical or future recomputes remain read-only in-memory projections and cannot retire another week's coordination state. Week and Today share one captured generatedAt and include timezone, warnings, warningCodes, and sourceHealth. The internal orchestration snapshot identity is not exposed; an additive privacy-minimized commandReceipt is returned as immutable replay evidence. Recompute is deterministic and token-zero; AI-copy quota may suppress creative copy but does not make otherwise healthy source state degraded.
