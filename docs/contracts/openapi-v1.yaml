# Nexus Hub iOS API contract — /api/v1 app-JWT surface only.
# Canonical contract home (backend-api-contract-standard.md §11).
# Derived from src/api/router.ts at commit 8f75dfa2; do not add paths that are not registered there.
# Regeneration provenance: built from a structured extraction of src/api/routes/*; maintained by hand thereafter.
openapi: "3.1.0"
info:
  title: "Nexus Hub iOS API — /api/v1 app-JWT surface"
  version: "v1"
  license:
    name: "MIT"
    identifier: "MIT"
  description: |-
    Canonical contract index for the /api/v1 surface used by nexus-hub-ios.

    Derived from src/api/router.ts (commit 8f75dfa2) and the mounted route modules under src/api/routes/. Every path here is registered in that router; no route is invented. Request/response field detail is evidence-based and intentionally partial — route code, docs/engineering/backend-api-contract-standard.md, and docs/TOKEN-QUOTA-CONTRACT.md are authoritative for exact shapes.

    ## Scope

    App-JWT surface only. The following exist under /api/v1 in the same router but are NOT part of the iOS app contract and are deliberately excluded:

    - /api/v1/internal/* — service-to-service routes authenticated by shared secret (Python content-engine usage reporting).
    - /api/v1/admin/* — portal-token-gated admin surfaces (content dashboard, event backbone, product learning, local inference, hybrid kill switches, AI credit grants).
    - POST /api/v1/billing/apple-notifications — Apple App Store server-to-server notification webhook (public, JWS-verified).

    Portal and admin APIs are never the iOS contract.

    ## Versioning

    The contract version is the /api/v1 path prefix (per docs/engineering/backend-api-contract-standard.md §11); GET /api/v1/ reports version: "v1". There is no global contractVersion header. Where an individual payload carries a domain-scoped contractVersion field (for example the content notification inbox), it is noted on that route and governs only that payload.

    ## Authentication and rate limiting

    Authenticated routes require the app JWT as Authorization: Bearer <token> (see the appJwt security scheme), obtained from POST /api/v1/auth/register/* or POST /api/v1/auth/refresh. Register/refresh routes are public behind an IP-bucket rate limit. All authenticated routes run behind a per-user rate limiter and may return 401 (missing/invalid token) or 429 even where not listed per route.

    ## Response envelope

    Per src/api/response-helpers.ts, every route returns one of:

    - { ok: true, data, cached, timestamp } — success (schema ApiSuccess)
    - { ok: true, data: [...], pagination: { page, perPage, total, hasMore }, timestamp } — paginated success (schema ApiPaginated)
    - { ok: false, error: { code, message, details? }, timestamp } — error (schema ApiError)

    Exceptions are noted per route (GET /api/v1/ info payload, legacy HealthKit sync/read envelopes, raw file streams, legal 302 redirects). Soft failures set degraded: true plus a warnings array inside the payload rather than a non-2xx status. Several GET routes support conditional requests (If-None-Match → 304 Not Modified).

    ## Deterministic vs model-backed

    Every operation carries x-nexus-kind: deterministic (token-zero — never triggers a model/provider completion) or model-backed. Token-zero is law for data reads (backend-api-contract-standard §1). Model-backed operations pass the entitlement + budget gate of docs/TOKEN-QUOTA-CONTRACT.md and can return the stable model-access errors: 403 AI_PLAN_REQUIRED, 429 AI_DAILY_LIMIT_REACHED, 429 AI_MONTHLY_LIMIT_REACHED, 429 SERVICE_DEGRADED (every stable 429 sets Retry-After). Some operations marked model-backed run inference asynchronously after a 202 admission (noted per route).
servers:
  - url: "/"
    description: "Paths are absolute; the router is mounted at /api/v1 on the backend host."
security:
  - appJwt: []
tags:
  - name: "meta"
    description: "API info / health check. Public."
  - name: "auth"
    description: "Registration, sign-in, refresh, and account/session management (src/api/routes/auth.ts, oauth-initiate.ts). Register/refresh routes are public with an IP-bucket rate limit and issue the app JWT; some routes (e.g. /auth/me) require the JWT."
  - name: "legal"
    description: "Current legal metadata and Terms/Privacy document redirects (src/api/routes/legal.ts). Public."
  - name: "chat"
    description: "Conversational surface (src/api/routes/chat.ts and chat-* modules). One of the only model-backed app surfaces; history and other reads are deterministic."
  - name: "attachments"
    description: "Image invoice/calendar/task extraction preview (src/api/routes/attachments.ts). Model-backed."
  - name: "device-inference"
    description: "On-device inference policy, admissions, and evidence (src/api/routes/device-inference.ts)."
  - name: "dashboard"
    description: "Aggregated home screen (src/api/routes/dashboard.ts)."
  - name: "summaries"
    description: "Fast app read models (src/api/routes/summaries.ts)."
  - name: "sync"
    description: "RAMEN-lite delta sync (src/api/routes/sync.ts)."
  - name: "tasks"
    description: "Token-zero task CRUD and sync (src/api/routes/tasks.ts)."
  - name: "training"
    description: "Training domain (src/api/routes/training.ts and training-* modules) behind the training entitlement; exercise-media routes are self-contained entitlement-aware with a dark-route 404 contract."
  - name: "calendar"
    description: "Calendar reads and event operations (src/api/routes/calendar.ts)."
  - name: "reminders"
    description: "Reminders (src/api/routes/reminders.ts)."
  - name: "notes"
    description: "Notes (src/api/routes/notes.ts)."
  - name: "connections"
    description: "Provider connection status and management (src/api/routes/connections.ts)."
  - name: "wearable"
    description: "Wearable summaries (src/api/routes/wearable.ts)."
  - name: "health-data"
    description: "HealthKit ingestion plus entitlement-independent structured health, correction, consent, deletion, and export lifecycle (src/api/routes/health-data.ts). Legacy /sync and /latest retain their module-local envelope; lifecycle routes use the standard envelope."
  - name: "garmin"
    description: "Garmin interactive auth (src/api/routes/garmin-auth.ts)."
  - name: "usage"
    description: "Usage reads (src/api/routes/usage.ts)."
  - name: "skills"
    description: "Skills catalog and per-user override state (src/api/routes/skills.ts)."
  - name: "signals"
    description: "Cross-skill training signal observability (src/api/routes/signals.ts). Read-only."
  - name: "client-errors"
    description: "Write-only client crash/error ingestion (src/api/routes/client-errors.ts)."
  - name: "ai-reports"
    description: "In-app reporting of objectionable or inaccurate AI output (src/api/routes/ai-reports.ts). Write-only."
  - name: "audit-trail"
    description: "GDPR self-service audit trail (src/api/routes/audit-trail.ts). Read-only, scoped to the authenticated user."
  - name: "content"
    description: "Content domain (src/api/routes/content.ts and content-* modules) behind the content entitlement. Workspace CRUD is deterministic; generation routes are model-backed."
  - name: "cooking"
    description: "Cooking domain (src/api/routes/cooking.ts) behind the cooking entitlement. Token-zero CRUD."
  - name: "finance"
    description: "Finance domain (src/api/routes/finance.ts) behind the finance entitlement."
  - name: "invoices"
    description: "Invoice vendor config and on-demand collection (src/api/routes/invoices.ts) behind the finance entitlement."
  - name: "billing"
    description: "Subscription status, checkout, Apple verification, Nexus Points (src/api/routes/billing.ts). The Apple App Store server notification webhook is out of scope (see description)."
  - name: "plan"
    description: "Multiskill mesh plan (src/api/routes/plan.ts)."
  - name: "notifications"
    description: "Durable content-notification inbox (src/api/routes/notifications.ts)."
  - name: "decisions"
    description: "User-scoped decision orchestration over durable NotificationIntents (src/api/routes/decisions.ts)."
  - name: "device-tokens"
    description: "Push device token registration (src/api/routes/decisions.ts, deviceTokenRoutes)."
  - name: "reports"
    description: "Durable report documents: morning briefing, evening summary, weekly review, coach briefing (src/api/routes/reports.ts)."
  - name: "onboarding"
    description: "Questionnaires and profile (src/api/routes/onboarding.ts). Note: the user profile lives at /api/v1/onboarding/profile; there is no top-level /api/v1/profile route."
  - name: "settings"
    description: "Settings: language, push token, provider/push preferences (src/api/routes/settings.ts)."
paths:
  "/api/v1":
    get:
      operationId: "getApiInfo"
      tags:
        - "meta"
      summary: "API info / health check"
      description: |-
        Source: src/api/router.ts:105

        Public route (no auth). Returns service name, version ("v1"), status, and a human-readable endpoint directory.
      x-nexus-kind: "deterministic"
      x-source: "src/api/router.ts:105"
      security: []
      x-auth: "public"
      responses:
        "200":
          description: "Plain JSON object: { name, version: \"v1\", status, endpoints, auth_note }. Not wrapped in the standard envelope."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/login/email":
    post:
      operationId: "postAuthLoginEmail"
      tags:
        - "auth"
      summary: "Email+password login with per-account lockout (assertNotLocked before bcrypt.compare); issues session"
      description: |-
        Source: src/api/routes/auth.ts:996

        Request body (evidenced fields): email (required), password (required), deviceId (required), deviceName?

        Notes: Locked accounts return the same generic 401 AUTH_FAILED as wrong password (anti-enumeration); lockout detail only in audit log.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:996"
      security: []
      x-auth: "public (IP-bucket rate limited)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Evidenced fields: email (required), password (required), deviceId (required), deviceName?. Route validation code is authoritative for exact shapes."
      responses:
        "201":
          description: "Auth session payload (tokens + user) (Standard success envelope unless noted.)"
        "400":
          description: "Error envelope. Stable code(s): BAD_REQUEST."
        "401":
          description: "Error envelope. Stable code(s): AUTH_FAILED."
        "403":
          description: "Error envelope. Stable code(s): ACCOUNT_SUSPENDED."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/logout":
    post:
      operationId: "postAuthLogout"
      tags:
        - "auth"
      summary: "Revoke this device's refresh token/session, revoke its notification tokens, cancel pending chat actions"
      description: |-
        Source: src/api/routes/auth.ts:1487

        Notes: Per-route verifyJwt. Idempotent — returns 200 even when no matching device row exists.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:1487"
      responses:
        "200":
          description: "{ signedOut: true, devicesRevoked, notificationTokensRevoked, pendingChatActionsCancelled } (Standard success envelope unless noted.)"
        "401":
          description: "Error envelope. Stable code(s): UNAUTHORIZED."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/logout-all":
    post:
      operationId: "postAuthLogoutAll"
      tags:
        - "auth"
      summary: "Revoke every device session and notification token for the user (sign out all devices / suspected credential leak)"
      description: |-
        Source: src/api/routes/auth.ts:1533

        Notes: Per-route verifyJwt. Idempotent.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:1533"
      responses:
        "200":
          description: "{ signedOut: true, devicesRevoked, notificationTokensRevoked, pendingChatActionsCancelled } (Standard success envelope unless noted.)"
        "401":
          description: "Error envelope. Stable code(s): UNAUTHORIZED."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/me":
    get:
      operationId: "getAuthMe"
      tags:
        - "auth"
      summary: "Current user profile: id, name, language, email, emailVerified, tier, authProvider"
      description: |-
        Source: src/api/routes/auth.ts:430

        Notes: Per-route verifyJwt (authMiddleware) inside otherwise-public /auth module. tier derived from getEffectiveEntitlement.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:430"
      responses:
        "200":
          description: "{ id, firstName, lastName?, language, email, emailVerified, tier, authProvider } (Standard success envelope unless noted.)"
        "401":
          description: "Error envelope. Stable code(s): UNAUTHORIZED."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/oauth/initiate":
    post:
      operationId: "postAuthOauthInitiate"
      tags:
        - "auth"
      summary: "Generate an integration OAuth consent URL (Google/Outlook/Strava/Todoist/Notion) with iOS-origin state ios:{userId}:{nonce}"
      description: |-
        Source: src/api/routes/oauth-initiate.ts:54

        Request body (evidenced fields): provider (required; one of 'google','outlook','strava','whoop','todoist','notion')

        Notes: Mounted at router.ts:407 AFTER authMiddleware (router.ts:303). 'whoop' passes validation but always returns 503 COMING_SOON. 'todoist'/'notion' pass validation but getOAuthUrlWithState has no branch for them, so they currently return 503 NOT_CONFIGURED.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/oauth-initiate.ts:54"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Evidenced fields: provider (required; one of 'google','outlook','strava','whoop','todoist','notion'). Route validation code is authoritative for exact shapes."
      responses:
        "200":
          description: "{ url, provider } (Standard success envelope unless noted.)"
        "400":
          description: "Error envelope. Stable code(s): BAD_REQUEST."
        "503":
          description: "Error envelope. Stable code(s): COMING_SOON, NOT_CONFIGURED."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/password-reset/confirm":
    post:
      operationId: "postAuthPasswordResetConfirm"
      tags:
        - "auth"
      summary: "Consume a single-use password-reset token, set the new password, revoke all active device sessions"
      description: |-
        Source: src/api/routes/auth.ts:1374

        Request body (evidenced fields): token (required string), newPassword (required string, min 8 chars)

        Notes: INVALID_TOKEN 400 covers unknown, already-used, expired, and race-lost tokens uniformly. Per-token attempt cap PASSWORD_RESET_MAX_ATTEMPTS.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:1374"
      security: []
      x-auth: "public (IP-bucket rate limited)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Evidenced fields: token (required string), newPassword (required string, min 8 chars). Route validation code is authoritative for exact shapes."
      responses:
        "200":
          description: "{ reset: true, message } (Standard success envelope unless noted.)"
        "400":
          description: "Error envelope. Stable code(s): INVALID_TOKEN, WEAK_PASSWORD."
        "429":
          description: "Error envelope. Stable code(s): TOO_MANY_ATTEMPTS."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/password-reset/request":
    post:
      operationId: "postAuthPasswordResetRequest"
      tags:
        - "auth"
      summary: "Request a password-reset email; always returns the same generic 200 envelope (anti-enumeration, with a minimum response-time floor)"
      description: |-
        Source: src/api/routes/auth.ts:1276

        Request body (evidenced fields): email (string; even missing/malformed email still returns the generic 200 envelope)

        Notes: Only non-200 outcome is 503 EMAIL_UNAVAILABLE when the email service is unconfigured (fails closed before issuing a token). Reset link points at PASSWORD_RESET_BASE_URL || WEB_BASE_URL || https://api.nexushub.me.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:1276"
      security: []
      x-auth: "public (IP-bucket rate limited)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Evidenced fields: email (string; even missing/malformed email still returns the generic 200 envelope). Route validation code is authoritative for exact shapes."
      responses:
        "200":
          description: "{ sent: true, message: 'If that email exists, we sent a reset link.' } (Standard success envelope unless noted.)"
        "503":
          description: "Error envelope. Stable code(s): EMAIL_UNAVAILABLE."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/refresh":
    post:
      operationId: "postAuthRefresh"
      tags:
        - "auth"
      summary: "Exchange refresh token for new access token; rotates refresh token, detects token theft (previous-hash replay revokes all sessions)"
      description: |-
        Source: src/api/routes/auth.ts:301

        Request body (evidenced fields): refreshToken (required)

        Notes: 401 UNAUTHORIZED both for unknown token and for theft detection (replay of previously-rotated token → all user sessions revoked).
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:301"
      security: []
      x-auth: "public (IP-bucket rate limited)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Evidenced fields: refreshToken (required). Route validation code is authoritative for exact shapes."
      responses:
        "200":
          description: "{ accessToken, refreshToken, expiresIn } (Standard success envelope unless noted.)"
        "400":
          description: "Error envelope. Stable code(s): BAD_REQUEST."
        "401":
          description: "Error envelope. Stable code(s): UNAUTHORIZED."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/register":
    post:
      operationId: "postAuthRegister"
      tags:
        - "auth"
      summary: "Invite-code device registration; creates/retrieves a session and issues app JWT + refresh token"
      description: |-
        Source: src/api/routes/auth.ts:242

        Request body (evidenced fields): deviceId (required), acceptedLegal (required, validated against current Terms/Privacy versions), inviteCode (required — gated by inviteGateCode), deviceName?, pushToken?

        Notes: Reads x-language header (en-US/pt-PT/pt-BR) for localized error copy. Sandbox invite targets get beta Max-tier entitlement (grantBetaSandboxAccess). Mounted with IP-bucket rateLimitMiddleware at router.ts:167.
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:242"
      security: []
      x-auth: "public (IP-bucket rate limited)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Evidenced fields: deviceId (required), acceptedLegal (required, validated against current Terms/Privacy versions), inviteCode (required — gated by inviteGateCode), deviceName?, pushToken?. Route validation code is authoritative for exact shapes."
      responses:
        "201":
          description: "Auth session payload from createAuthSessionAndRegisterDevice (access/refresh tokens + user) (Standard success envelope unless noted.)"
        "400":
          description: "Error envelope. Stable code(s): BAD_REQUEST, LEGAL_CONSENT_REQUIRED."
        "403":
          description: "Error envelope. Stable code(s): INVITE_REQUIRED, INVALID_INVITE."
        "500":
          description: "Error envelope. Stable code(s): NO_USER."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/register/apple":
    post:
      operationId: "postAuthRegisterApple"
      tags:
        - "auth"
      summary: "Native Sign in with Apple: verifies Apple identity token (JWKS, nonce, 5m maxAge), finds/creates user, issues session"
      description: |-
        Source: src/api/routes/auth.ts:462

        Request body (evidenced fields): identityToken (required), rawNonce (required), deviceId (required), acceptedLegal (required), deviceName?, firstName?, lastName?, inviteCode?, authorizationCode? (optional — enables Apple token revocation on account deletion)

        Notes: Token audience = app bundle ID. 403 invite codes only when ClosedBetaInviteRequiredError is thrown by user creation. Refuses linking @privaterelay.appleid.com emails to existing non-Apple accounts (409).
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:462"
      security: []
      x-auth: "public (IP-bucket rate limited)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Evidenced fields: identityToken (required), rawNonce (required), deviceId (required), acceptedLegal (required), deviceName?, firstName?, lastName?, inviteCode?, authorizationCode? (optional — enables Apple token revocation on account deletion). Route validation code is authoritative for exact shapes."
      responses:
        "201":
          description: "Auth session payload (tokens + user) (Standard success envelope unless noted.)"
        "400":
          description: "Error envelope. Stable code(s): BAD_REQUEST, LEGAL_CONSENT_REQUIRED."
        "401":
          description: "Error envelope. Stable code(s): INVALID_TOKEN, INVALID_NONCE, AUTH_FAILED."
        "403":
          description: "Error envelope. Stable code(s): INVITE_REQUIRED, INVALID_INVITE."
        "409":
          description: "Error envelope. Stable code(s): PRIVATERELAY_LINK_REFUSED."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/register/apple/finish":
    post:
      operationId: "postAuthRegisterAppleFinish"
      tags:
        - "auth"
      summary: "Finish browser Sign in with Apple: exchanges one-time authCode from the backend callback for a session"
      description: |-
        Source: src/api/routes/auth.ts:646

        Request body (evidenced fields): authCode (required), acceptedLegal (required)
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:646"
      security: []
      x-auth: "public (IP-bucket rate limited)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Evidenced fields: authCode (required), acceptedLegal (required). Route validation code is authoritative for exact shapes."
      responses:
        "201":
          description: "Auth session payload (tokens + user) (Standard success envelope unless noted.)"
        "400":
          description: "Error envelope. Stable code(s): BAD_REQUEST, LEGAL_CONSENT_REQUIRED."
        "401":
          description: "Error envelope. Stable code(s): INVALID_AUTH_CODE."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/register/apple/start":
    post:
      operationId: "postAuthRegisterAppleStart"
      tags:
        - "auth"
      summary: "Start browser-based Sign in with Apple: creates pending session, returns Apple authorize URL"
      description: |-
        Source: src/api/routes/auth.ts:616

        Request body (evidenced fields): deviceId (required), acceptedLegal (required), deviceName?, inviteCode?

        Notes: Route is always registered; returns 503 NOT_CONFIGURED when appleWebSignInConfigured() is false (Apple Services ID credentials not set).
      x-nexus-kind: "deterministic"
      x-source: "src/api/routes/auth.ts:616"
      security: []
      x-auth: "public (IP-bucket rate limited)"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              description: "Evidenced fields: deviceId (required), acceptedLegal (required), deviceName?, inviteCode?. Route validation code is authoritative for exact shapes."
      responses:
        "200":
          description: "{ url, provider: 'apple', flow: 'web' } (Standard success envelope unless noted.)"
        "400":
          description: "Error envelope. Stable code(s): BAD_REQUEST, LEGAL_CONSENT_REQUIRED."
        "503":
          description: "Error envelope. Stable code(s): NOT_CONFIGURED."
        "4XX":
          "$ref": "#/components/responses/ErrorEnvelope"
        "5XX":
          "$ref": "#/components/responses/ErrorEnvelope"
  "/api/v1/auth/register/email":
    post:
      operationId: "postAuthRegisterEmail"
      tags:
        - "auth"
      summary: "Self-serve email+password registration (bcrypt cost 12); auto-sends 6-digit verification code; invite code optional"
      description: |-
        Source: src/api/routes/auth.ts:884

        Request body (evidenced fields): email (required, format-validated), password (required, min 8 chars), firstName (required), deviceId (required), acceptedLegal (required), deviceName?, inviteCode? (optional — only invalid codes rejected)

