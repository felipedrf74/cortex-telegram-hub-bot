# Nexus Hub — isolated Training E2E Docker sandbox
#
# This compose file is intentionally separate from docker-compose.local.yml:
# - no fixed container_name values;
# - no default 8200/8100 host ports;
# - project-scoped volumes by default;
# - isolated host data/log mounts under .local/training-e2e/<run-id>/.
#
# Always run it through scripts/training-e2e-up.sh so the project name,
# ports, DB path, metadata, and cleanup commands are recorded.

services:
  content-engine:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: ${NEXUS_TRAINING_E2E_CONTENT_IMAGE:?run-scoped Training E2E content image is required}
    environment:
      ENV: development
      CONTENT_ENGINE_PORT: "8100"
      NEXUS_BACKEND_BASE_URL: "http://nexus-hub:8200"
      INTERNAL_API_SECRET: ${NEXUS_TRAINING_E2E_INTERNAL_SECRET:-nexus-training-e2e-internal-secret}
      NEXUS_LOCAL_ALLOW_MODEL_CALLS: "0"
      NEXUS_MODEL_FIXTURE_MODE: "1"
      CONTENT_ENGINE_FIXTURE_MODE: "1"
      CONTENT_ENGINE_RESEARCH_NETWORK_DISABLED: "1"
    ports:
      - "127.0.0.1:${NEXUS_TRAINING_E2E_PORT_PY:-18100}:8100"
    volumes:
      - ${NEXUS_TRAINING_E2E_ROOT:-./.local/training-e2e/default}/content-engine-venv:/engine/.venv
      - ${NEXUS_TRAINING_E2E_ROOT:-./.local/training-e2e/default}/logs/content-engine:/engine/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    restart: "no"

  nexus-hub:
    build:
      context: .
      dockerfile: Dockerfile.node
    image: ${NEXUS_TRAINING_E2E_NODE_IMAGE:?run-scoped Training E2E backend image is required}
    depends_on:
      content-engine:
        condition: service_healthy
    environment:
      NODE_ENV: development
      ENV: development
      STAGING: "false"
      PORTAL_ENABLED: "true"
      PORTAL_PORT: "8200"
      PORTAL_BIND: "0.0.0.0"
      PORTAL_READ_TOKEN: ${NEXUS_TRAINING_E2E_PORTAL_READ_TOKEN:-nexus-training-e2e-read-token-2026-06-strong}
      HEALTH_ALLOW_UNAUTHENTICATED: "true"
      IOS_API_ENABLED: "true"
      IOS_API_JWT_SECRET: ${NEXUS_TRAINING_E2E_IOS_API_JWT_SECRET:-nexus-training-e2e-ios-jwt-secret-2026-06-strong-48-byte}
      # Isolate fixture-token signing from any developer keyring; quality
      # users use the run-scoped secret file.
      IOS_API_JWT_KEYS: ""
      IOS_API_JWT_ACTIVE_KID: ""
      IOS_INVITE_CODE: ${NEXUS_TRAINING_E2E_IOS_INVITE_CODE:-LOCAL-TRAINING-E2E}
      PAYWALL_ENABLED: "false"
      PORTAL_ALLOW_LOCAL_BYPASS: "true"
      DATABASE_PATH: "/app/training-e2e-state/data/training-e2e.db"
      # All fixture readers/writers execute inside this container's Linux lock
      # domain. Keep the canonical Docker Desktop rollback-journal posture too
      # so host-side artifact reads after shutdown remain durable and coherent.
      SQLITE_JOURNAL_MODE: "DELETE"
      SQLITE_SYNCHRONOUS: "FULL"
      SQLITE_MMAP_SIZE: "0"
      OAUTH_ENCRYPTION_KEY: ${NEXUS_TRAINING_E2E_OAUTH_KEY:-nexus-training-e2e-oauth-key-2026-06-strong-32-byte}
      FINANCE_ENCRYPTION_ENABLED: "false"
      BACKUP_ENABLED: "false"
      OWNER_TELEGRAM_ID: "100000001"
      CONTENT_ENGINE_ENABLED: "true"
      CONTENT_ENGINE_BASE_URL: "http://content-engine:8100"
      INTERNAL_API_SECRET: ${NEXUS_TRAINING_E2E_INTERNAL_SECRET:-nexus-training-e2e-internal-secret}
      INTERNAL_REQUIRE_LOOPBACK: "false"
      TRAINING_CALENDAR_WRITES_ENABLED: "false"
      TRAINING_CALENDAR_SYNC_ENABLED: "false"
      # F31 (Phase 3): the coaching engine flags are EXPLICIT here so the E2E
      # lane can be run in either posture instead of silently exercising only
      # the flag-off branches. Periodization V2 is on in this isolated lane so
      # §13 can prove a real fixture-backed reflow; this states nothing about
      # production flag state (operator input).
      COACH_RULE_ENFORCEMENT: ${NEXUS_TRAINING_E2E_COACH_RULE_ENFORCEMENT:-off}
      COACH_PERIODIZATION_V2_ENABLED: ${NEXUS_TRAINING_E2E_COACH_PERIODIZATION_V2:-on}
      # The fresh harness creates the owner first and the controlled iOS user
      # second. Explicitly enroll that fixture account so the rewritten
      # Decision Center can prove the real training:plan:write permission
      # boundary instead of manufacturing a confirmation bypass.
      TRAINING_PLAN_REVISION_V1_MODE_USER_2: "active"
      TRAINING_DECISION_FLOW_V1_ENFORCE_ENABLED_USER_2: "true"
      TRAINING_TYPED_WORKOUT_V1_ENABLED_USER_2: "true"
      TRAINING_ADAPTATION_V1_MODE_USER_2: "active"
      TRAINING_PROFILE_SNAPSHOT_ENCRYPTION_KEY: "training-e2e-revision-snapshot-key-20260830"
      TRAINING_SAFETY_GUARDRAILS_ENABLED: ${NEXUS_TRAINING_E2E_SAFETY_GUARDRAILS:-off}
      COACH_KERNEL_EQUIPMENT_AUTHORITY_ENABLED: ${NEXUS_TRAINING_E2E_EQUIPMENT_AUTHORITY:-off}
      COACH_KERNEL_EQUIPMENT_AUTHORITY_SHADOW_ENABLED: ${NEXUS_TRAINING_E2E_EQUIPMENT_AUTHORITY_SHADOW:-off}
      TRAINING_CATALOG_DB_ENABLED: ${NEXUS_TRAINING_E2E_CATALOG_DB:-off}
      TRAINING_COMPLETION_FEEDBACK_V2_ENABLED: ${NEXUS_TRAINING_E2E_COMPLETION_FEEDBACK_V2:-on}
      TRAINING_SELECTOR_POLICY_V2_ENABLED: ${NEXUS_TRAINING_E2E_SELECTOR_POLICY_V2:-off}
      TRAINING_ENDURANCE_COHERENCE_V2_ENABLED: ${NEXUS_TRAINING_E2E_ENDURANCE_COHERENCE_V2:-off}
      # F24 is now covered in the qualifying lane: fixture calendar busy
      # windows must reach the kernel and produce durable capacity rationale.
      TRAINING_CALENDAR_CAPACITY_KERNEL_ENABLED: ${NEXUS_TRAINING_E2E_CAPACITY_KERNEL:-on}
      NEXUS_LOCAL_ALLOW_MODEL_CALLS: "0"
      NEXUS_MODEL_FIXTURE_MODE: "1"
      NEXUS_MULTISKILL_MESH: "on"
      TIMEZONE: "Europe/Lisbon"
      LOG_LEVEL: ${NEXUS_TRAINING_E2E_LOG_LEVEL:-info}
      NEXUS_TRAINING_E2E_RUN_ID: ${NEXUS_TRAINING_E2E_RUN_ID:-training-e2e-default}
    ports:
      - "127.0.0.1:${NEXUS_TRAINING_E2E_PORT_TS:-18200}:8200"
    volumes:
      - ${NEXUS_TRAINING_E2E_SOURCE_ROOT:?Training E2E source root is required}/scripts:/app/scripts:ro
      - ${NEXUS_TRAINING_E2E_ROOT:-./.local/training-e2e/default}:/app/training-e2e-state
      - ${NEXUS_TRAINING_E2E_ROOT:-./.local/training-e2e/default}/logs/backend:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8200/health"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12
    restart: "no"
