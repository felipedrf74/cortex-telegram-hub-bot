# Shared non-waiting root maintenance mutex. The lock contains no data.
# Root owns it; the SSH release operator can open it through its private group.
#
# The `-sonar` filename is historical. SonarQube is decommissioned, but this lock
# was never really about Sonar: it serializes root maintenance transactions
# against each other — the PM2 release fallback, the chat capability-flag
# operator, data-key rotation, and Ollama install/finalize all take it in the
# same order to avoid deadlock. That mutual exclusion is a safety property
# independent of Sonar, so the lock is retained.
#
# The path is deliberately unchanged: renaming it would require every installed
# script and this tmpfiles rule to change together on a live host, for no
# functional gain. Install with:
#   sudo install -o root -g root -m 644 \
#     ops/nexus-release/nexus-release-maintenance-lock.conf \
#     /etc/tmpfiles.d/nexus-release-maintenance-lock.conf
#   sudo systemd-tmpfiles --create
f /run/lock/nexus-release-sonar.lock 0660 root dominguez - -
